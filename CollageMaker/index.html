<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollageMaker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
    <link href="../src/css/variables.css" rel="stylesheet">
    <link href="../src/css/Style.css" rel="stylesheet">
    <link href="./Style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
    <button id="themeToggle" onclick="toggleTheme()" title="Toggle theme">
        <span id="theme-icon" class="material-icons">bedtime</span>
    </button>

    <div id="app">
        <!-- Toolbar -->
        <div id="toolbar" class="collage-toolbar">
            <div class="app-title-group">
                <h2 class="app-title">CollageMaker</h2>
                <a href="/index.html" target="_blank" rel="noopener noreferrer" class="home-link" title="Go to home page" aria-label="Go to home page">
                    <span class="material-icons home-icon">home</span>
                </a>
            </div>
            <div class="toolbar-actions">
                <button id="addImagesBtn" class="pure-button pure-button-primary" @click="triggerFilePicker">
                    <span class="material-icons" style="vertical-align: middle; margin-right: 4px;">add_photo_alternate</span>
                    Add Images
                </button>
                <input type="file" id="fileInput" ref="fileInput" multiple accept="image/*" style="display: none;" @change="handleFileInputChange">
                <div class="toolbar-divider"></div>
                <button id="undoBtn" class="pure-button toolbar-icon-btn" @click="undo" :disabled="!canUndo" title="Undo (Cmd+Z)">
                    <span class="material-icons">undo</span>
                </button>
                <button id="redoBtn" class="pure-button toolbar-icon-btn" @click="redo" :disabled="!canRedo" title="Redo (Cmd+Shift+Z)">
                    <span class="material-icons">redo</span>
                </button>
                <div class="toolbar-divider"></div>
                <button id="clearAllBtn" class="pure-button" @click="clearAllImages" :disabled="images.length === 0">
                    Clear All
                </button>
                <div class="toolbar-divider"></div>
                <button id="sidebarToggleBtn" class="pure-button toolbar-icon-btn" @click="toggleRightSidebar" title="Toggle panel">
                    <span class="material-icons">{{ rightSidebarOpen ? 'chevron_right' : 'chevron_left' }}</span>
                </button>
            </div>
        </div>

        <!-- Three-Panel Layout -->
        <div id="mainLayout" class="main-layout">
            <!-- Left Sidebar: Image Library + Layout -->
            <div id="sidebar-left" class="sidebar sidebar-left">
                <div class="sidebar-scroll-container">
                    <div class="sidebar-section" v-for="section in leftSidebarSections" :key="'left-' + section.id">
                        <button class="sidebar-section-header" @click="toggleLeftSection(section.id)" :aria-expanded="expandedLeftSections[section.id]" :aria-controls="'left-section-content-' + section.id">
                            <span class="section-chevron" :class="{ expanded: expandedLeftSections[section.id] }">▶</span>
                            <span>{{ section.label }}
                                <span v-if="section.id === 'library'" class="section-count">({{ images.length }})</span>
                            </span>
                        </button>
                        <div class="sidebar-section-content" :id="'left-section-content-' + section.id" v-show="expandedLeftSections[section.id]">
                            <!-- Image Library Section -->
                            <template v-if="section.id === 'library'">
                                <div class="library-search">
                                    <input type="text" v-model="searchQuery" placeholder="Search by filename..." class="pure-input-rounded">
                                </div>
                                <div class="image-library">
                                    <div v-if="filteredImages.length === 0" class="empty-library">
                                        <span class="material-icons" style="font-size: 48px; opacity: 0.4;">image</span>
                                        <p>No images yet</p>
                                        <p class="hint">Drag &amp; drop images here or click "Add Images"</p>
                                    </div>
                                    <div v-for="(image, index) in filteredImages" :key="image.id"
                                         class="image-item"
                                         :class="{ selected: selectedImageId === image.id }"
                                         @click="selectImage(index)">
                                        <div class="image-number">{{ index + 1 }}</div>
                                        <img :src="image.thumbnail" :alt="image.filename" class="image-thumb">
                                        <div class="image-name" :title="image.filename">{{ truncateFilename(image.filename) }}</div>
                                        <button class="remove-btn" @click.stop="removeImage(index)" title="Remove">
                                            <span class="material-icons">close</span>
                                        </button>
                                    </div>
                                </div>
                            </template>

                            <!-- Layout Section (moved from right sidebar) -->
                            <template v-if="section.id === 'layout'">
                                <div class="detail-section">
                                    <label for="layoutStyleSelect">Layout Style</label>
                                    <select id="layoutStyleSelect" v-model="layoutStyle" class="pure-input-rounded" @focus="snapshotLayoutStyle" @change="onLayoutStyleChange">
                                        <option v-for="style in layoutStyles" :key="style.value" :value="style.value">{{ style.label }}</option>
                                    </select>
                                </div>
                                <div class="detail-section" v-show="layoutStyle !== 'hexagonal'">
                                    <label for="gutterSlider">Gutter: {{ gutter }}px</label>
                                    <input type="range" id="gutterSlider" v-model.number="gutter" min="0" max="20" step="1" class="fullRange" @focus="snapshotLayoutOptions" @pointerdown="snapshotLayoutOptions" @input="onGutterChange" @blur="commitLayoutOptions">
                                </div>
                                <div class="detail-section" v-if="layoutStyle === 'diagonalSlices'">
                                    <label for="sliceAngleSlider">Slice Angle: {{ sliceAngle }}&deg;</label>
                                    <input type="range" id="sliceAngleSlider" v-model.number="sliceAngle" min="-75" max="75" step="1" class="fullRange" @focus="snapshotLayoutOptions" @pointerdown="snapshotLayoutOptions" @input="onSliceAngleChange" @blur="commitLayoutOptions">
                                </div>
                                <div class="detail-section" v-if="layoutStyle === 'hexagonal'">
                                    <label for="hexSpacingSlider">Hex Spacing: {{ hexSpacing }}px</label>
                                    <input type="range" id="hexSpacingSlider" v-model.number="hexSpacing" min="0" max="30" step="1" class="fullRange" @focus="snapshotLayoutOptions" @pointerdown="snapshotLayoutOptions" @input="onHexSpacingChange" @blur="commitLayoutOptions">
                                </div>
                                <div class="detail-section" v-if="layoutStyle === 'hexagonal'">
                                    <label for="hexSizeSlider">Hexagon Size: {{ Math.round(hexSizeMultiplier * 100) }}%</label>
                                    <input type="range" id="hexSizeSlider" v-model.number="hexSizeMultiplier" min="0.5" max="2" step="0.05" class="fullRange" @focus="snapshotLayoutOptions" @pointerdown="snapshotLayoutOptions" @input="onHexSizeMultiplierChange" @blur="commitLayoutOptions">
                                </div>
                                <div class="layout-shortcut-hint">
                                    Shortcuts: Alt+1 Uniform · Alt+2 Hero · Alt+3 Mosaic · Alt+4 Slices · Alt+5 Hex
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center: Canvas Area -->
            <div id="canvas-area" class="canvas-area">
                <div id="canvasContainer" class="canvas-container">
                    <div v-if="images.length === 0" class="canvas-placeholder">
                        <span class="material-icons" style="font-size: 64px; opacity: 0.3;">photo_library</span>
                        <h3>No Images Loaded</h3>
                        <p>Drag &amp; drop images onto this area, or use the "Add Images" button above.</p>
                    </div>
                    <canvas id="previewCanvas" v-show="images.length > 0" role="application" aria-label="Collage preview — select panels to edit, drag to swap images in hexagonal layout"></canvas>
                    <!-- Progress overlay for image loading -->
                    <div class="progress-overlay" v-show="imageLoadingProgress.visible"
                         role="progressbar"
                         :aria-valuenow="imageLoadingProgress.current"
                         :aria-valuemax="imageLoadingProgress.total"
                         aria-label="Loading images">
                        <div class="progress-bar-track">
                            <div class="progress-bar-fill"
                                 :style="{ width: (imageLoadingProgress.total > 0
                                    ? (imageLoadingProgress.current / imageLoadingProgress.total) * 100
                                    : 0) + '%' }">
                            </div>
                        </div>
                        <span class="progress-label">{{ imageLoadingProgress.current }} / {{ imageLoadingProgress.total }} images</span>
                    </div>
                </div>
            </div>

            <!-- Toast Notification -->
            <div class="toast-notification"
                 v-show="toast.visible"
                 :class="'toast-' + toast.type"
                 role="status"
                 aria-live="polite">
                <span class="material-icons" aria-hidden="true">{{ toast.type === 'error' ? 'error' : 'info' }}</span>
                {{ toast.message }}
            </div>

            <!-- Right Sidebar: Detail / Editor Panel -->
            <div id="sidebar-right" class="sidebar sidebar-right" :class="{ 'sidebar-collapsed': !rightSidebarOpen }">
                <div class="sidebar-scroll-container">
                    <!-- Collapsible Sections -->
                    <div class="sidebar-section" v-for="section in sidebarSections" :key="section.id">
                        <button class="sidebar-section-header" @click="toggleSection(section.id)" :aria-expanded="expandedSections[section.id]" :aria-controls="'section-content-' + section.id">
                            <span class="section-chevron" :class="{ expanded: expandedSections[section.id] }">▶</span>
                            <span>{{ section.label }}</span>
                        </button>
                        <div class="sidebar-section-content" :id="'section-content-' + section.id" v-show="expandedSections[section.id]">
                            <!-- Title Section -->
                            <template v-if="section.id === 'title'">
                                <div class="detail-section">
                                    <label for="titleInput">Title (max 3 lines)</label>
                                    <textarea id="titleInput" v-model="titleText" @focus="snapshotTitleText" @input="onTitleTextChange" @select="onTitleSelectionChange" @click="onTitleSelectionChange" @keyup="onTitleSelectionChange" @keydown.enter="onTitleEnterKey" @blur="commitTitleText" placeholder="Enter title text..." rows="3" maxlength="200" class="pure-input-rounded title-textarea"></textarea>
                                </div>
                                <div class="detail-section">
                                    <div class="formatting-bar">
                                        <button class="format-btn" :class="{ active: isTitleFormatActive('bold') }" @mousedown.prevent @click="toggleTitleBold" title="Bold" :disabled="titleSelectionStart === titleSelectionEnd" :aria-pressed="isTitleFormatActive('bold')">
                                            <strong>B</strong>
                                        </button>
                                        <button class="format-btn" :class="{ active: isTitleFormatActive('italic') }" @mousedown.prevent @click="toggleTitleItalic" title="Italic" :disabled="titleSelectionStart === titleSelectionEnd" :aria-pressed="isTitleFormatActive('italic')">
                                            <em>I</em>
                                        </button>
                                        <button class="format-btn" :class="{ active: isTitleFormatActive('underline') }" @mousedown.prevent @click="toggleTitleUnderline" title="Underline" :disabled="titleSelectionStart === titleSelectionEnd" :aria-pressed="isTitleFormatActive('underline')">
                                            <u>U</u>
                                        </button>
                                    </div>
                                </div>
                                <div class="detail-section">
                                    <label for="titleFontSelect">Font</label>
                                    <select id="titleFontSelect" v-model="titleStyle.fontFamily" class="pure-input-rounded" @focus="snapshotTitleStyle" @change="onTitleFontFamilyChange" @blur="commitTitleStyle">
                                        <option v-for="font in ['Arial', 'Helvetica', 'Times New Roman', 'Georgia', 'Courier New', 'Verdana', 'Trebuchet MS', 'Impact', 'Comic Sans MS', 'Palatino', 'Lucida Console', 'Garamond', 'Bookman']" :key="font" :value="font">{{ font }}</option>
                                    </select>
                                </div>
                                <div class="detail-section">
                                    <label for="titleFontSizeSlider">Size: {{ titleStyle.fontSize }}pt</label>
                                    <input type="range" id="titleFontSizeSlider" v-model.number="titleStyle.fontSize" min="12" max="120" step="1" class="fullRange" @focus="snapshotTitleStyle" @pointerdown="snapshotTitleStyle" @input="onTitleFontSizeChange" @blur="commitTitleStyle">
                                </div>
                                <div class="detail-section">
                                    <label for="titleFontColorPicker">Font Color</label>
                                    <div class="color-picker-row">
                                        <input type="color" id="titleFontColorPicker" v-model="titleStyle.fontColor" @focus="snapshotTitleStyle" @input="onTitleFontColorChange" @blur="commitTitleStyle">
                                    </div>
                                </div>
                                <div class="detail-section">
                                    <label for="titleFontOpacitySlider">Font Opacity: {{ Math.round(titleStyle.fontOpacity * 100) }}%</label>
                                    <input type="range" id="titleFontOpacitySlider" v-model.number="titleStyle.fontOpacity" min="0" max="1" step="0.01" :aria-valuenow="Math.round(titleStyle.fontOpacity * 100) + '%'" aria-valuemin="0%" aria-valuemax="100%" class="fullRange" @focus="snapshotTitleStyle" @pointerdown="snapshotTitleStyle" @input="onTitleFontOpacityChange" @blur="commitTitleStyle">
                                </div>
                                <div class="detail-section">
                                    <label for="titleBgColorPicker">Background Color</label>
                                    <div class="color-picker-row">
                                        <input type="color" id="titleBgColorPicker" v-model="titleStyle.backgroundColor" @focus="snapshotTitleStyle" @input="onTitleBackgroundColorChange" @blur="commitTitleStyle">
                                    </div>
                                </div>
                                <div class="detail-section">
                                    <label for="titleBgOpacitySlider">Bg Opacity: {{ Math.round(titleStyle.bgOpacity * 100) }}%</label>
                                    <input type="range" id="titleBgOpacitySlider" v-model.number="titleStyle.bgOpacity" min="0" max="1" step="0.01" :aria-valuenow="Math.round(titleStyle.bgOpacity * 100) + '%'" aria-valuemin="0%" aria-valuemax="100%" class="fullRange" @focus="snapshotTitleStyle" @pointerdown="snapshotTitleStyle" @input="onTitleBgOpacityChange" @blur="commitTitleStyle">
                                </div>
                                <div class="detail-section">
                                    <label>
                                        <input type="checkbox" :checked="titleStyle.showBackground" @change="toggleTitleShowBackground">
                                        Show Background
                                    </label>
                                </div>
                                <div class="detail-section">
                                    <label>Alignment</label>
                                    <div class="segmented-control">
                                        <button class="segment-btn" :class="{ active: titleStyle.alignment === 'left' }" @click="setTitleAlignment('left')">
                                            <span class="material-icons" style="font-size: 18px;">format_align_left</span>
                                        </button>
                                        <button class="segment-btn" :class="{ active: titleStyle.alignment === 'center' }" @click="setTitleAlignment('center')">
                                            <span class="material-icons" style="font-size: 18px;">format_align_center</span>
                                        </button>
                                        <button class="segment-btn" :class="{ active: titleStyle.alignment === 'right' }" @click="setTitleAlignment('right')">
                                             <span class="material-icons" style="font-size: 18px;">format_align_right</span>
                                         </button>
                                     </div>
                                 </div>
                                  <div class="detail-section">
                                      <label for="titleWidthSlider">Width: {{ titleStyle.titleBoxWidth ? Math.round(titleStyle.titleBoxWidth) : 'Auto' }}</label>
                                      <input type="range" id="titleWidthSlider" v-model.number="titleStyle.titleBoxWidth" min="100" max="1920" step="1" :aria-valuenow="(titleStyle.titleBoxWidth ? Math.round(titleStyle.titleBoxWidth) + 'px' : 'Auto')" aria-valuemin="100px" aria-valuemax="1920px" class="fullRange" @focus="snapshotTitleStyle" @pointerdown="snapshotTitleStyle" @input="onTitleWidthChange" @blur="commitTitleStyle">
                                  </div>
                                  <div class="detail-section">
                                      <button class="pure-button reset-title-btn" @click="resetTitlePosition">
                                          <span class="material-icons" style="font-size: 16px; vertical-align: middle; margin-right: 4px;" aria-hidden="true">restart_alt</span>
                                          Reset Position
                                      </button>
                                  </div>
                              </template>

                            <!-- Crop Section -->
                            <template v-if="section.id === 'crop'">
                                <template v-if="selectedPanelId && selectedCropInfo">
                                    <div class="detail-section crop-preview-section">
                                        <canvas id="cropPreviewCanvas" class="crop-preview-canvas" role="application" aria-label="Crop editor — drag handles to adjust crop region"></canvas>
                                        <div class="crop-info">
                                            <span class="crop-info-item">X: {{ Math.round(selectedCropInfo.sourceRect.x) }}</span>
                                            <span class="crop-info-item">Y: {{ Math.round(selectedCropInfo.sourceRect.y) }}</span>
                                            <span class="crop-info-item">W: {{ Math.round(selectedCropInfo.sourceRect.width) }}</span>
                                            <span class="crop-info-item">H: {{ Math.round(selectedCropInfo.sourceRect.height) }}</span>
                                        </div>
                                        <button class="pure-button reset-crop-btn" @click="resetSelectedCrop">
                                            <span class="material-icons" style="font-size: 16px; vertical-align: middle; margin-right: 4px;">restart_alt</span>
                                            Reset Crop
                                        </button>
                                    </div>
                                </template>
                                <template v-else-if="images.length > 0">
                                    <div class="detail-section crop-placeholder-section">
                                        <span class="material-icons crop-placeholder-icon">crop_free</span>
                                        <p>Select a panel on the canvas to edit its crop.</p>
                                    </div>
                                </template>
                            </template>

                            <!-- Background Section -->
                            <template v-if="section.id === 'background'">
                                <div class="detail-section">
                                    <label>Style</label>
                                    <div class="segmented-control">
                                        <button class="segment-btn" :class="{ active: backgroundStyle === 'solid' }" @click="setBackgroundStyle('solid')">Solid</button>
                                        <button class="segment-btn" :class="{ active: backgroundStyle === 'gradient' }" @click="setBackgroundStyle('gradient')">Gradient</button>
                                        <button class="segment-btn" :class="{ active: backgroundStyle === 'image' }" @click="setBackgroundStyle('image')">Image</button>
                                    </div>
                                </div>
                                <div class="detail-section" v-if="backgroundStyle === 'solid'">
                                    <label for="bgColorPicker">Color</label>
                                    <div class="color-picker-row">
                                        <input type="color" id="bgColorPicker" v-model="backgroundColor" @focus="snapshotBackground" @input="onBackgroundColorChange" @blur="commitBackground">
                                    </div>
                                </div>
                                <template v-if="backgroundStyle === 'gradient'">
                                    <div class="detail-section">
                                        <label for="gradientColor1">Color 1</label>
                                        <div class="color-picker-row">
                                             <input type="color" id="gradientColor1" v-model="backgroundColor" @focus="snapshotBackground" @input="onGradientColor1Change" @blur="commitBackground">
                                        </div>
                                    </div>
                                    <div class="detail-section">
                                        <label for="gradientColor2">Color 2</label>
                                        <div class="color-picker-row">
                                             <input type="color" id="gradientColor2" :value="gradientColors ? gradientColors[1] : '#333333'" @focus="snapshotBackground" @input="onGradientColor2Input($event)" @blur="commitBackground">
                                        </div>
                                    </div>
                                    <div class="detail-section">
                                        <label for="gradientAngleSlider">Angle: {{ gradientAngle }}&deg;</label>
                                        <input type="range" id="gradientAngleSlider" v-model.number="gradientAngle" min="0" max="360" step="1" class="fullRange" @focus="snapshotBackground" @pointerdown="snapshotBackground" @input="onGradientAngleChange" @blur="commitBackground">
                                    </div>
                                </template>
                                <template v-if="backgroundStyle === 'image'">
                                    <div class="detail-section">
                                        <label for="bgImageInput">Background Image</label>
                                        <input type="file" id="bgImageInput" accept="image/*" @change="handleBackgroundImageChange" class="file-input-styled">
                                        <button v-if="backgroundImage" class="pure-button remove-bg-btn" @click="removeBackgroundImageAtomic()">
                                            <span class="material-icons" style="font-size: 16px; vertical-align: middle; margin-right: 4px;">delete</span>
                                            Remove Image
                                        </button>
                                    </div>
                                    <div class="detail-section">
                                        <label for="bgOpacitySlider">Opacity: {{ Math.round(backgroundOpacity * 100) }}%</label>
                                        <input type="range" id="bgOpacitySlider" v-model.number="backgroundOpacity" min="0" max="1" step="0.01" class="fullRange" @focus="snapshotBackground" @pointerdown="snapshotBackground" @input="onBackgroundOpacityChange" @blur="commitBackground">
                                    </div>
                                </template>
                            </template>

                            <!-- Overlay Section -->
                            <template v-if="section.id === 'overlay'">
                                <div class="detail-section">
                                    <label for="overlayImageInput">Mask Image</label>
                                    <input type="file" id="overlayImageInput" accept="image/*" @change="handleOverlayImageChange" class="file-input-styled">
                                    <button v-if="overlayImage" class="pure-button remove-overlay-btn" @click="removeOverlayAtomic()">
                                        <span class="material-icons" style="font-size: 16px; vertical-align: middle; margin-right: 4px;">delete</span>
                                        Remove Mask
                                    </button>
                                </div>
                                <div class="detail-section" v-if="overlayImage">
                                    <label for="overlayModeSelect">Blend Mode</label>
                                    <select id="overlayModeSelect" v-model="overlayMode" class="pure-input-rounded" @focus="snapshotOverlay" @change="onOverlayModeChange" @blur="commitOverlay">
                                        <option value="source-over">Normal</option>
                                        <option value="multiply">Multiply</option>
                                        <option value="screen">Screen</option>
                                        <option value="overlay">Overlay</option>
                                        <option value="darken">Darken</option>
                                        <option value="lighten">Lighten</option>
                                        <option value="color-dodge">Color Dodge</option>
                                        <option value="color-burn">Color Burn</option>
                                        <option value="hard-light">Hard Light</option>
                                        <option value="soft-light">Soft Light</option>
                                        <option value="difference">Difference</option>
                                        <option value="exclusion">Exclusion</option>
                                        <option value="hue">Hue</option>
                                        <option value="saturation">Saturation</option>
                                        <option value="color">Color</option>
                                        <option value="luminosity">Luminosity</option>
                                    </select>
                                </div>
                                <div class="detail-section" v-if="overlayImage">
                                    <label for="overlayOpacitySlider">Opacity: {{ Math.round(overlayOpacity * 100) }}%</label>
                                    <input type="range" id="overlayOpacitySlider" v-model.number="overlayOpacity" min="0" max="1" step="0.01" class="fullRange" @focus="snapshotOverlay" @pointerdown="snapshotOverlay" @input="onOverlayOpacityChange" @blur="commitOverlay">
                                </div>
                            </template>

                            <!-- Export Section -->
                            <template v-if="section.id === 'export'">
                                <div class="detail-section">
                                    <label id="exportFormatLabel">Format</label>
                                    <div class="segmented-control" role="radiogroup" aria-labelledby="exportFormatLabel">
                                        <button class="segment-btn" :class="{ active: exportFormat === 'jpeg' }" role="radio" :aria-checked="exportFormat === 'jpeg'" @click="exportFormat = 'jpeg'">JPEG</button>
                                        <button class="segment-btn" :class="{ active: exportFormat === 'png' }" role="radio" :aria-checked="exportFormat === 'png'" @click="exportFormat = 'png'">PNG</button>
                                    </div>
                                </div>
                                <div class="detail-section" v-if="exportFormat === 'jpeg'">
                                    <label for="exportQualitySlider">Quality: {{ Math.round(exportQuality * 100) }}%</label>
                                    <input type="range" id="exportQualitySlider" v-model.number="exportQuality" min="0.5" max="1" step="0.01" class="fullRange" @input="onExportQualityChange">
                                </div>
                                <div class="detail-section">
                                    <button id="exportBtn" class="pure-button pure-button-primary export-btn" @click="exportCollage" :disabled="isExporting || images.length === 0" :title="'Export as ' + (exportFormat === 'jpeg' ? 'JPEG' : 'PNG') + ' (Cmd+E)'" :aria-busy="isExporting">
                                        <span v-if="isExporting" class="material-icons export-spinner" aria-hidden="true">autorenew</span>
                                        <span v-else class="material-icons" style="vertical-align: middle; margin-right: 4px;">save</span>
                                        {{ isExporting ? 'Exporting...' : 'Export ' + exportFormat.toUpperCase() }}
                                    </button>
                                    <div v-if="exportStatus" class="export-status" :class="{ 'status-success': exportStatus.includes('success'), 'status-error': exportStatus.includes('failed') }">
                                        {{ exportStatus }}
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
                                    </div>
                                </div>

    <script src="../src/js/themeSwitcher.js"></script>
    <script type="module">
        import { createApp } from 'https://unpkg.com/vue@3.5.30/dist/vue.esm-browser.js';
        import { initializeCollageBase } from './MyESModules/App/CollageBase.js';
        import { createCollageApp } from './MyESModules/App/createCollageApp.js';
        import { createCollageData } from './MyESModules/App/createCollageData.js';
        import { createCollageMethods } from './MyESModules/App/createCollageMethods.js';
        import { createCollageLifecycle } from './MyESModules/App/createCollageLifecycle.js';
        import { createCollageServices } from './MyESModules/App/createCollageServices.js';

        const base = initializeCollageBase();

        // DOM element IDs — injected to avoid hardcoded getElementById calls
        const domIds = {
            previewCanvas: 'previewCanvas',
            cropPreviewCanvas: 'cropPreviewCanvas',
            fileInput: 'fileInput'
        };

        const dataConfig = createCollageData(base);
        const methodsConfig = createCollageMethods(base, domIds);
        const lifecycleConfig = createCollageLifecycle(base, domIds);
        const servicesConfig = createCollageServices(base);

        const app = createCollageApp({
            createApp,
            dataConfig,
            methodsConfig,
            lifecycleConfig,
            servicesConfig
        }).mount('#app');
    </script>
</body>
