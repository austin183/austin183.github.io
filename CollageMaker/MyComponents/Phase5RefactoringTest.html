<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 5 — Refactoring & Architecture Tests</title>
    <link rel="stylesheet" href="https://unpkg.com/mocha@10.2.0/mocha.css">
    <style>

<body>
    <h1>CollageMaker — Phase 5 Refactoring Tests</h1>
    <p class="test-plan-ref">Covers: Phase 5 — CR-15 (DOM ID injection), CR-14 (callback pattern), CR-02 (getLayoutOptions), CR-12 (method extraction)</p>
    <div id="mocha"></div>

    <script src="https://unpkg.com/mocha@10.2.0/mocha.js"></script>
    <script src="https://unpkg.com/chai@4.3.10/chai.js"></script>
    <script>mocha.setup('bdd');</script>

    <script type="module">
        import { createCollageData } from '../MyESModules/App/createCollageData.js';
        import { createCollageMethods } from '../MyESModules/App/createCollageMethods.js';
        import { createCollageLifecycle } from '../MyESModules/App/createCollageLifecycle.js';
        import { createFileHandlers } from '../MyESModules/App/createFileHandlers.js';
        import { createLayoutHandlers } from '../MyESModules/App/createLayoutHandlers.js';
        import { createCropHandlers } from '../MyESModules/App/createCropHandlers.js';
        import { createBackgroundHandlers } from '../MyESModules/App/createBackgroundHandlers.js';
        import { createTitleHandlers } from '../MyESModules/App/createTitleHandlers.js';
        import { createOverlayHandlers } from '../MyESModules/App/createOverlayHandlers.js';
        import { LayoutGenerator } from '../MyESModules/Layout/LayoutGenerator.js';
        import { LayoutStyle } from '../MyESModules/Models/LayoutStyle.js';
        import { createRenderMethods } from '../MyESModules/App/createRenderMethods.js';
        import { createCropPreviewRenderer } from '../MyESModules/App/createCropPreviewRenderer.js';
        import { createUndoMethods } from '../MyESModules/App/createUndoMethods.js';

        const { expect } = chai;

        // ============================================================
        // Helpers
        // ============================================================

        function createMockBase() {
            return {
                assembler: { render: () => {} },
                dropHandler: { setupGlobalDrop: () => () => {} },
                getCanvasRenderer: () => null,
                setCanvasRenderer: () => {},
                getLayoutManager: () => null,
                setLayoutManager: () => {},
                getCropManager: () => null,
                setCropManager: () => {},
                getImageLibrary: () => null,
                setImageLibrary: () => {},
                getBackgroundManager: () => null,
                setBackgroundManager: () => {},
                getTitleManager: () => null,
                setTitleManager: () => {},
                undoManager: null,
                layoutStyleOptions: []
            };
        }

        // ============================================================
        // 5.1 CR-15: DOM ID Injection
        // ============================================================
        describe('Section 5.1 — DOM ID Injection (CR-15)', () => {
            let mockBase;

            beforeEach(() => {
                mockBase = createMockBase();
            });

            it('5.1.1 — createCollageMethods accepts domIds config', () => {
                const methods = createCollageMethods(mockBase, {
                    fileInput: 'customFileInput',
                    cropPreviewCanvas: 'customCropCanvas'
                });
                expect(methods).to.be.an('object');
                expect(methods._scheduleRender).to.be.a('function');
                expect(methods._scheduleCropPreviewRender).to.be.a('function');
            });

            it('5.1.2 — createCollageMethods uses default IDs when domIds omitted', () => {
                const methods = createCollageMethods(mockBase);
                expect(methods).to.be.an('object');
                expect(methods._scheduleRender).to.be.a('function');
            });

            it('5.1.3 — createCollageLifecycle accepts domIds config', () => {
                const lifecycle = createCollageLifecycle(mockBase, {
                    previewCanvas: 'customPreview',
                    cropPreviewCanvas: 'customCrop'
                });
                expect(lifecycle).to.be.an('object');
                expect(lifecycle.mounted).to.be.a('function');
                expect(lifecycle.beforeUnmount).to.be.a('function');
            });

            it('5.1.4 — createCollageLifecycle uses default IDs when domIds omitted', () => {
                const lifecycle = createCollageLifecycle(mockBase);
                expect(lifecycle).to.be.an('object');
                expect(lifecycle.mounted).to.be.a('function');
            });

            it('5.1.5 — createFileHandlers accepts fileInputId parameter', () => {
                const handlers = createFileHandlers(
                    () => null,
                    () => {},
                    'customFileInput'
                );
                expect(handlers).to.be.an('object');
                expect(handlers.triggerFilePicker).to.be.a('function');
                expect(handlers.handleFileInputChange).to.be.a('function');
            });

            it('5.1.6 — createFileHandlers uses default fileInputId', () => {
                const handlers = createFileHandlers(() => null, () => {});
                expect(handlers).to.be.an('object');
                expect(handlers.triggerFilePicker).to.be.a('function');
            });

            it('5.1.7 — Partial domIds merges with defaults', () => {
                const methods = createCollageMethods(mockBase, {
                    fileInput: 'customFileInput'
                    // cropPreviewCanvas omitted — should use default
                });
                expect(methods).to.be.an('object');
                expect(methods._scheduleRender).to.be.a('function');
            });
        });

        // ============================================================
        // 5.2 CR-14: Handler Callback Pattern
        // ============================================================
        describe('Section 5.2 — Handler Callback Pattern (CR-14)', () => {
            it('5.2.1 — createLayoutHandlers accepts onRenderScheduled callback', () => {
                let callbackCalled = false;
                const handlers = createLayoutHandlers(
                    () => null,
                    () => { callbackCalled = true; }
                );
                expect(handlers.onLayoutStyleChange).to.be.a('function');
                // Call handler — callback should be invoked
                handlers.onLayoutStyleChange.call({ layoutStyle: 'hero' });
                expect(callbackCalled).to.be.true;
            });

            it('5.2.2 — createCropHandlers accepts onRenderScheduled and onCropPreviewRender callbacks', () => {
                let renderCalled = false;
                let cropPreviewCalled = false;
                const handlers = createCropHandlers(
                    () => null,
                    () => { renderCalled = true; },
                    () => { cropPreviewCalled = true; }
                );
                expect(handlers.selectPanel).to.be.a('function');
                expect(handlers.resetSelectedCrop).to.be.a('function');
            });

            it('5.2.3 — createBackgroundHandlers accepts onRenderScheduled callback', () => {
                let callbackCalled = false;
                const handlers = createBackgroundHandlers(
                    () => null,
                    () => { callbackCalled = true; }
                );
                expect(handlers.onBackgroundStyleChange).to.be.a('function');
                handlers.onBackgroundStyleChange.call({ backgroundStyle: 'solid' });
                expect(callbackCalled).to.be.true;
            });

            it('5.2.4 — createTitleHandlers accepts onRenderScheduled callback', () => {
                let callbackCalled = false;
                const handlers = createTitleHandlers(
                    () => null,
                    () => { callbackCalled = true; }
                );
                expect(handlers.onTitleTextChange).to.be.a('function');
                handlers.onTitleTextChange.call({ titleText: 'test' });
                expect(callbackCalled).to.be.true;
            });

            it('5.2.5 — createOverlayHandlers accepts onRenderScheduled callback', () => {
                let callbackCalled = false;
                const handlers = createOverlayHandlers(
                    () => { callbackCalled = true; }
                );
                expect(handlers.onOverlayModeChange).to.be.a('function');
                handlers.onOverlayModeChange.call({ overlayMode: 'multiply' });
                expect(callbackCalled).to.be.true;
            });

            it('5.2.6 — createFileHandlers uses onRegenerate callback', () => {
                let regenerateCalled = false;
                const handlers = createFileHandlers(
                    () => ({ addImages: async () => {} }),
                    () => { regenerateCalled = true; }
                );
                expect(handlers.handleFileInputChange).to.be.a('function');
            });

            it('5.2.7 — Layout handler callback receives Vue instance', () => {
                let receivedVm = null;
                const handlers = createLayoutHandlers(
                    () => null,
                    (vm) => { receivedVm = vm; }
                );
                const mockVm = { layoutStyle: 'hero', _testMarker: true };
                handlers.onLayoutStyleChange.call(mockVm);
                expect(receivedVm).to.equal(mockVm);
                expect(receivedVm._testMarker).to.be.true;
            });

            it('5.2.8 — Background handler callback receives Vue instance', () => {
                let receivedVm = null;
                const handlers = createBackgroundHandlers(
                    () => null,
                    (vm) => { receivedVm = vm; }
                );
                const mockVm = { backgroundStyle: 'solid', _testMarker: true };
                handlers.onBackgroundStyleChange.call(mockVm);
                expect(receivedVm).to.equal(mockVm);
            });

            it('5.2.9 — Title handler callback receives Vue instance', () => {
                let receivedVm = null;
                const handlers = createTitleHandlers(
                    () => null,
                    (vm) => { receivedVm = vm; }
                );
                const mockVm = { titleText: 'hello', _testMarker: true };
                handlers.onTitleTextChange.call(mockVm);
                expect(receivedVm).to.equal(mockVm);
            });

            it('5.2.10 — Overlay handler callback receives Vue instance', () => {
                let receivedVm = null;
                const handlers = createOverlayHandlers(
                    (vm) => { receivedVm = vm; }
                );
                const mockVm = { overlayMode: 'multiply', _testMarker: true };
                handlers.onOverlayModeChange.call(mockVm);
                expect(receivedVm).to.equal(mockVm);
            });
        });

        // ============================================================
        // 5.3 CR-02: Layout Options (getLayoutOptions)
        // ============================================================
        describe('Section 5.3 — Layout Options (CR-02)', () => {
            it('5.3.1 — getLayoutOptions returns descriptor for uniform layout', () => {
                const opts = LayoutGenerator.getLayoutOptions(LayoutStyle.UNIFORM);
                expect(opts.gutter).to.be.true;
                expect(opts.sliceAngle).to.be.false;
                expect(opts.hexSpacing).to.be.false;
                expect(opts.hexSizeMultiplier).to.be.false;
            });

            it('5.3.2 — getLayoutOptions returns descriptor for hero layout', () => {
                const opts = LayoutGenerator.getLayoutOptions(LayoutStyle.HERO);
                expect(opts.gutter).to.be.true;
                expect(opts.sliceAngle).to.be.false;
                expect(opts.hexSpacing).to.be.false;
                expect(opts.hexSizeMultiplier).to.be.false;
            });

            it('5.3.3 — getLayoutOptions returns descriptor for mosaic layout', () => {
                const opts = LayoutGenerator.getLayoutOptions(LayoutStyle.MOSAIC);
                expect(opts.gutter).to.be.true;
                expect(opts.sliceAngle).to.be.false;
                expect(opts.hexSpacing).to.be.false;
                expect(opts.hexSizeMultiplier).to.be.false;
            });

            it('5.3.4 — getLayoutOptions returns descriptor for diagonalSlices layout', () => {
                const opts = LayoutGenerator.getLayoutOptions(LayoutStyle.DIAGONAL_SLICES);
                expect(opts.gutter).to.be.true;
                expect(opts.sliceAngle).to.be.true;
                expect(opts.hexSpacing).to.be.false;
                expect(opts.hexSizeMultiplier).to.be.false;
            });

            it('5.3.5 — getLayoutOptions returns descriptor for hexagonal layout', () => {
                const opts = LayoutGenerator.getLayoutOptions(LayoutStyle.HEXAGONAL);
                expect(opts.gutter).to.be.false;
                expect(opts.sliceAngle).to.be.false;
                expect(opts.hexSpacing).to.be.true;
                expect(opts.hexSizeMultiplier).to.be.true;
            });

            it('5.3.6 — getLayoutOptions returns hero defaults for unknown style', () => {
                const opts = LayoutGenerator.getLayoutOptions('unknown-style');
                expect(opts.gutter).to.be.true;
                expect(opts.sliceAngle).to.be.false;
                expect(opts.hexSpacing).to.be.false;
                expect(opts.hexSizeMultiplier).to.be.false;
            });
        });

        // ============================================================
        // 5.4 CR-12: Methods Composition
        // ============================================================
        describe('Section 5.4 — Methods Composition (CR-12)', () => {
            let methods, mockBase;

            beforeEach(() => {
                mockBase = createMockBase();
                methods = createCollageMethods(mockBase);
            });

            it('5.4.1 — All render methods are accessible', () => {
                expect(methods._scheduleRender).to.be.a('function');
                expect(methods._regenerateAndRender).to.be.a('function');
                expect(methods._buildBackgroundState).to.be.a('function');
                expect(methods._buildOverlayState).to.be.a('function');
            });

            it('5.4.2 — Crop preview method is accessible', () => {
                expect(methods._scheduleCropPreviewRender).to.be.a('function');
            });

            it('5.4.3 — Undo/redo methods are accessible', () => {
                expect(methods._updateUndoState).to.be.a('function');
                expect(methods._performUndo).to.be.a('function');
                expect(methods._performRedo).to.be.a('function');
                expect(methods.undo).to.be.a('function');
                expect(methods.redo).to.be.a('function');
            });

            it('5.4.4 — All handler-delegating methods are accessible', () => {
                // File handlers
                expect(methods.triggerFilePicker).to.be.a('function');
                expect(methods.handleFileInputChange).to.be.a('function');
                // Layout handlers
                expect(methods.onLayoutStyleChange).to.be.a('function');
                expect(methods.onGutterChange).to.be.a('function');
                expect(methods.onSliceAngleChange).to.be.a('function');
                expect(methods.onHexSpacingChange).to.be.a('function');
                expect(methods.onHexSizeMultiplierChange).to.be.a('function');
                // Crop handlers
                expect(methods.selectPanel).to.be.a('function');
                expect(methods.resetSelectedCrop).to.be.a('function');
                // Background handlers
                expect(methods.onBackgroundStyleChange).to.be.a('function');
                expect(methods.onBackgroundColorChange).to.be.a('function');
                expect(methods.onGradientColor1Change).to.be.a('function');
                expect(methods.onGradientColor2Change).to.be.a('function');
                expect(methods.onGradientAngleChange).to.be.a('function');
                expect(methods.handleBackgroundImageChange).to.be.a('function');
                expect(methods.onBackgroundOpacityChange).to.be.a('function');
                expect(methods.removeBackgroundImage).to.be.a('function');
                // Title handlers
                expect(methods.onTitleTextChange).to.be.a('function');
                expect(methods.toggleTitleBold).to.be.a('function');
                expect(methods.toggleTitleItalic).to.be.a('function');
                expect(methods.toggleTitleUnderline).to.be.a('function');
                expect(methods.onTitleFontFamilyChange).to.be.a('function');
                expect(methods.onTitleFontSizeChange).to.be.a('function');
                expect(methods.onTitleFontColorChange).to.be.a('function');
                expect(methods.onTitleAlignmentChange).to.be.a('function');
                // Overlay handlers
                expect(methods.handleOverlayImageChange).to.be.a('function');
                expect(methods.onOverlayModeChange).to.be.a('function');
                expect(methods.onOverlayOpacityChange).to.be.a('function');
                expect(methods.removeOverlay).to.be.a('function');
                // Export handlers
                expect(methods.exportCollage).to.be.a('function');
                expect(methods.onExportQualityChange).to.be.a('function');
                // Sidebar methods
                expect(methods.toggleRightSidebar).to.be.a('function');
                expect(methods.toggleSection).to.be.a('function');
                expect(methods.autoExpandCropOnSelect).to.be.a('function');
            });

            it('5.4.5 — _buildBackgroundState returns correct shape', () => {
                const mockVm = {
                    backgroundStyle: 'solid',
                    backgroundColor: '#ff0000',
                    gradientColors: ['#ff0000', '#00ff00'],
                    gradientAngle: 90,
                    backgroundImage: null,
                    backgroundOpacity: 1.0
                };
                const state = methods._buildBackgroundState.call(mockVm);
                expect(state.type).to.equal('solid');
                expect(state.color1).to.equal('#ff0000');
                expect(state.color2).to.equal('#00ff00');
                expect(state.angle).to.equal(90);
                expect(state.opacity).to.equal(1.0);
            });

            it('5.4.6 — _buildOverlayState returns correct shape', () => {
                const mockVm = {
                    overlayImage: null,
                    overlayMode: 'multiply',
                    overlayOpacity: 0.5
                };
                const state = methods._buildOverlayState.call(mockVm);
                expect(state.image).to.be.null;
                expect(state.mode).to.equal('multiply');
                expect(state.opacity).to.equal(0.5);
            });

            it('5.4.7 — _scheduleRender is a no-op when no canvas renderer', () => {
                const mockVm = {
                    images: [],
                    panels: [],
                    crops: new Map(),
                    panelAssignments: new Map(),
                    backgroundColor: '#ffffff',
                    selectedPanelId: null,
                    hoveredPanelId: null,
                    backgroundStyle: 'solid',
                    backgroundColor: '#ffffff',
                    gradientColors: ['#ffffff', '#e0e0e0'],
                    gradientAngle: 90,
                    backgroundImage: null,
                    backgroundOpacity: 1.0,
                    overlayImage: null,
                    overlayMode: 'multiply',
                    overlayOpacity: 0.5,
                    titleStyle: {},
                    titleRuns: []
                };
                // mockBase.getCanvasRenderer() returns null
                expect(() => {
                    methods._scheduleRender.call(mockVm);
                }).to.not.throw();
            });

            it('5.4.8 — _performUndo is a no-op when no undo manager', () => {
                const mockVm = {
                    canUndo: false,
                    canRedo: false
                };
                // mockBase.undoManager is null
                expect(() => {
                    methods._performUndo.call(mockVm);
                }).to.not.throw();
            });

            it('5.4.9 — _performRedo is a no-op when no undo manager', () => {
                const mockVm = {
                    canUndo: false,
                    canRedo: false
                };
                expect(() => {
                    methods._performRedo.call(mockVm);
                }).to.not.throw();
            });
        });

        // ============================================================
        // 5.5 Integration: Full pipeline with injected config
        // ============================================================
        describe('Section 5.5 — Integration: Full Pipeline', () => {
            it('5.5.1 — Methods and lifecycle compose with custom domIds', () => {
                const mockBase = createMockBase();
                const domIds = {
                    previewCanvas: 'testCanvas',
                    cropPreviewCanvas: 'testCrop',
                    fileInput: 'testInput'
                };
                const methods = createCollageMethods(mockBase, domIds);
                const lifecycle = createCollageLifecycle(mockBase, domIds);

                expect(methods).to.be.an('object');
                expect(lifecycle).to.be.an('object');
                expect(methods._scheduleRender).to.be.a('function');
                expect(lifecycle.mounted).to.be.a('function');
            });

            it('5.5.2 — Data, methods, lifecycle, and services all compose', () => {
                const mockBase = createMockBase();
                const domIds = {
                    previewCanvas: 'testCanvas',
                    cropPreviewCanvas: 'testCrop',
                    fileInput: 'testInput'
                };
                const dataConfig = createCollageData(mockBase);
                const methodsConfig = createCollageMethods(mockBase, domIds);
                const lifecycleConfig = createCollageLifecycle(mockBase, domIds);

                const data = dataConfig();
                expect(data.images).to.be.an('array');
                expect(data.layoutStyle).to.equal('hero');
                expect(methodsConfig._scheduleRender).to.be.a('function');
                expect(lifecycleConfig.mounted).to.be.a('function');
            });
        });

        // ============================================================
        // 5.6 CR-FU-09: createRenderMethods Module
        // ============================================================
        describe('Section 5.6 — createRenderMethods Module (CR-FU-09)', () => {
            let mockBase;

            beforeEach(() => {
                mockBase = createMockBase();
            });

            it('5.6.1 — createRenderMethods is a function', () => {
                expect(createRenderMethods).to.be.a('function');
            });

            it('5.6.2 — createRenderMethods returns expected methods', () => {
                const renderMethods = createRenderMethods(mockBase);
                expect(renderMethods._scheduleRender).to.be.a('function');
                expect(renderMethods._buildBackgroundState).to.be.a('function');
                expect(renderMethods._buildOverlayState).to.be.a('function');
                expect(renderMethods._regenerateAndRender).to.be.a('function');
            });

            it('5.6.3 — _buildBackgroundState returns correct shape', () => {
                const renderMethods = createRenderMethods(mockBase);
                const mockVm = {
                    backgroundStyle: 'gradient',
                    backgroundColor: '#ff0000',
                    gradientColors: ['#ff0000', '#00ff00'],
                    gradientAngle: 45,
                    backgroundImage: null,
                    backgroundOpacity: 0.8
                };
                const state = renderMethods._buildBackgroundState(mockVm);
                expect(state.type).to.equal('gradient');
                expect(state.color1).to.equal('#ff0000');
                expect(state.color2).to.equal('#00ff00');
                expect(state.angle).to.equal(45);
                expect(state.opacity).to.equal(0.8);
            });

            it('5.6.4 — _buildBackgroundState handles missing gradientColors', () => {
                const renderMethods = createRenderMethods(mockBase);
                const mockVm = {
                    backgroundStyle: 'solid',
                    backgroundColor: '#ffffff',
                    gradientAngle: 90,
                    backgroundImage: null,
                    backgroundOpacity: 1.0
                };
                const state = renderMethods._buildBackgroundState(mockVm);
                expect(state.color1).to.equal('#ffffff');
                expect(state.color2).to.equal('#ffffff');
            });

            it('5.6.5 — _buildOverlayState returns correct shape', () => {
                const renderMethods = createRenderMethods(mockBase);
                const mockVm = {
                    overlayImage: null,
                    overlayMode: 'screen',
                    overlayOpacity: 0.7
                };
                const state = renderMethods._buildOverlayState(mockVm);
                expect(state.image).to.be.null;
                expect(state.mode).to.equal('screen');
                expect(state.opacity).to.equal(0.7);
            });

            it('5.6.6 — _scheduleRender is a no-op when no canvas renderer', () => {
                const renderMethods = createRenderMethods(mockBase);
                const mockVm = {
                    images: [],
                    panels: [],
                    crops: new Map(),
                    panelAssignments: new Map(),
                    backgroundColor: '#ffffff',
                    selectedPanelId: null,
                    hoveredPanelId: null,
                    hexDragTargetId: null,
                    backgroundStyle: 'solid',
                    gradientColors: ['#ffffff', '#e0e0e0'],
                    gradientAngle: 90,
                    backgroundImage: null,
                    backgroundOpacity: 1.0,
                    overlayImage: null,
                    overlayMode: 'multiply',
                    overlayOpacity: 0.5,
                    titleStyle: {},
                    titleRuns: []
                };
                // mockBase.getCanvasRenderer() returns null
                expect(() => {
                    renderMethods._scheduleRender(mockVm);
                }).to.not.throw();
            });

            it('5.6.7 — _scheduleRender is a no-op when no images', () => {
                const mockRenderer = {
                    scheduleRender: (cb) => {
                        // Simulate RAF callback
                        const mockCtx = {
                            save: () => {},
                            scale: () => {},
                            restore: () => {}
                        };
                        cb(mockCtx, 1920, 1080);
                    }
                };
                mockBase.getCanvasRenderer = () => mockRenderer;
                const renderMethods = createRenderMethods(mockBase);
                const mockVm = {
                    images: [],
                    panels: [],
                    crops: new Map(),
                    panelAssignments: new Map(),
                    backgroundColor: '#ffffff',
                    selectedPanelId: null,
                    hoveredPanelId: null,
                    hexDragTargetId: null,
                    backgroundStyle: 'solid',
                    gradientColors: ['#ffffff', '#e0e0e0'],
                    gradientAngle: 90,
                    backgroundImage: null,
                    backgroundOpacity: 1.0,
                    overlayImage: null,
                    overlayMode: 'multiply',
                    overlayOpacity: 0.5,
                    titleStyle: {},
                    titleRuns: []
                };
                expect(() => {
                    renderMethods._scheduleRender(mockVm);
                }).to.not.throw();
            });

            it('5.6.8 — _regenerateAndRender calls layoutManager.regenerate and renders', () => {
                let regenerated = false;
                let rendered = false;
                const mockLayoutManager = {
                    regenerate: () => { regenerated = true; }
                };
                const mockRenderer = {
                    scheduleRender: () => { rendered = true; }
                };
                mockBase.getLayoutManager = () => mockLayoutManager;
                mockBase.getCanvasRenderer = () => mockRenderer;
                const renderMethods = createRenderMethods(mockBase);
                const mockVm = {
                    layoutManager: mockLayoutManager,
                    images: [],
                    panels: [],
                    crops: new Map(),
                    panelAssignments: new Map(),
                    backgroundColor: '#ffffff',
                    selectedPanelId: null,
                    hoveredPanelId: null,
                    hexDragTargetId: null,
                    backgroundStyle: 'solid',
                    gradientColors: ['#ffffff', '#e0e0e0'],
                    gradientAngle: 90,
                    backgroundImage: null,
                    backgroundOpacity: 1.0,
                    overlayImage: null,
                    overlayMode: 'multiply',
                    overlayOpacity: 0.5,
                    titleStyle: {},
                    titleRuns: []
                };
                renderMethods._regenerateAndRender(mockVm);
                expect(regenerated).to.be.true;
                expect(rendered).to.be.true;
            });
        });

        // ============================================================
        // 5.7 CR-FU-09: createCropPreviewRenderer Module
        // ============================================================
        describe('Section 5.7 — createCropPreviewRenderer Module (CR-FU-09)', () => {
            let mockBase;

            beforeEach(() => {
                mockBase = createMockBase();
            });

            it('5.7.1 — createCropPreviewRenderer is a function', () => {
                expect(createCropPreviewRenderer).to.be.a('function');
            });

            it('5.7.2 — createCropPreviewRenderer returns expected methods', () => {
                const cropPreview = createCropPreviewRenderer(mockBase, {
                    cropPreviewCanvas: 'cropPreviewCanvas'
                });
                expect(cropPreview._scheduleCropPreviewRender).to.be.a('function');
            });

            it('5.7.3 — _scheduleCropPreviewRender is idempotent (debounced)', () => {
                const cropPreview = createCropPreviewRenderer(mockBase, {
                    cropPreviewCanvas: 'cropPreviewCanvas'
                });
                const mockVm = {
                    _cropPreviewPending: false,
                    selectedPanelId: null
                };
                // First call sets pending flag
                cropPreview._scheduleCropPreviewRender(mockVm);
                expect(mockVm._cropPreviewPending).to.be.true;
                // Second call is a no-op while pending
                const secondCallResult = cropPreview._scheduleCropPreviewRender(mockVm);
                // Should not throw and should be a no-op
                expect(mockVm._cropPreviewPending).to.be.true;
            });

            it('5.7.4 — _scheduleCropPreviewRender is a no-op when no selected panel', () => {
                const cropPreview = createCropPreviewRenderer(mockBase, {
                    cropPreviewCanvas: 'cropPreviewCanvas'
                });
                const mockVm = {
                    _cropPreviewPending: false,
                    selectedPanelId: null
                };
                expect(() => {
                    cropPreview._scheduleCropPreviewRender(mockVm);
                }).to.not.throw();
            });
        });

        // ============================================================
        // 5.8 CR-FU-09: createUndoMethods Module
        // ============================================================
        describe('Section 5.8 — createUndoMethods Module (CR-FU-09)', () => {
            let mockBase;

            beforeEach(() => {
                mockBase = createMockBase();
            });

            it('5.8.1 — createUndoMethods is a function', () => {
                expect(createUndoMethods).to.be.a('function');
            });

            it('5.8.2 — createUndoMethods returns expected methods', () => {
                const undoMethods = createUndoMethods(mockBase);
                expect(undoMethods._updateUndoState).to.be.a('function');
                expect(undoMethods._performUndo).to.be.a('function');
                expect(undoMethods._performRedo).to.be.a('function');
            });

            it('5.8.3 — _updateUndoState is a no-op when no undo manager', () => {
                const undoMethods = createUndoMethods(mockBase);
                const mockVm = { canUndo: false, canRedo: false };
                // mockBase.undoManager is null
                expect(() => {
                    undoMethods._updateUndoState(mockVm);
                }).to.not.throw();
            });

            it('5.8.4 — _updateUndoState updates canUndo/canRedo', () => {
                const mockUndoManager = {
                    canUndo: () => true,
                    canRedo: () => false
                };
                mockBase.undoManager = mockUndoManager;
                const undoMethods = createUndoMethods(mockBase);
                const mockVm = { canUndo: false, canRedo: false };
                undoMethods._updateUndoState(mockVm);
                expect(mockVm.canUndo).to.be.true;
                expect(mockVm.canRedo).to.be.false;
            });

            it('5.8.5 — _performUndo is a no-op when no undo manager', () => {
                const undoMethods = createUndoMethods(mockBase);
                const mockVm = { canUndo: false, canRedo: false };
                expect(() => {
                    undoMethods._performUndo(mockVm);
                }).to.not.throw();
            });

            it('5.8.6 — _performRedo is a no-op when no undo manager', () => {
                const undoMethods = createUndoMethods(mockBase);
                const mockVm = { canUndo: false, canRedo: false };
                expect(() => {
                    undoMethods._performRedo(mockVm);
                }).to.not.throw();
            });

            it('5.8.7 — _performUndo calls undo and triggers render callbacks', () => {
                let renderCalled = false;
                let cropPreviewCalled = false;
                const mockUndoManager = {
                    canUndo: () => true,
                    canRedo: () => false,
                    undo: () => true
                };
                mockBase.undoManager = mockUndoManager;
                const undoMethods = createUndoMethods(mockBase, {
                    onRenderScheduled: () => { renderCalled = true; },
                    onCropPreviewRender: () => { cropPreviewCalled = true; }
                });
                const mockVm = { canUndo: false, canRedo: false };
                undoMethods._performUndo(mockVm);
                expect(renderCalled).to.be.true;
                expect(cropPreviewCalled).to.be.true;
                expect(mockVm.canUndo).to.be.true;  // _updateUndoState updated it
                expect(mockVm.canRedo).to.be.false;
            });
        });

        // ============================================================
        // 5.9 CR-FU-09: Composition — Extracted methods in createCollageMethods
        // ============================================================
        describe('Section 5.9 — Composition: Extracted Methods in createCollageMethods (CR-FU-09)', () => {
            let methods, mockBase;

            beforeEach(() => {
                mockBase = createMockBase();
                methods = createCollageMethods(mockBase);
            });

            it('5.9.1 — Render methods are accessible on composed methods object', () => {
                expect(methods._scheduleRender).to.be.a('function');
                expect(methods._buildBackgroundState).to.be.a('function');
                expect(methods._buildOverlayState).to.be.a('function');
                expect(methods._regenerateAndRender).to.be.a('function');
            });

            it('5.9.2 — Crop preview method is accessible on composed methods object', () => {
                expect(methods._scheduleCropPreviewRender).to.be.a('function');
            });

            it('5.9.3 — Undo methods are accessible on composed methods object', () => {
                expect(methods._updateUndoState).to.be.a('function');
                expect(methods._performUndo).to.be.a('function');
                expect(methods._performRedo).to.be.a('function');
            });

            it('5.9.4 — Method names unchanged after extraction', () => {
                const methodNames = Object.keys(methods).filter(k => k.startsWith('_'));
                expect(methodNames).to.include('_scheduleRender');
                expect(methodNames).to.include('_buildBackgroundState');
                expect(methodNames).to.include('_buildOverlayState');
                expect(methodNames).to.include('_scheduleCropPreviewRender');
                expect(methodNames).to.include('_updateUndoState');
                expect(methodNames).to.include('_performUndo');
                expect(methodNames).to.include('_performRedo');
                expect(methodNames).to.include('_regenerateAndRender');
            });

            it('5.9.5 — _buildBackgroundState works via composed methods', () => {
                const mockVm = {
                    backgroundStyle: 'solid',
                    backgroundColor: '#aabbcc',
                    gradientColors: ['#aabbcc', '#ddeeff'],
                    gradientAngle: 180,
                    backgroundImage: null,
                    backgroundOpacity: 0.5
                };
                const state = methods._buildBackgroundState.call(mockVm);
                expect(state.type).to.equal('solid');
                expect(state.color1).to.equal('#aabbcc');
                expect(state.color2).to.equal('#ddeeff');
                expect(state.angle).to.equal(180);
                expect(state.opacity).to.equal(0.5);
            });

            it('5.9.6 — _buildOverlayState works via composed methods', () => {
                const mockVm = {
                    overlayImage: null,
                    overlayMode: 'multiply',
                    overlayOpacity: 0.5
                };
                const state = methods._buildOverlayState.call(mockVm);
                expect(state.image).to.be.null;
                expect(state.mode).to.equal('multiply');
                expect(state.opacity).to.equal(0.5);
            });

            it('5.9.7 — _updateUndoState works via composed methods', () => {
                const mockUndoManager = {
                    canUndo: () => true,
                    canRedo: () => true
                };
                mockBase.undoManager = mockUndoManager;
                const mockVm = { canUndo: false, canRedo: false };
                methods._updateUndoState.call(mockVm);
                expect(mockVm.canUndo).to.be.true;
                expect(mockVm.canRedo).to.be.true;
            });
        });

        // Run mocha after all tests are defined
        window.addEventListener('load', () => {
            mocha.run();
        });
    </script>
