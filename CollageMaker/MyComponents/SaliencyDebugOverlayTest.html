    <h1>CollageMaker — SaliencyDebugOverlay Unit Tests</h1>
    <p class="test-plan-ref">Covers: Section 3.4 — Pure functions (3.4.2), Canvas rendering (3.4.3), Assembler integration (3.4.4), State/Export safety (3.4.5)</p>
    <div id="mocha"></div>

    <script src="https://unpkg.com/mocha@10.2.0/mocha.js"></script>
    <script src="https://unpkg.com/chai@4.3.10/chai.js"></script>
    <script>mocha.setup('bdd');</script>

    <script type="module">
        import {
            focusPointToCanvasCoords,
            imageCenterToCanvasCoords,
            computeDebugMarkers,
            validateFocusPoint,
            DEBUG_OVERLAY_STYLES,
            render,
            createDebugOverlay
        } from '../MyESModules/Rendering/SaliencyDebugOverlay.js';
        import { createCollageAssembler } from '../MyESModules/Rendering/CollageAssembler.js';
        import { exportToJpeg } from '../MyESModules/Export/formats/jpegExporter.js';

        const { expect } = chai;

        // Minimal test state factory (replaces createCollageState)
        function createTestState() {
            return {
                images: [],
                panels: [],
                layoutStyle: 'hero',
                gutter: 0,
                sliceAngle: 45,
                hexSpacing: 8,
                panelAssignments: new Map(),
                layoutVersion: 0,
                crops: new Map(),
                selectedPanelId: null,
                hoveredPanelId: null,
                selectedImageId: null,
                backgroundColor: '#ffffff',
                searchQuery: '',
                canUndo: false,
                canRedo: false,
                showDebugOverlay: false,
                focusPoints: null
            };
        }

        // ============================================================
        // Test helpers
        // ============================================================

        function makeCrop(sourceRect, destination) {
            return { sourceRect: { ...sourceRect }, destination: { ...destination } };
        }

        function makePanel(id, geometry) {
            return { id, geometry: geometry || { type: 'rect', rect: { x: 0, y: 0, width: 1000, height: 1000 } } };
        }

        function makeImageItem(width, height) {
            return { width, height };
        }

        function makeOffscreenCanvas(w, h) {
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            return canvas;
        }

        // Spy on CanvasRenderingContext2D methods
        function spyContext(ctx) {
            const spies = {};
            const methodsToSpy = ['arc', 'fill', 'stroke', 'fillRect', 'strokeRect',
                'moveTo', 'lineTo', 'beginPath', 'closePath',
                'save', 'restore', 'setLineDash', 'clearRect'];

            for (const methodName of methodsToSpy) {
                const original = ctx[methodName].bind(ctx);
                spies[methodName] = { calls: [], original };
                ctx[methodName] = function(...args) {
                    spies[methodName].calls.push(args);
                    return original(...args);
                };
            }

            // Spy on property setters
            spies.fillStyle = { sets: [] };
            const origFillStyleDesc = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'fillStyle');
            let fillStyleValue = ctx.fillStyle;
            Object.defineProperty(ctx, 'fillStyle', {
                get: () => fillStyleValue,
                set: (v) => { spies.fillStyle.sets.push(v); fillStyleValue = v; },
                configurable: true
            });

            spies.strokeStyle = { sets: [] };
            let strokeStyleValue = ctx.strokeStyle;
            Object.defineProperty(ctx, 'strokeStyle', {
                get: () => strokeStyleValue,
                set: (v) => { spies.strokeStyle.sets.push(v); strokeStyleValue = v; },
                configurable: true
            });

            spies.lineWidth = { sets: [] };
            let lineWidthValue = ctx.lineWidth;
            Object.defineProperty(ctx, 'lineWidth', {
                get: () => lineWidthValue,
                set: (v) => { spies.lineWidth.sets.push(v); lineWidthValue = v; },
                configurable: true
            });

            return spies;
        }

        // ============================================================
        // 3.4.2.1 — 3.4.2.15: Focus Point Coordinate Transformation
        // ============================================================
        describe('Section 3.4.2 — focusPointToCanvasCoords', () => {
            it('3.4.2.1 — Focus at image center → panel center', () => {
                const crop = makeCrop({ x: 0, y: 0, width: 2000, height: 2000 }, { x: 0, y: 0, width: 1000, height: 1000 });
                const result = focusPointToCanvasCoords({ x: 0.5, y: 0.5 }, { width: 2000, height: 2000 }, crop);
                expect(result.x).to.equal(500);
                expect(result.y).to.equal(500);
            });

            it('3.4.2.2 — Focus at top-left of image → top-left of crop', () => {
                const crop = makeCrop({ x: 0, y: 0, width: 2000, height: 2000 }, { x: 0, y: 0, width: 1000, height: 1000 });
                const result = focusPointToCanvasCoords({ x: 0.0, y: 0.0 }, { width: 2000, height: 2000 }, crop);
                expect(result.x).to.equal(0);
                expect(result.y).to.equal(0);
            });

            it('3.4.2.3 — Focus at bottom-right → bottom-right of crop', () => {
                const crop = makeCrop({ x: 0, y: 0, width: 2000, height: 2000 }, { x: 0, y: 0, width: 1000, height: 1000 });
                const result = focusPointToCanvasCoords({ x: 1.0, y: 1.0 }, { width: 2000, height: 2000 }, crop);
                expect(result.x).to.equal(1000);
                expect(result.y).to.equal(1000);
            });

            it('3.4.2.4 — Focus at top-right → top-right of crop', () => {
                const crop = makeCrop({ x: 0, y: 0, width: 2000, height: 2000 }, { x: 0, y: 0, width: 1000, height: 1000 });
                const result = focusPointToCanvasCoords({ x: 1.0, y: 0.0 }, { width: 2000, height: 2000 }, crop);
                expect(result.x).to.equal(1000);
                expect(result.y).to.equal(0);
            });

            it('3.4.2.5 — Focus at bottom-left → bottom-left of crop', () => {
                const crop = makeCrop({ x: 0, y: 0, width: 2000, height: 2000 }, { x: 0, y: 0, width: 1000, height: 1000 });
                const result = focusPointToCanvasCoords({ x: 0.0, y: 1.0 }, { width: 2000, height: 2000 }, crop);
                expect(result.x).to.equal(0);
                expect(result.y).to.equal(1000);
            });

            it('3.4.2.6 — Crop offset: focus at center of cropped region', () => {
                const crop = makeCrop({ x: 1000, y: 500, width: 2000, height: 2000 }, { x: 0, y: 0, width: 1000, height: 1000 });
                // Focus (0.5, 0.5) → abs (2000, 1500) → center of source rect → center of dest
                const result = focusPointToCanvasCoords({ x: 0.5, y: 0.5 }, { width: 4000, height: 3000 }, crop);
                expect(result.x).to.equal(500);
                expect(result.y).to.equal(500);
            });

            it('3.4.2.7 — Crop offset: focus at source rect top-left', () => {
                const crop = makeCrop({ x: 1000, y: 500, width: 2000, height: 2000 }, { x: 100, y: 100, width: 800, height: 600 });
                // Focus (0.25, 0.1667) → abs (1000, 500) → top-left of source rect → top-left of dest
                const result = focusPointToCanvasCoords({ x: 0.25, y: 500 / 3000 }, { width: 4000, height: 3000 }, crop);
                expect(result.x).to.equal(100);
                expect(result.y).to.equal(100);
            });

            it('3.4.2.8 — Crop offset: focus at source rect bottom-right', () => {
                const crop = makeCrop({ x: 1000, y: 500, width: 2000, height: 2000 }, { x: 100, y: 100, width: 800, height: 600 });
                // Focus (0.75, 0.8333) → abs (3000, 2500) → bottom-right of source rect → bottom-right of dest
                const result = focusPointToCanvasCoords({ x: 0.75, y: 2500 / 3000 }, { width: 4000, height: 3000 }, crop);
                expect(result.x).to.equal(900);
                expect(result.y).to.equal(700);
            });

            it('3.4.2.9 — Portrait image in landscape panel — coords within dest', () => {
                // Image 1080x1920, panel dest 1000x562
                // sourceRect from FitMath: full width 1080, height = 1080/1.78 ≈ 600, y-offset = (1920-600)/2 = 660
                const crop = makeCrop({ x: 0, y: 660, width: 1080, height: 600 }, { x: 0, y: 0, width: 1000, height: 562 });
                const result = focusPointToCanvasCoords({ x: 0.5, y: 0.5 }, { width: 1080, height: 1920 }, crop);
                // abs (540, 960) → within source rect → dest center
                expect(result.x).to.be.within(0, 1000);
                expect(result.y).to.be.within(0, 562);
            });

            it('3.4.2.10 — Landscape image in portrait panel — coords within dest', () => {
                // Image 1920x1080, panel dest 562x1000
                // sourceRect: full height 1080, width = 1080*0.562 ≈ 607, x-offset = (1920-607)/2 ≈ 656
                const crop = makeCrop({ x: 656, y: 0, width: 607, height: 1080 }, { x: 0, y: 0, width: 562, height: 1000 });
                const result = focusPointToCanvasCoords({ x: 0.5, y: 0.5 }, { width: 1920, height: 1080 }, crop);
                expect(result.x).to.be.within(0, 562);
                expect(result.y).to.be.within(0, 1000);
            });

            it('3.4.2.11 — Square image, 1:1 crop', () => {
                const crop = makeCrop({ x: 0, y: 0, width: 1000, height: 1000 }, { x: 0, y: 0, width: 500, height: 500 });
                const result = focusPointToCanvasCoords({ x: 0.3, y: 0.7 }, { width: 1000, height: 1000 }, crop);
                expect(result.x).to.equal(150);
                expect(result.y).to.equal(350);
            });

            it('3.4.2.12 — Focus slightly off-center', () => {
                const crop = makeCrop({ x: 0, y: 0, width: 2000, height: 2000 }, { x: 0, y: 0, width: 1000, height: 1000 });
                const result = focusPointToCanvasCoords({ x: 0.55, y: 0.45 }, { width: 2000, height: 2000 }, crop);
                expect(result.x).to.equal(550);
                expect(result.y).to.equal(450);
            });

            it('3.4.2.13 — Very small crop (100x100)', () => {
                const crop = makeCrop({ x: 1900, y: 1400, width: 200, height: 200 }, { x: 400, y: 400, width: 100, height: 100 });
                const result = focusPointToCanvasCoords({ x: 0.5, y: 0.5 }, { width: 4000, height: 3000 }, crop);
                // abs (2000, 1500) → center of source rect → center of dest
                expect(result.x).to.equal(450);
                expect(result.y).to.equal(450);
            });

            it('3.4.2.14 — Panel destination offset from canvas origin', () => {
                const crop = makeCrop({ x: 0, y: 0, width: 2000, height: 2000 }, { x: 500, y: 300, width: 400, height: 300 });
                const result = focusPointToCanvasCoords({ x: 0.5, y: 0.5 }, { width: 2000, height: 2000 }, crop);
                // Center of source → center of dest (500+200, 300+150) = (700, 450)
                expect(result.x).to.equal(700);
                expect(result.y).to.equal(450);
            });

            it('3.4.2.15 — Non-integer focus values', () => {
                const crop = makeCrop({ x: 0, y: 0, width: 3000, height: 3000 }, { x: 0, y: 0, width: 900, height: 900 });
                const result = focusPointToCanvasCoords({ x: 0.333333, y: 0.666667 }, { width: 3000, height: 3000 }, crop);
                expect(result.x).to.be.closeTo(300, 0.1);
                expect(result.y).to.be.closeTo(600, 0.1);
            });
        });

        // ============================================================
        // 3.4.2.16 — 3.4.2.20: Image Center Coordinate Computation
        // ============================================================
        describe('Section 3.4.2 — imageCenterToCanvasCoords', () => {
            it('3.4.2.16 — Center of full-image crop', () => {
                const crop = makeCrop({ x: 0, y: 0, width: 2000, height: 2000 }, { x: 0, y: 0, width: 1000, height: 1000 });
                const result = imageCenterToCanvasCoords({ width: 2000, height: 2000 }, crop);
                expect(result.x).to.equal(500);
                expect(result.y).to.equal(500);
            });

            it('3.4.2.17 — Center equals focusPointToCanvasCoords at 0.5,0.5', () => {
                const crop = makeCrop({ x: 0, y: 0, width: 2000, height: 2000 }, { x: 0, y: 0, width: 1000, height: 1000 });
                const center = imageCenterToCanvasCoords({ width: 2000, height: 2000 }, crop);
                const focus = focusPointToCanvasCoords({ x: 0.5, y: 0.5 }, { width: 2000, height: 2000 }, crop);
                expect(center.x).to.equal(focus.x);
                expect(center.y).to.equal(focus.y);
            });

            it('3.4.2.18 — Center with offset crop', () => {
                const crop = makeCrop({ x: 1000, y: 500, width: 2000, height: 2000 }, { x: 100, y: 100, width: 800, height: 600 });
                const result = imageCenterToCanvasCoords({ width: 4000, height: 3000 }, crop);
                // Image center (2000, 1500) → center of source rect → center of dest (100+400, 100+300) = (500, 400)
                expect(result.x).to.equal(500);
                expect(result.y).to.equal(400);
            });

            it('3.4.2.19 — Center of portrait image in landscape crop — within dest bounds', () => {
                const crop = makeCrop({ x: 0, y: 660, width: 1080, height: 600 }, { x: 0, y: 0, width: 1000, height: 562 });
                const result = imageCenterToCanvasCoords({ width: 1080, height: 1920 }, crop);
                expect(result.x).to.be.within(0, 1000);
                expect(result.y).to.be.within(0, 562);
            });

            it('3.4.2.20 — Center with panel offset', () => {
                const crop = makeCrop({ x: 0, y: 0, width: 2000, height: 2000 }, { x: 500, y: 300, width: 400, height: 300 });
                const result = imageCenterToCanvasCoords({ width: 2000, height: 2000 }, crop);
                expect(result.x).to.equal(700);
                expect(result.y).to.equal(450);
            });
        });

        // ============================================================
        // 3.4.2.21 — 3.4.2.32: Debug Marker Computation
        // ============================================================
        describe('Section 3.4.2 — computeDebugMarkers', () => {
            const panel = makePanel('p1');
            const image = makeImageItem(2000, 2000);
            const crop = makeCrop({ x: 0, y: 0, width: 2000, height: 2000 }, { x: 0, y: 0, width: 1000, height: 1000 });

            it('3.4.2.21 — Panel with valid focus point → two markers', () => {
                const markers = computeDebugMarkers(panel, image, crop, { x: 0.3, y: 0.4 });
                expect(markers).to.have.lengthOf(2);
                expect(markers[0].type).to.equal('center');
                expect(markers[1].type).to.equal('focal');
            });

            it('3.4.2.22 — Panel with no focus point → center marker only', () => {
                const markers = computeDebugMarkers(panel, image, crop, undefined);
                expect(markers).to.have.lengthOf(1);
                expect(markers[0].type).to.equal('center');
            });

            it('3.4.2.23 — Panel with no crop → empty array', () => {
                const markers = computeDebugMarkers(panel, image, undefined, { x: 0.3, y: 0.4 });
                expect(markers).to.have.lengthOf(0);
            });

            it('3.4.2.24 — Panel with no image → empty array', () => {
                const markers = computeDebugMarkers(panel, undefined, crop, { x: 0.3, y: 0.4 });
                expect(markers).to.have.lengthOf(0);
            });

            it('3.4.2.25 — Panel with no image AND no crop → empty array', () => {
                const markers = computeDebugMarkers(panel, undefined, undefined, undefined);
                expect(markers).to.have.lengthOf(0);
            });

            it('3.4.2.26 — Focus point at image center → markers overlap', () => {
                const markers = computeDebugMarkers(panel, image, crop, { x: 0.5, y: 0.5 });
                expect(markers).to.have.lengthOf(2);
                expect(markers[0].x).to.equal(markers[1].x);
                expect(markers[0].y).to.equal(markers[1].y);
            });

            it('3.4.2.27 — Focus point at image corner → markers far apart', () => {
                const markers = computeDebugMarkers(panel, image, crop, { x: 0.0, y: 0.0 });
                expect(markers).to.have.lengthOf(2);
                // Focal at (0, 0), center at (500, 500)
                expect(markers[1].x).to.equal(0);
                expect(markers[1].y).to.equal(0);
                expect(markers[0].x).to.equal(500);
                expect(markers[0].y).to.equal(500);
            });

            it('3.4.2.28 — Multiple panels → independent computation', () => {
                const panelA = makePanel('a', { type: 'rect', rect: { x: 0, y: 0, width: 500, height: 500 } });
                const panelB = makePanel('b', { type: 'rect', rect: { x: 500, y: 0, width: 500, height: 500 } });
                const cropA = makeCrop({ x: 0, y: 0, width: 2000, height: 2000 }, { x: 0, y: 0, width: 500, height: 500 });
                const cropB = makeCrop({ x: 0, y: 0, width: 2000, height: 2000 }, { x: 500, y: 0, width: 500, height: 500 });

                const markersA = computeDebugMarkers(panelA, image, cropA, { x: 0.3, y: 0.3 });
                const markersB = computeDebugMarkers(panelB, image, cropB, { x: 0.7, y: 0.7 });

                expect(markersA[0].x).to.not.equal(markersB[0].x);
                expect(markersA[1].x).to.not.equal(markersB[1].x);
            });

            it('3.4.2.29 — Panel with NaN focus point → center-only', () => {
                const markers = computeDebugMarkers(panel, image, crop, { x: NaN, y: NaN });
                expect(markers).to.have.lengthOf(1);
                expect(markers[0].type).to.equal('center');
            });

            it('3.4.2.30 — Panel with Infinity focus point → center-only', () => {
                const markers = computeDebugMarkers(panel, image, crop, { x: Infinity, y: Infinity });
                expect(markers).to.have.lengthOf(1);
                expect(markers[0].type).to.equal('center');
            });

            it('3.4.2.31 — Panel with focus point outside [0,1] → center-only', () => {
                const markers = computeDebugMarkers(panel, image, crop, { x: 1.5, y: -0.5 });
                expect(markers).to.have.lengthOf(1);
                expect(markers[0].type).to.equal('center');
            });

            it('3.4.2.32 — Panel with null focus point → center-only', () => {
                const markers = computeDebugMarkers(panel, image, crop, null);
                expect(markers).to.have.lengthOf(1);
                expect(markers[0].type).to.equal('center');
            });
        });

        // ============================================================
        // 3.4.2.33 — 3.4.2.52: Focus Point Validation
        // ============================================================
        describe('Section 3.4.2 — validateFocusPoint', () => {
            it('3.4.2.33 — Valid focus point at center', () => {
                expect(validateFocusPoint({ x: 0.5, y: 0.5 })).to.be.true;
            });

            it('3.4.2.34 — Valid focus point at corner', () => {
                expect(validateFocusPoint({ x: 0.0, y: 0.0 })).to.be.true;
            });

            it('3.4.2.35 — Valid focus point at opposite corner', () => {
                expect(validateFocusPoint({ x: 1.0, y: 1.0 })).to.be.true;
            });

            it('3.4.2.36 — Valid focus point at edge', () => {
                expect(validateFocusPoint({ x: 0.0, y: 0.5 })).to.be.true;
            });

            it('3.4.2.37 — Valid focus point fractional', () => {
                expect(validateFocusPoint({ x: 0.333, y: 0.667 })).to.be.true;
            });

            it('3.4.2.38 — NaN x → invalid', () => {
                expect(validateFocusPoint({ x: NaN, y: 0.5 })).to.be.false;
            });

            it('3.4.2.39 — NaN y → invalid', () => {
                expect(validateFocusPoint({ x: 0.5, y: NaN })).to.be.false;
            });

            it('3.4.2.40 — Both NaN → invalid', () => {
                expect(validateFocusPoint({ x: NaN, y: NaN })).to.be.false;
            });

            it('3.4.2.41 — Infinity x → invalid', () => {
                expect(validateFocusPoint({ x: Infinity, y: 0.5 })).to.be.false;
            });

            it('3.4.2.42 — Negative Infinity → invalid', () => {
                expect(validateFocusPoint({ x: -Infinity, y: 0.5 })).to.be.false;
            });

            it('3.4.2.43 — x > 1 → invalid', () => {
                expect(validateFocusPoint({ x: 1.5, y: 0.5 })).to.be.false;
            });

            it('3.4.2.44 — y < 0 → invalid', () => {
                expect(validateFocusPoint({ x: 0.5, y: -0.1 })).to.be.false;
            });

            it('3.4.2.45 — Null → invalid', () => {
                expect(validateFocusPoint(null)).to.be.false;
            });

            it('3.4.2.46 — Undefined → invalid', () => {
                expect(validateFocusPoint(undefined)).to.be.false;
            });

            it('3.4.2.47 — Empty object → invalid', () => {
                expect(validateFocusPoint({})).to.be.false;
            });

            it('3.4.2.48 — Missing x → invalid', () => {
                expect(validateFocusPoint({ y: 0.5 })).to.be.false;
            });

            it('3.4.2.49 — Missing y → invalid', () => {
                expect(validateFocusPoint({ x: 0.5 })).to.be.false;
            });

            it('3.4.2.50 — String values → invalid', () => {
                expect(validateFocusPoint({ x: '0.5', y: '0.5' })).to.be.false;
            });

            it('3.4.2.51 — Zero values → valid', () => {
                expect(validateFocusPoint({ x: 0, y: 0 })).to.be.true;
            });

            it('3.4.2.52 — One valid, one NaN → invalid', () => {
                expect(validateFocusPoint({ x: 0.5, y: NaN })).to.be.false;
            });
        });

        // ============================================================
        // 3.4.2.53 — 3.4.2.58: Constants Validation
        // ============================================================
        describe('Section 3.4.2 — DEBUG_OVERLAY_STYLES', () => {
            it('3.4.2.53 — Has all required fields', () => {
                expect(DEBUG_OVERLAY_STYLES).to.have.property('FOCAL_POINT');
                expect(DEBUG_OVERLAY_STYLES).to.have.property('CENTER_DOT');
                expect(DEBUG_OVERLAY_STYLES).to.have.property('SHIFT_VECTOR');
                expect(DEBUG_OVERLAY_STYLES).to.have.property('CROP_RECT');
                expect(DEBUG_OVERLAY_STYLES).to.have.property('LABEL_FONT');
                expect(DEBUG_OVERLAY_STYLES).to.have.property('LABEL_OFFSET_X');
                expect(DEBUG_OVERLAY_STYLES).to.have.property('LABEL_OFFSET_Y');
            });

            it('3.4.2.54 — FOCAL_POINT color is green', () => {
                expect(DEBUG_OVERLAY_STYLES.FOCAL_POINT.color).to.equal('#00FF00');
            });

            it('3.4.2.55 — CENTER_DOT color is red', () => {
                expect(DEBUG_OVERLAY_STYLES.CENTER_DOT.color).to.equal('#FF0000');
            });

            it('3.4.2.56 — SHIFT_VECTOR has dash pattern', () => {
                const dash = DEBUG_OVERLAY_STYLES.SHIFT_VECTOR.dashPattern;
                expect(dash).to.be.an('array');
                expect(dash.length).to.be.at.least(2);
            });

            it('3.4.2.57 — FOCAL_POINT radius > CENTER_DOT radius', () => {
                expect(DEBUG_OVERLAY_STYLES.FOCAL_POINT.radius).to.be.greaterThan(
                    DEBUG_OVERLAY_STYLES.CENTER_DOT.radius
                );
            });

            it('3.4.2.58 — LABEL_FONT is valid CSS font string', () => {
                expect(DEBUG_OVERLAY_STYLES.LABEL_FONT).to.match(/^\d+px\s+\w+$/);
            });
        });

        // ============================================================
        // 3.4.3.1 — 3.4.3.17: Canvas Rendering — Basic Drawing
        // ============================================================
        describe('Section 3.4.3 — Canvas Rendering: Basic Drawing', () => {
            let canvas, ctx, spies;
            const panels = [makePanel('p1')];
            const images = [makeImageItem(2000, 2000)];
            const crops = new Map([['p1', makeCrop({ x: 0, y: 0, width: 2000, height: 2000 }, { x: 0, y: 0, width: 1000, height: 1000 })]]);
            const panelAssignments = new Map([['p1', 0]]);
            const canvasSize = { width: 1000, height: 1000 };

            beforeEach(() => {
                canvas = makeOffscreenCanvas(1000, 1000);
                ctx = canvas.getContext('2d');
                spies = spyContext(ctx);
            });

            it('3.4.3.1 — Render with valid focus point → arc called for focal', () => {

            it('3.4.4.7 — Full pipeline: all layers rendered in correct order', () => {

                // Assembler does not call clearRect (caller's responsibility per CollageAssembler.js:47)
                // fillRect (bg), arc (debug markers), stroke (selection)
                expect(spies.clearRect.calls.length).to.equal(0);

            // ============================================================

        // ============================================================

        describe('Section 3.4.5 — State Management', () => {

        // ============================================================
        // 3.4.5.7 — 3.4.5.11: Export Safety
        // ============================================================
        describe('Section 3.4.5 — Export Safety', () => {
            function createMockAssembler() {
                const calls = [];
                return {
                    render(ctx, renderData) {
                        calls.push({ ctx, renderData });
                        ctx.fillStyle = '#FF0000';
                        ctx.fillRect(0, 0, 1920, 1080);
                    },
                    getCalls() { return calls; },
                    reset() { calls.length = 0; }
                };
            }

            function makeExportState() {
                return {
                    panels: [],
                    images: [],
                    crops: new Map(),
                    panelAssignments: new Map(),
                    backgroundColor: '#ffffff',
                    backgroundState: null,
                    overlayState: null,
                    titleStyle: null,
                    titleRuns: null,
                    showDebugOverlay: true,
                    focusPoints: new Map([[0, { x: 0.5, y: 0.5 }]])
                };
            }

            it('3.4.5.7 — Export with showDebugOverlay = true → no debug markers', async () => {
                const assembler = createMockAssembler();
                const state = makeExportState();

                const originalCreateElement = document.createElement.bind(document);
                document.createElement = function(tag) {
                    const el = originalCreateElement(tag);
                    if (tag === 'canvas') {
                        el.toBlob = function(callback) {
                            callback(new Blob(['fake'], { type: 'image/jpeg' }));
                        };
                    }
                    return el;
                };

                try {
                    await exportToJpeg(assembler, state);
                    const call = assembler.getCalls()[0];
                    // showDebugOverlay should NOT be passed to render
                    expect(call.renderData.showDebugOverlay).to.be.undefined;
                } finally {
                    document.createElement = originalCreateElement;
                }
            });

            it('3.4.5.8 — Export renderData does not include showDebugOverlay', async () => {
                const assembler = createMockAssembler();
                const state = makeExportState();

                const originalCreateElement = document.createElement.bind(document);
                document.createElement = function(tag) {
                    const el = originalCreateElement(tag);
                    if (tag === 'canvas') {
                        el.toBlob = function(callback) {
                            callback(new Blob(['fake'], { type: 'image/jpeg' }));
                        };
                    }
                    return el;
                };

                try {
                    await exportToJpeg(assembler, state);
                    const call = assembler.getCalls()[0];
                    expect(call.renderData).to.not.have.property('showDebugOverlay');
                } finally {
                    document.createElement = originalCreateElement;
                }
            });

            it('3.4.5.9 — Export renderData does not include focusPoints', async () => {
                const assembler = createMockAssembler();
                const state = makeExportState();

                const originalCreateElement = document.createElement.bind(document);
                document.createElement = function(tag) {
                    const el = originalCreateElement(tag);
                    if (tag === 'canvas') {
                        el.toBlob = function(callback) {
                            callback(new Blob(['fake'], { type: 'image/jpeg' }));
                        };
                    }
                    return el;
                };

                try {
                    await exportToJpeg(assembler, state);
                    const call = assembler.getCalls()[0];
                    expect(call.renderData).to.not.have.property('focusPoints');
                } finally {
                    document.createElement = originalCreateElement;
                }
            });

            it('3.4.5.10 — Export with focusPoints on state → still no debug markers', async () => {
                const assembler = createMockAssembler();
                const state = makeExportState();
                state.focusPoints.set(0, { x: 0.3, y: 0.4 });
                state.focusPoints.set(1, { x: 0.7, y: 0.8 });

                const originalCreateElement = document.createElement.bind(document);
                document.createElement = function(tag) {
                    const el = originalCreateElement(tag);
                    if (tag === 'canvas') {
                        el.toBlob = function(callback) {
                            callback(new Blob(['fake'], { type: 'image/jpeg' }));
                        };
                    }
                    return el;
                };

                try {
                    await exportToJpeg(assembler, state);
                    const call = assembler.getCalls()[0];
                    expect(call.renderData).to.not.have.property('focusPoints');
                    expect(call.renderData).to.not.have.property('showDebugOverlay');
                } finally {
                    document.createElement = originalCreateElement;
                }
            });

            it('3.4.5.11 — Export follows same pattern as selection/hover stripping', async () => {
                const assembler = createMockAssembler();
                const state = makeExportState();
                state.selectedPanelId = 'p1'; // Set on state but should be null in export
                state.hoveredPanelId = 'p2';

                const originalCreateElement = document.createElement.bind(document);
                document.createElement = function(tag) {
                    const el = originalCreateElement(tag);
                    if (tag === 'canvas') {
                        el.toBlob = function(callback) {
                            callback(new Blob(['fake'], { type: 'image/jpeg' }));
                        };
                    }
                    return el;
                };

                try {
                    await exportToJpeg(assembler, state);
                    const call = assembler.getCalls()[0];
                    // selectedPanelId and hoveredPanelId are null (stripped)
                    expect(call.renderData.selectedPanelId).to.be.null;
                    expect(call.renderData.hoveredPanelId).to.be.null;
                    // showDebugOverlay and focusPoints are undefined (not passed)
                    expect(call.renderData.showDebugOverlay).to.be.undefined;
                    expect(call.renderData.focusPoints).to.be.undefined;
                } finally {
                    document.createElement = originalCreateElement;
                }
            });
        });

        // Run mocha after all tests are defined
        window.addEventListener('load', () => {
            mocha.run();
        });
    </script>
