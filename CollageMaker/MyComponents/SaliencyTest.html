<html lang="en">
<head>

<body>
    <h1>CollageMaker — SaliencyAnalyzer Unit Tests</h1>
    <p class="test-plan-ref">Covers: Section 3.3.2 (all 72 tests) — Pure functions only, no TF.js or browser dependencies</p>
    <div id="mocha"></div>

    <script src="https://unpkg.com/mocha@10.2.0/mocha.js"></script>
    <script src="https://unpkg.com/chai@4.3.10/chai.js"></script>
    <script>mocha.setup('bdd');</script>

    <script type="module">
        import {
            computeFocusPoint,
            filterDetections,
            computeBboxCentroid,
            saliencyCrop,
            computeInferenceSize,
            scaleDetectionUp,
            SALIENCY_CONFIG,
            WORKER_MSG,
            createSaliencyAnalyzer
        } from '../MyESModules/Saliency/SaliencyAnalyzer.js';

        const { expect } = chai;

        const defaultConfig = {
            FACE_CONFIDENCE_THRESHOLD: 0.5,
            OBJECT_CONFIDENCE_THRESHOLD: 0.3,
            MIN_DETECTION_PIXEL_SIZE: 20
        };

        function face(bbox, conf = 0.9) {
            return { bbox: { ...bbox }, confidence: conf };
        }

        function object(bbox, conf = 0.7) {
            return { bbox: { ...bbox }, confidence: conf };
        }

        // ============================================================
        // 3.3.2.1 — 3.3.2.24: Focus Point Computation
        // ============================================================
        describe('computeFocusPoint', () => {
            it('3.3.2.1 — Single face detection → focus on face center', () => {
                const result = computeFocusPoint(
                    { faces: [face({ x: 400, y: 300, w: 200, h: 200 })] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                // Face center: (400+100, 300+100) = (500, 400) → normalized (0.5, 0.4)
                expect(result.focusPoint.x).to.equal(0.5);
                expect(result.focusPoint.y).to.equal(0.4);
                expect(result.source).to.equal('face-detection');
            });

            it('3.3.2.2 — Single face at top-left → focus shifted to top-left', () => {
                const result = computeFocusPoint(
                    { faces: [face({ x: 50, y: 50, w: 100, h: 100 }, 0.8)] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                // Face center: (100, 100) → normalized (0.1, 0.1)
                expect(result.focusPoint.x).to.equal(0.1);
                expect(result.focusPoint.y).to.equal(0.1);
                expect(result.source).to.equal('face-detection');
            });

            it('3.3.2.3 — Single face at bottom-right → focus shifted to bottom-right', () => {
                const result = computeFocusPoint(
                    { faces: [face({ x: 850, y: 850, w: 100, h: 100 }, 0.8)] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                // Face center: (900, 900) → normalized (0.9, 0.9)
                expect(result.focusPoint.x).to.equal(0.9);
                expect(result.focusPoint.y).to.equal(0.9);
                expect(result.source).to.equal('face-detection');
            });

            it('3.3.2.4 — Multiple faces → centroid of all face centers', () => {
                const result = computeFocusPoint(
                    { faces: [
                        face({ x: 50, y: 50, w: 100, h: 100 }),
                        face({ x: 850, y: 850, w: 100, h: 100 })
                    ] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                // Centers: (100, 100) and (900, 900) → avg (500, 500) → (0.5, 0.5)
                expect(result.focusPoint.x).to.equal(0.5);
                expect(result.focusPoint.y).to.equal(0.5);
                expect(result.source).to.equal('face-detection');
            });

            it('3.3.2.5 — Three faces in triangle → centroid', () => {
                const result = computeFocusPoint(
                    { faces: [
                        face({ x: 50, y: 50, w: 100, h: 100 }),    // center (100, 100)
                        face({ x: 850, y: 50, w: 100, h: 100 }),   // center (900, 100)
                        face({ x: 450, y: 850, w: 100, h: 100 })   // center (500, 900)
                    ] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                // Centroid: ((100+900+500)/3, (100+100+900)/3) = (500, 366.67) → (0.5, 0.367)
                expect(result.focusPoint.x).to.equal(0.5);
                expect(result.focusPoint.y).to.be.closeTo(0.3667, 0.001);
                expect(result.source).to.equal('face-detection');
            });

            it('3.3.2.6 — No detections → center of image', () => {
                const result = computeFocusPoint(
                    { faces: [], objects: [] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                expect(result.focusPoint.x).to.equal(0.5);
                expect(result.focusPoint.y).to.equal(0.5);
                expect(result.source).to.equal('center-fallback');
            });

            it('3.3.2.7 — No faces but objects → use object centroid', () => {
                const result = computeFocusPoint(
                    { faces: [], objects: [object({ x: 600, y: 400, w: 200, h: 200 })] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                // Object center: (700, 500) → normalized (0.7, 0.5)
                expect(result.focusPoint.x).to.equal(0.7);
                expect(result.focusPoint.y).to.equal(0.5);
                expect(result.source).to.equal('coco-ssd');
            });

            it('3.3.2.8 — Face + object mix → prioritize faces over objects', () => {
                const result = computeFocusPoint(
                    {
                        faces: [face({ x: 50, y: 50, w: 100, h: 100 })],
                        objects: [object({ x: 800, y: 800, w: 100, h: 100 })]
                    },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                // Face center: (100, 100) → (0.1, 0.1)
                expect(result.focusPoint.x).to.equal(0.1);
                expect(result.focusPoint.y).to.equal(0.1);
                expect(result.source).to.equal('face-detection');
            });

            it('3.3.2.9 — Detection at image boundary → clamp to valid range', () => {
                const result = computeFocusPoint(
                    { faces: [face({ x: 0, y: 0, w: 100, h: 100 })] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                // Face center: (50, 50) → (0.05, 0.05)
                expect(result.focusPoint.x).to.equal(0.05);
                expect(result.focusPoint.y).to.equal(0.05);
                expect(result.focusPoint.x).to.be.at.least(0);
                expect(result.focusPoint.y).to.be.at.least(0);
            });

            it('3.3.2.10 — Detection extending beyond image → clamp bbox', () => {
                const result = computeFocusPoint(
                    { faces: [face({ x: 950, y: 950, w: 100, h: 100 })] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                // Face center: (1000, 1000) → (1.0, 1.0) — clamped
                expect(result.focusPoint.x).to.equal(1.0);
                expect(result.focusPoint.y).to.equal(1.0);
                expect(result.focusPoint.x).to.be.at.most(1);
                expect(result.focusPoint.y).to.be.at.most(1);
            });

            it('3.3.2.11 — Very small detection below min size → ignored', () => {
                const result = computeFocusPoint(
                    { faces: [face({ x: 500, y: 500, w: 5, h: 5 })] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                // 5px < 20px min — filtered out, falls back to center
                expect(result.focusPoint.x).to.equal(0.5);
                expect(result.focusPoint.y).to.equal(0.5);
                expect(result.source).to.equal('center-fallback');
            });

            it('3.3.2.12 — Detection exactly at min size threshold → included', () => {
                const result = computeFocusPoint(
                    { faces: [face({ x: 500, y: 500, w: 20, h: 20 })] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                // 20px >= 20px min — included
                expect(result.source).to.equal('face-detection');
                expect(result.focusPoint.x).to.be.a('number');
                expect(result.focusPoint.y).to.be.a('number');
            });

            it('3.3.2.13 — Low confidence face below threshold → filtered', () => {
                const result = computeFocusPoint(
                    { faces: [face({ x: 400, y: 400, w: 200, h: 200 }, 0.3)] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                // conf 0.3 < 0.5 threshold — filtered out
                expect(result.source).to.equal('center-fallback');
            });

            it('3.3.2.14 — Low confidence face at threshold → included', () => {
                const result = computeFocusPoint(
                    { faces: [face({ x: 400, y: 400, w: 200, h: 200 }, 0.5)] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                // conf 0.5 >= 0.5 threshold — included
                expect(result.source).to.equal('face-detection');
            });

            it('3.3.2.15 — Low confidence object below threshold → filtered', () => {
                const result = computeFocusPoint(
                    { faces: [], objects: [object({ x: 400, y: 400, w: 200, h: 200 }, 0.2)] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                // conf 0.2 < 0.3 threshold — filtered out
                expect(result.source).to.equal('center-fallback');
            });

            it('3.3.2.16 — Mixed confidence: one high, one low face → only high used', () => {
                const result = computeFocusPoint(
                    { faces: [
                        face({ x: 50, y: 50, w: 100, h: 100 }, 0.9),
                        face({ x: 850, y: 850, w: 100, h: 100 }, 0.3)
                    ] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                // Only high-confidence face at (100, 100) → (0.1, 0.1)
                expect(result.focusPoint.x).to.equal(0.1);
                expect(result.focusPoint.y).to.equal(0.1);
            });

            it('3.3.2.17 — All faces low confidence, objects high → fall back to objects', () => {
                const result = computeFocusPoint(
                    {
                        faces: [face({ x: 50, y: 50, w: 100, h: 100 }, 0.3)],
                        objects: [object({ x: 800, y: 400, w: 100, h: 200 }, 0.7)]
                    },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                // All faces filtered, object at (850, 500) → (0.85, 0.5)
                expect(result.source).to.equal('coco-ssd');
                expect(result.focusPoint.x).to.equal(0.85);
                expect(result.focusPoint.y).to.equal(0.5);
            });

            it('3.3.2.18 — Portrait image with face at center', () => {
                const result = computeFocusPoint(
                    { faces: [face({ x: 400, y: 400, w: 200, h: 200 })] },
                    { width: 1080, height: 1920 },
                    defaultConfig
                );
                // Face center: (500, 500) → (500/1080, 500/1920)
                expect(result.focusPoint.x).to.be.closeTo(500 / 1080, 0.001);
                expect(result.focusPoint.y).to.be.closeTo(500 / 1920, 0.001);
                expect(result.source).to.equal('face-detection');
            });

            it('3.3.2.19 — Panoramic image (21:9) with face at left third', () => {
                const result = computeFocusPoint(
                    { faces: [face({ x: 300, y: 400, w: 100, h: 100 })] },
                    { width: 3780, height: 1800 },
                    defaultConfig
                );
                // Face center: (350, 450) → (350/3780, 450/1800)
                expect(result.focusPoint.x).to.be.closeTo(350 / 3780, 0.001);
                expect(result.focusPoint.y).to.be.closeTo(450 / 1800, 0.001);
                expect(result.source).to.equal('face-detection');
            });

            it('3.3.2.20 — Empty detections object → center fallback', () => {
                const result = computeFocusPoint(
                    {},
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                expect(result.focusPoint.x).to.equal(0.5);
                expect(result.focusPoint.y).to.equal(0.5);
                expect(result.source).to.equal('center-fallback');
            });

            it('3.3.2.21 — Null/undefined faces array → center fallback', () => {
                const result = computeFocusPoint(
                    { objects: [] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                expect(result.focusPoint.x).to.equal(0.5);
                expect(result.focusPoint.y).to.equal(0.5);
                expect(result.source).to.equal('center-fallback');
            });

            it('3.3.2.22 — Null/undefined objects array → center fallback', () => {
                const result = computeFocusPoint(
                    { faces: [] },
                    { width: 1000, height: 1000 },
                    defaultConfig
                );
                expect(result.focusPoint.x).to.equal(0.5);
                expect(result.focusPoint.y).to.equal(0.5);
                expect(result.source).to.equal('center-fallback');
            });

            it('3.3.2.23 — Zero-size image → center fallback', () => {
                const result = computeFocusPoint(
                    { faces: [face({ x: 400, y: 400, w: 200, h: 200 })] },
                    { width: 0, height: 0 },
                    defaultConfig
                );
                expect(result.focusPoint.x).to.equal(0.5);
                expect(result.focusPoint.y).to.equal(0.5);
            });

            it('3.3.2.24 — Very small image (50x50) with detection', () => {
                const result = computeFocusPoint(
                    { faces: [face({ x: 15, y: 15, w: 20, h: 20 })] },
                    { width: 50, height: 50 },
                    defaultConfig
                );
                // Face center: (25, 25) → (0.5, 0.5)
                expect(result.focusPoint.x).to.equal(0.5);
                expect(result.focusPoint.y).to.equal(0.5);
                expect(result.source).to.equal('face-detection');
            });
        });

        // ============================================================
        // 3.3.2.25 — 3.3.2.45: Saliency Crop Shifting
        // ============================================================
        describe('saliencyCrop', () => {
            const img1000 = { width: 1000, height: 1000 };

            it('3.3.2.25 — Focus at center → same as center crop', () => {
                const centerCrop = { x: 500, y: 0, width: 1000, height: 1000 };
                const result = saliencyCrop(centerCrop, { x: 0.5, y: 0.5 }, img1000);
                expect(result.x).to.equal(500);
                expect(result.y).to.equal(0);
                expect(result.width).to.equal(1000);
                expect(result.height).to.equal(1000);
            });

            it('3.3.2.26 — Focus at top-left → crop shifts toward top-left', () => {
                const centerCrop = { x: 250, y: 250, width: 500, height: 500 };
                const result = saliencyCrop(centerCrop, { x: 0.0, y: 0.0 }, img1000);
                // Crop center (500, 500) → focus (0, 0): shift by (-500, -500)
                // newX = 250 - 500 = -250 → clamped to 0
                // newY = 250 - 500 = -250 → clamped to 0
                expect(result.x).to.equal(0);
                expect(result.y).to.equal(0);
                expect(result.x).to.be.lessThan(centerCrop.x);
            });

            it('3.3.2.27 — Focus at bottom-right → crop shifts toward bottom-right', () => {
                const centerCrop = { x: 250, y: 250, width: 500, height: 500 };
                const result = saliencyCrop(centerCrop, { x: 1.0, y: 1.0 }, img1000);
                // Crop center (500, 500) → focus (1000, 1000): shift by (500, 500)
                // newX = 250 + 500 = 750, clamped: min(750, 1000-500) = 500
                // newY = 250 + 500 = 750, clamped: min(750, 1000-500) = 500
                expect(result.x).to.equal(500);
                expect(result.y).to.equal(500);
                expect(result.x).to.be.greaterThan(centerCrop.x);
            });

            it('3.3.2.28 — Focus at top edge midpoint → crop shifts up', () => {
                const centerCrop = { x: 250, y: 250, width: 500, height: 500 };
                const result = saliencyCrop(centerCrop, { x: 0.5, y: 0.0 }, img1000);
                // Crop center (500, 500) → focus (500, 0): shift by (0, -500)
                // newY = 250 - 500 = -250 → clamped to 0
                expect(result.y).to.equal(0);
                expect(result.y).to.be.lessThan(centerCrop.y);
            });

            it('3.3.2.29 — Focus at bottom edge midpoint → crop shifts down', () => {
                const centerCrop = { x: 250, y: 250, width: 500, height: 500 };
                const result = saliencyCrop(centerCrop, { x: 0.5, y: 1.0 }, img1000);
                // Crop center (500, 500) → focus (500, 1000): shift by (0, 500)
                // newY = 250 + 500 = 750 → clamped to 500
                expect(result.y).to.equal(500);
                expect(result.y).to.be.greaterThan(centerCrop.y);
            });

            it('3.3.2.30 — Focus at left edge midpoint → crop shifts left', () => {
                const centerCrop = { x: 250, y: 250, width: 500, height: 500 };
                const result = saliencyCrop(centerCrop, { x: 0.0, y: 0.5 }, img1000);
                // Crop center (500, 500) → focus (0, 500): shift by (-500, 0)
                // newX = 250 - 500 = -250 → clamped to 0
                expect(result.x).to.equal(0);
                expect(result.x).to.be.lessThan(centerCrop.x);
            });

            it('3.3.2.31 — Focus at right edge midpoint → crop shifts right', () => {
                const centerCrop = { x: 250, y: 250, width: 500, height: 500 };
                const result = saliencyCrop(centerCrop, { x: 1.0, y: 0.5 }, img1000);
                // Crop center (500, 500) → focus (1000, 500): shift by (500, 0)
                // newX = 250 + 500 = 750 → clamped to 500
                expect(result.x).to.equal(500);
                expect(result.x).to.be.greaterThan(centerCrop.x);
            });

            it('3.3.2.32 — Crop clamping: shift does not exceed image bounds left', () => {
                const centerCrop = { x: 100, y: 100, width: 200, height: 200 };
                const result = saliencyCrop(centerCrop, { x: 0.0, y: 0.0 }, img1000);
                expect(result.x).to.be.at.least(0);
            });

            it('3.3.2.33 — Crop clamping: shift does not exceed image bounds right', () => {
                const centerCrop = { x: 700, y: 100, width: 200, height: 200 };
                const result = saliencyCrop(centerCrop, { x: 1.0, y: 0.5 }, img1000);
                expect(result.x + result.width).to.be.at.most(img1000.width);
            });

            it('3.3.2.34 — Crop clamping: shift does not exceed image bounds top', () => {
                const centerCrop = { x: 100, y: 100, width: 200, height: 200 };
                const result = saliencyCrop(centerCrop, { x: 0.5, y: 0.0 }, img1000);
                expect(result.y).to.be.at.least(0);
            });

            it('3.3.2.35 — Crop clamping: shift does not exceed image bounds bottom', () => {
                const centerCrop = { x: 100, y: 700, width: 200, height: 200 };
                const result = saliencyCrop(centerCrop, { x: 0.5, y: 1.0 }, img1000);
                expect(result.y + result.height).to.be.at.most(img1000.height);
            });

            it('3.3.2.36 — Crop preserves aspect ratio after shift', () => {
                const centerCrop = { x: 250, y: 250, width: 500, height: 300 };
                const result = saliencyCrop(centerCrop, { x: 0.0, y: 1.0 }, img1000);
                expect(result.width / result.height).to.equal(centerCrop.width / centerCrop.height);
            });

            it('3.3.2.37 — Crop preserves dimensions after shift', () => {
                const centerCrop = { x: 250, y: 250, width: 500, height: 300 };
                const result = saliencyCrop(centerCrop, { x: 0.3, y: 0.7 }, img1000);
                expect(result.width).to.equal(centerCrop.width);
                expect(result.height).to.equal(centerCrop.height);
            });

            it('3.3.2.38 — Very wide panel crop (21:9) with focus at center', () => {
                const centerCrop = { x: 0, y: 200, width: 1000, height: 428 };
                const result = saliencyCrop(centerCrop, { x: 0.5, y: 0.5 }, img1000);
                expect(result).to.deep.equal(centerCrop);
            });

            it('3.3.2.39 — Very tall panel crop (9:21) with focus at bottom', () => {
                const centerCrop = { x: 286, y: 0, width: 428, height: 1000 };
                const result = saliencyCrop(centerCrop, { x: 0.5, y: 1.0 }, img1000);
                // Crop fills entire height — no room to shift
                expect(result.y).to.equal(0);
            });

            it('3.3.2.40 — Square panel crop with focus slightly off-center', () => {
                const centerCrop = { x: 250, y: 250, width: 500, height: 500 };
                const result = saliencyCrop(centerCrop, { x: 0.6, y: 0.4 }, img1000);
                // Crop center (500, 500) → focus (600, 400): shift by (100, -100)
                expect(result.x).to.equal(350);
                expect(result.y).to.equal(150);
            });

            it('3.3.2.41 — Crop with minimum size (1px) — shift still works', () => {
                const centerCrop = { x: 500, y: 500, width: 1, height: 1 };
                const result = saliencyCrop(centerCrop, { x: 0.0, y: 0.0 }, img1000);
                // Crop center (500.5, 500.5) → focus (0, 0): shift by (-500.5, -500.5)
                // Clamped to (0, 0)
                expect(result.x).to.equal(0);
                expect(result.y).to.equal(0);
            });

            it('3.3.2.42 — Crop fills entire image — no shift possible', () => {
                const centerCrop = { x: 0, y: 0, width: 1000, height: 1000 };
                const result = saliencyCrop(centerCrop, { x: 0.1, y: 0.1 }, img1000);
                expect(result).to.deep.equal(centerCrop);
            });

            it('3.3.2.43 — Focus point outside [0,1] range → clamped', () => {
                const centerCrop = { x: 250, y: 250, width: 500, height: 500 };
                const result = saliencyCrop(centerCrop, { x: 1.5, y: -0.5 }, img1000);
                // Clamped to (1.0, 0.0): crop center (500,500) → focus (1000,0): shift (500,-500)
                // newX = 250+500=750, clamped to 500; newY = 250-500=-250, clamped to 0
                expect(result.x).to.equal(500);
                expect(result.y).to.equal(0);
            });

            it('3.3.2.44 — NaN focus point → treated as center', () => {
                const centerCrop = { x: 250, y: 250, width: 500, height: 500 };
                const result = saliencyCrop(centerCrop, { x: NaN, y: NaN }, img1000);
                expect(result).to.deep.equal(centerCrop);
            });

            it('3.3.2.45 — Infinity focus point → clamped to edge', () => {
                const centerCrop = { x: 250, y: 250, width: 500, height: 500 };
                const result = saliencyCrop(centerCrop, { x: Infinity, y: -Infinity }, img1000);
                // Clamped to (1.0, 0.0)
                expect(result.x).to.be.at.least(0);
                expect(result.x).to.be.at.most(img1000.width - centerCrop.width);
                expect(result.y).to.equal(0);
            });

            it('3.3.2.45b — saliencyCrop with null focusPoint returns centerCrop unchanged', () => {
                const centerCrop = { x: 250, y: 250, width: 500, height: 500 };
                const result = saliencyCrop(centerCrop, null, img1000);
                expect(result).to.deep.equal(centerCrop);
            });

            it('3.3.2.45c — saliencyCrop with null centerCrop returns safe default', () => {
                const result = saliencyCrop(null, { x: 0.5, y: 0.5 }, img1000);
                expect(result).to.deep.equal({ x: 0, y: 0, width: 0, height: 0 });
            });

            it('3.3.2.45d — saliencyCrop with null imageSize returns centerCrop unchanged', () => {
                const centerCrop = { x: 250, y: 250, width: 500, height: 500 };
                const result = saliencyCrop(centerCrop, { x: 0.3, y: 0.7 }, null);
                expect(result).to.deep.equal(centerCrop);
            });
        });

        // ============================================================
        // 3.3.2.46 — 3.3.2.52: Detection Filtering
        // ============================================================
        describe('filterDetections', () => {
            it('3.3.2.46 — All pass threshold', () => {
                const detections = [
                    { bbox: { x: 0, y: 0, w: 100, h: 100 }, confidence: 0.9 },
                    { bbox: { x: 0, y: 0, w: 100, h: 100 }, confidence: 0.8 },

        // ============================================================
        // CR-11: Saliency Timeout Guard (1.2.1 — 1.2.5)
        // ============================================================
        describe('createSaliencyAnalyzer timeout guard', () => {
            let originalWorker;
            const originalTimeout = SALIENCY_CONFIG.INFERENCE_TIMEOUT_MS;

            beforeEach(() => {
                originalWorker = window.Worker;
                // Use a short timeout for testing (50ms instead of 15000ms)
                Object.defineProperty(SALIENCY_CONFIG, 'INFERENCE_TIMEOUT_MS', {
                    value: 50,
                    writable: true,
                    configurable: true,
                    enumerable: true
                });
            });

            afterEach(() => {
                window.Worker = originalWorker;
                Object.defineProperty(SALIENCY_CONFIG, 'INFERENCE_TIMEOUT_MS', {
                    value: originalTimeout,
                    writable: true,
                    configurable: true,
                    enumerable: true
                });
            });

            function mockWorkerThatNeverLoads() {
                let messageHandler = null;
                window.Worker = function () {
                    const self = this;
                    Object.defineProperty(self, 'onmessage', {
                        set: function (fn) { messageHandler = fn; },
                        configurable: true
                    });
                    Object.defineProperty(self, 'onerror', {
                        set: function () {},
                        configurable: true
                    });
                    this.postMessage = function () {};
                    this.terminate = function () {};
                };
                return { messageHandler };
            }

            function mockWorkerThatLoads(models) {
                let messageHandler = null;
                window.Worker = function () {
                    const self = this;
                    Object.defineProperty(self, 'onmessage', {
                        set: function (fn) {
                            messageHandler = fn;
                            // Simulate worker responding with models ready after handler is set
                            setTimeout(() => {
                                if (messageHandler) {
                                    messageHandler({ data: { type: WORKER_MSG.MODELS_READY, models: models } });
                                }
                            }, 10);
                        },
                        configurable: true
                    });
                    Object.defineProperty(self, 'onerror', {
                        set: function () {},
                        configurable: true
                    });
                    this.postMessage = function () {};
                    this.terminate = function () {};
                };
                return { messageHandler };
            }

            it('1.2.1 — Timeout fires and state becomes failed if models never load', async () => {
                mockWorkerThatNeverLoads();
                let failedCalled = false;
                const analyzer = createSaliencyAnalyzer({
                    onModelsFailed: () => { failedCalled = true; }
                });

                analyzer.initModels();
                expect(analyzer.getState()).to.equal('loading');

                // Wait longer than the short timeout used in tests
                await new Promise(r => setTimeout(r, 100));

                expect(analyzer.getState()).to.equal('failed');
                expect(failedCalled).to.be.true;
            });

            it('1.2.2 — onModelsFailed called with timeout message on timeout', async () => {
                mockWorkerThatNeverLoads();
                let errorMsg = null;
                const analyzer = createSaliencyAnalyzer({
                    onModelsFailed: (msg) => { errorMsg = msg; }
                });

                analyzer.initModels();
                await new Promise(r => setTimeout(r, 100));

                expect(errorMsg).to.be.a('string');
                expect(errorMsg.toLowerCase()).to.include('timeout');
            });

            it('1.2.3 — Timeout cleared on successful model load', async () => {
                mockWorkerThatLoads(['face-detection']);
                let failedCalled = false;
                const analyzer = createSaliencyAnalyzer({
                    onModelsFailed: () => { failedCalled = true; }
                });

                analyzer.initModels();
                expect(analyzer.getState()).to.equal('loading');

                // Wait for models to load (10ms) plus some buffer
                await new Promise(r => setTimeout(r, 50));

                expect(analyzer.getState()).to.equal('ready');

                // Now wait well past the timeout — should NOT fire
                await new Promise(r => setTimeout(r, 100));

                expect(analyzer.getState()).to.equal('ready');
                expect(failedCalled).to.be.false;
            });

            it('1.2.4 — Timeout cleared on dispose while loading', async () => {
                mockWorkerThatNeverLoads();
                let failedCalled = false;
                const analyzer = createSaliencyAnalyzer({
                    onModelsFailed: () => { failedCalled = true; }
                });

                analyzer.initModels();
                expect(analyzer.getState()).to.equal('loading');

                // Dispose before timeout fires
                analyzer.dispose();

                // Wait past the timeout duration
                await new Promise(r => setTimeout(r, 100));

                expect(failedCalled).to.be.false;
            });

            it('1.2.5 — State is loading immediately after initModels', () => {
                mockWorkerThatNeverLoads();
                const analyzer = createSaliencyAnalyzer({});
                expect(analyzer.getState()).to.equal('idle');
                analyzer.initModels();
                expect(analyzer.getState()).to.equal('loading');
            });
        });

        // Run mocha after all tests are defined
        window.addEventListener('load', () => {
            mocha.run();
        });
