<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title Multi-line Tests</title>
    <link rel="stylesheet" href="https://unpkg.com/mocha@10.2.0/mocha.css">
    <style>
        body { margin: 20px; font-family: sans-serif; }
        #mocha { margin-top: 20px; }
        .test-plan-ref { color: #888; font-size: 0.85em; }
    </style>
</head>
<body>
    <h1>CollageMaker — Multi-line Title Unit Tests</h1>
    <p class="test-plan-ref">Covers: Phase 4 — Multi-line Title Support (up to 3 lines)</p>
    <div id="mocha"></div>

    <script src="https://unpkg.com/mocha@10.2.0/mocha.js"></script>
    <script src="https://unpkg.com/chai@4.3.10/chai.js"></script>
    <script>mocha.setup('bdd');</script>

    <script type="module">
        import { createTitleManager } from '../MyESModules/State/TitleManager.js';
        import { render, computeMultiLineBounds, splitRunsByNewline, PADDING } from '../MyESModules/Rendering/TitleRenderer.js';
        import { createTitleRun } from '../MyESModules/Models/TitleRun.js';

        const { expect } = chai;

        // ============================================================
        // Helpers
        // ============================================================

        function makeTitleRun({ text = '', bold = false, italic = false, underline = false } = {}) {
            return { text, bold, italic, underline };
        }

        function makeTitleStyle({
            fontSize = 36,
            fontFamily = 'Arial',
            fontColor = '#FFFFFF',
            alignment = 'center',
            showBackground = false,
            backgroundColor = '#000000',
            fontOpacity = 1.0,
            bgOpacity = 1.0,
            titleBoxWidth = null,
            titleBoxX = null,
            titleBoxY = null
        } = {}) {
            return {
                fontSize,
                fontFamily,
                fontColor,
                alignment,
                showBackground,
                backgroundColor,
                fontOpacity,
                bgOpacity,
                titleBoxWidth,
                titleBoxX,
                titleBoxY
            };
        }

        function makeState(titleText = '', titleRuns = [], titleStyle = null) {
            return {
                titleText,
                titleRuns,
                titleStyle: titleStyle || {
                    fontFamily: 'Arial',
                    fontSize: 36,
                    fontColor: '#FFFFFF',
                    backgroundColor: '#000000',
                    alignment: 'center',
                    showBackground: false
                }
            };
        }

        // Mock context factory — wraps a real canvas context and
        // records every method call for inspection using Proxy.
        function createMockCtx(width = 1920, height = 1080) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const realCtx = canvas.getContext('2d');

            const calls = {
                font: [],
                fillStyle: [],
                fillText: [],
                fillRect: [],
                measureText: [],
                textBaseline: [],
                globalAlpha: [],
                save: [],
                restore: [],
                strokeRect: [],
                strokeStyle: [],
                lineWidth: [],
                setLineDash: []
            };

            const ctx = new Proxy(realCtx, {
                set(target, prop, value) {
                    if (prop === 'font') calls.font.push(value);
                    else if (prop === 'fillStyle') calls.fillStyle.push(value);
                    else if (prop === 'strokeStyle') calls.strokeStyle.push(value);
                    else if (prop === 'lineWidth') calls.lineWidth.push(value);
                    else if (prop === 'textBaseline') calls.textBaseline.push(value);
                    else if (prop === 'globalAlpha') calls.globalAlpha.push(value);
                    target[prop] = value;
                    return true;
                },
                get(target, prop) {
                    if (prop === 'font') return calls.font[calls.font.length - 1] || '36px Arial';
                    if (prop === 'fillStyle') return calls.fillStyle[calls.fillStyle.length - 1] || '#FFFFFF';
                    if (prop === 'textBaseline') return calls.textBaseline[calls.textBaseline.length - 1] || 'alphabetic';
                    if (prop === 'fillText') {
                        return function(text, x, y) {
                            calls.fillText.push({ text, x, y });
                            return target.fillText.call(target, text, x, y);
                        };
                    }
                    if (prop === 'fillRect') {
                        return function(x, y, w, h) {
                            calls.fillRect.push({ x, y, w, h });
                            return target.fillRect.call(target, x, y, w, h);
                        };
                    }
                    if (prop === 'measureText') {
                        return function(text) {
                            const metrics = target.measureText.call(target, text);
                            calls.measureText.push({ text, width: metrics.width });
                            return metrics;
                        };
                    }
                    if (prop === 'save') {
                        return function() {
                            calls.save.push({});
                            return target.save.call(target);
                        };
                    }
                    if (prop === 'restore') {
                        return function() {
                            calls.restore.push({});
                            return target.restore.call(target);
                        };
                    }
                    if (prop === 'strokeRect') {
                        return function(x, y, w, h) {
                            calls.strokeRect.push({ x, y, w, h });
                            return target.strokeRect.call(target, x, y, w, h);
                        };
                    }
                    if (prop === 'setLineDash') {
                        return function(dash) {
                            calls.setLineDash.push([...dash]);
                            return target.setLineDash.call(target, dash);
                        };
                    }
                    return target[prop];
                }
            });

            return { ctx, calls };
        }

        // ============================================================
        // Section 4.1: splitRunsByNewline — Pure Function Tests
        // ============================================================
        describe('Section 4.1 — splitRunsByNewline (pure function)', () => {
            it('4.1.1 — Single run with no newlines returns one line', () => {
                const runs = [makeTitleRun({ text: 'Hello' })];
                const lines = splitRunsByNewline(runs);
                expect(lines.length).to.equal(1);
                expect(lines[0].length).to.equal(1);
                expect(lines[0][0].text).to.equal('Hello');
            });

            it('4.1.2 — Single run with one newline returns two lines', () => {
                const runs = [makeTitleRun({ text: 'Hello\nWorld' })];
                const lines = splitRunsByNewline(runs);
                expect(lines.length).to.equal(2);
                expect(lines[0][0].text).to.equal('Hello');
                expect(lines[1][0].text).to.equal('World');
            });

            it('4.1.3 — Single run with two newlines returns three lines', () => {
                const runs = [makeTitleRun({ text: 'A\nB\nC' })];
                const lines = splitRunsByNewline(runs);
                expect(lines.length).to.equal(3);
                expect(lines[0][0].text).to.equal('A');
                expect(lines[1][0].text).to.equal('B');
                expect(lines[2][0].text).to.equal('C');
            });

            it('4.1.4 — Formatting preserved across split lines', () => {
                const runs = [makeTitleRun({ text: 'A\nB\nC', bold: true, italic: true })];
                const lines = splitRunsByNewline(runs);
                expect(lines[0][0].bold).to.be.true;
                expect(lines[0][0].italic).to.be.true;
                expect(lines[1][0].bold).to.be.true;
                expect(lines[1][0].italic).to.be.true;
                expect(lines[2][0].bold).to.be.true;
                expect(lines[2][0].italic).to.be.true;
            });

            it('4.1.5 — Multiple runs with newlines split correctly', () => {
                const runs = [
                    makeTitleRun({ text: 'Hello\n', bold: true }),
                    makeTitleRun({ text: 'World', bold: false })
                ];
                const lines = splitRunsByNewline(runs);
                expect(lines.length).to.equal(2);
                // Line 1: 'Hello' (bold)
                expect(lines[0].length).to.equal(1);
                expect(lines[0][0].text).to.equal('Hello');
                expect(lines[0][0].bold).to.be.true;
                // Line 2: 'World' (plain)
                expect(lines[1].length).to.equal(1);
                expect(lines[1][0].text).to.equal('World');
                expect(lines[1][0].bold).to.be.false;
            });

            it('4.1.6 — Empty runs array returns empty lines array', () => {
                const lines = splitRunsByNewline([]);
                expect(lines.length).to.equal(0);
            });

            it('4.1.7 — Trailing newline does not create empty trailing line', () => {
                const runs = [makeTitleRun({ text: 'Hello\nWorld\n' })];
                const lines = splitRunsByNewline(runs);
                expect(lines.length).to.equal(2);
                expect(lines[0][0].text).to.equal('Hello');
                expect(lines[1][0].text).to.equal('World');
            });

            it('4.1.8 — Leading newline creates empty first line content', () => {
                // A leading \n means first part is empty string, skip it
                const runs = [makeTitleRun({ text: '\nWorld' })];
                const lines = splitRunsByNewline(runs);
                expect(lines.length).to.equal(1);
                expect(lines[0][0].text).to.equal('World');
            });

            it('4.1.9 — Run with text before and after newline and multiple runs', () => {
                const runs = [
                    makeTitleRun({ text: 'Hi\n', bold: true }),
                    makeTitleRun({ text: 'there\nfriend', bold: false })
                ];
                const lines = splitRunsByNewline(runs);
                expect(lines.length).to.equal(3);
                expect(lines[0][0].text).to.equal('Hi');
                expect(lines[0][0].bold).to.be.true;
                expect(lines[1][0].text).to.equal('there');
                expect(lines[1][0].bold).to.be.false;
                expect(lines[2][0].text).to.equal('friend');
                expect(lines[2][0].bold).to.be.false;
            });
        });

        // ============================================================
        // Section 4.2: computeMultiLineBounds — Pure Function Tests
        // ============================================================
        describe('Section 4.2 — computeMultiLineBounds (pure function)', () => {
            it('4.2.1 — Single line: height = fontSize + 2*PADDING', () => {
                const style = makeTitleStyle({ fontSize: 36 });
                const runs = [makeTitleRun({ text: 'Hello' })];
                const bounds = computeMultiLineBounds(style, runs, 1920, 1080);
                expect(bounds.height).to.equal(36 + PADDING * 2);
            });

            it('4.2.2 — Two lines: height = lineHeight + fontSize + 2*PADDING', () => {
                const style = makeTitleStyle({ fontSize: 36 });
                const runs = [makeTitleRun({ text: 'Hello\nWorld' })];
                const bounds = computeMultiLineBounds(style, runs, 1920, 1080);
                const lineHeight = 36 * 1.2;
                expect(bounds.height).to.equal(lineHeight + 36 + PADDING * 2);
            });

            it('4.2.3 — Three lines: height = 2*lineHeight + fontSize + 2*PADDING', () => {
                const style = makeTitleStyle({ fontSize: 36 });
                const runs = [makeTitleRun({ text: 'A\nB\nC' })];
                const bounds = computeMultiLineBounds(style, runs, 1920, 1080);
                const lineHeight = 36 * 1.2;
                expect(bounds.height).to.equal(2 * lineHeight + 36 + PADDING * 2);
            });

            it('4.2.4 — textWidth is max of all line widths', () => {
                const style = makeTitleStyle({ fontSize: 36 });
                // 'Hello World' is wider than 'Hi'
                const runs = [makeTitleRun({ text: 'Hi\nHello World' })];
                const bounds = computeMultiLineBounds(style, runs, 1920, 1080);
                expect(bounds.textWidth).to.be.greaterThan(0);
                // The textWidth should be the width of the wider line
                expect(bounds.lines.length).to.equal(2);
                expect(bounds.textWidth).to.equal(Math.max(bounds.lines[0].width, bounds.lines[1].width));
            });

            it('4.2.5 — boxWidth = titleBoxWidth when set, else maxLineWidth + 2*PADDING', () => {
                const styleWithWidth = makeTitleStyle({ fontSize: 36, titleBoxWidth: 500 });
                const runs = [makeTitleRun({ text: 'Hi\nWorld' })];
                const bounds = computeMultiLineBounds(styleWithWidth, runs, 1920, 1080);
                expect(bounds.boxWidth).to.equal(500);

                const styleAuto = makeTitleStyle({ fontSize: 36, titleBoxWidth: null });
                const boundsAuto = computeMultiLineBounds(styleAuto, runs, 1920, 1080);
                expect(boundsAuto.boxWidth).to.be.closeTo(boundsAuto.textWidth + PADDING * 2, 1);
            });

            it('4.2.6 — Lines array contains measured runs per line', () => {
                const style = makeTitleStyle({ fontSize: 36 });
                const runs = [makeTitleRun({ text: 'A\nB' })];
                const bounds = computeMultiLineBounds(style, runs, 1920, 1080);
                expect(bounds.lines.length).to.equal(2);
                expect(bounds.lines[0].runs.length).to.equal(1);
                expect(bounds.lines[0].runs[0].text).to.equal('A');
                expect(bounds.lines[1].runs.length).to.equal(1);
                expect(bounds.lines[1].runs[0].text).to.equal('B');
            });

            it('4.2.7 — baselineY = height - MARGIN (same as single-line)', () => {
                const style = makeTitleStyle({ fontSize: 36 });
                const runs = [makeTitleRun({ text: 'A\nB' })];
                const bounds = computeMultiLineBounds(style, runs, 1920, 1080);
                expect(bounds.baselineY).to.equal(1080 - 40); // MARGIN = 40
            });

            it('4.2.8 — contentStartX for center alignment: (boxWidth - maxWidth) / 2', () => {
                const style = makeTitleStyle({ fontSize: 36, alignment: 'center', titleBoxWidth: 500 });
                const runs = [makeTitleRun({ text: 'Hi\nHello World' })];
                const bounds = computeMultiLineBounds(style, runs, 1920, 1080);
                expect(bounds.contentStartX).to.be.closeTo((500 - bounds.textWidth) / 2, 0.5);
            });

            it('4.2.9 — contentStartX for left alignment: 0', () => {
                const style = makeTitleStyle({ fontSize: 36, alignment: 'left', titleBoxWidth: 500 });
                const runs = [makeTitleRun({ text: 'Hi' })];
                const bounds = computeMultiLineBounds(style, runs, 1920, 1080);
                expect(bounds.contentStartX).to.equal(0);
            });

            it('4.2.10 — contentStartX for right alignment: boxWidth - maxWidth', () => {
                const style = makeTitleStyle({ fontSize: 36, alignment: 'right', titleBoxWidth: 500 });
                const runs = [makeTitleRun({ text: 'Hi' })];
                const bounds = computeMultiLineBounds(style, runs, 1920, 1080);
                expect(bounds.contentStartX).to.be.closeTo(500 - bounds.textWidth, 0.5);
            });

            it('4.2.11 — Guards against empty runs', () => {
                const style = makeTitleStyle({ fontSize: 36 });
                const bounds = computeMultiLineBounds(style, [], 1920, 1080);
                expect(bounds.textWidth).to.equal(0);
                expect(bounds.boxWidth).to.equal(PADDING * 2);
                expect(bounds.height).to.equal(36 + PADDING * 2);
            });
        });

        // ============================================================
        // Section 4.3: TitleManager setText — 3-line clamping
        // ============================================================
        describe('Section 4.3 — TitleManager setText 3-line clamping', () => {
            let tm, state;

            beforeEach(() => {
                state = makeState();
                tm = createTitleManager(state);
            });

            it('4.3.1 — setText with 1 line keeps text as-is', () => {
                tm.setText('Hello');
                expect(state.titleText).to.equal('Hello');
                expect(tm.getFullText()).to.equal('Hello');
            });

            it('4.3.2 — setText with 2 lines keeps both lines', () => {
                tm.setText('Hello\nWorld');
                expect(state.titleText).to.equal('Hello\nWorld');
                expect(tm.getFullText()).to.equal('Hello\nWorld');
            });

            it('4.3.3 — setText with 3 lines keeps all three lines', () => {
                tm.setText('A\nB\nC');
                expect(state.titleText).to.equal('A\nB\nC');
                expect(tm.getFullText()).to.equal('A\nB\nC');
            });

            it('4.3.4 — setText with 4 lines strips 4th line', () => {
                tm.setText('A\nB\nC\nD');
                expect(state.titleText).to.equal('A\nB\nC');
                expect(tm.getFullText()).to.equal('A\nB\nC');
            });

            it('4.3.5 — setText with 5 lines keeps only first 3', () => {
                tm.setText('Line1\nLine2\nLine3\nLine4\nLine5');
                expect(state.titleText).to.equal('Line1\nLine2\nLine3');
            });

            it('4.3.6 — setText with empty string clears runs', () => {
                tm.setText('Hello\nWorld');
                tm.setText('');
                expect(state.titleText).to.equal('');
                expect(tm.getRuns().length).to.equal(0);
            });

            it('4.3.7 — setText creates single run with newline chars in text', () => {
                tm.setText('Hello\nWorld');
                const runs = tm.getRuns();
                expect(runs.length).to.equal(1);
                expect(runs[0].text).to.equal('Hello\nWorld');
            });
        });

        // ============================================================
        // Section 4.4: TitleManager insertChar — Newline rejection
        // ============================================================
        describe('Section 4.4 — TitleManager insertChar newline handling', () => {
            let tm, state;

            beforeEach(() => {
                state = makeState();
                tm = createTitleManager(state);
            });

            it('4.4.1 — insertChar newline on 1-line text creates 2 lines', () => {
                tm.setText('Hello');
                tm.insertChar(5, '\n');
                expect(tm.getFullText()).to.equal('Hello\n');
            });

            it('4.4.2 — insertChar newline on 2-line text creates 3 lines', () => {
                tm.setText('Hello\nWorld');
                tm.insertChar(11, '\n');
                expect(tm.getFullText()).to.equal('Hello\nWorld\n');
            });

            it('4.4.3 — insertChar newline on 3-line text is rejected', () => {
                tm.setText('A\nB\nC');
                tm.insertChar(5, '\n'); // Try to add 4th line
                expect(tm.getFullText()).to.equal('A\nB\nC');
            });

            it('4.4.4 — insertChar regular char on 3-line text still works', () => {
                tm.setText('A\nB\nC');
                tm.insertChar(5, 'D');
                expect(tm.getFullText()).to.equal('A\nB\nCD');
            });
        });

        // ============================================================
        // Section 4.5: Multi-line Rendering
        // ============================================================
        describe('Section 4.5 — Multi-line Rendering', () => {
            it('4.5.1 — Two lines produces two fillText calls', () => {
                const { ctx, calls } = createMockCtx(1920, 1080);
                const style = makeTitleStyle();
                const runs = [makeTitleRun({ text: 'Hello\nWorld' })];
                render(ctx, 1920, 1080, style, runs);

                expect(calls.fillText.length).to.equal(2);
                expect(calls.fillText[0].text).to.equal('Hello');
                expect(calls.fillText[1].text).to.equal('World');
            });

            it('4.5.2 — Three lines produces three fillText calls', () => {
                const { ctx, calls } = createMockCtx(1920, 1080);
                const style = makeTitleStyle();
                const runs = [makeTitleRun({ text: 'A\nB\nC' })];
                render(ctx, 1920, 1080, style, runs);

                expect(calls.fillText.length).to.equal(3);
                expect(calls.fillText[0].text).to.equal('A');
                expect(calls.fillText[1].text).to.equal('B');
                expect(calls.fillText[2].text).to.equal('C');
            });

            it('4.5.3 — Single line (backward compat) produces one fillText call', () => {
                const { ctx, calls } = createMockCtx(1920, 1080);
                const style = makeTitleStyle();
                const runs = [makeTitleRun({ text: 'Hello' })];
                render(ctx, 1920, 1080, style, runs);

                expect(calls.fillText.length).to.equal(1);
                expect(calls.fillText[0].text).to.equal('Hello');
            });

            it('4.5.4 — Multi-line fillText y-coordinates are spaced by lineHeight', () => {
                const { ctx, calls } = createMockCtx(1920, 1080);
                const style = makeTitleStyle({ fontSize: 36 });
                const runs = [makeTitleRun({ text: 'A\nB\nC' })];
                render(ctx, 1920, 1080, style, runs);

                const lineHeight = 36 * 1.2;
                // Line 3 (bottom) baseline = 1040 (height - MARGIN)
                // Line 2 baseline = 1040 - lineHeight
                // Line 1 baseline = 1040 - 2*lineHeight
                expect(calls.fillText[2].y).to.equal(1040); // Last line at baselineY
                expect(calls.fillText[1].y).to.be.closeTo(1040 - lineHeight, 0.5);
                expect(calls.fillText[0].y).to.be.closeTo(1040 - 2 * lineHeight, 0.5);
            });

            it('4.5.5 — Multi-line with background: fillRect height covers all lines', () => {
                const { ctx, calls } = createMockCtx(1920, 1080);
                const style = makeTitleStyle({
                    showBackground: true,
                    fontSize: 36
                });
                const runs = [makeTitleRun({ text: 'A\nB\nC' })];
                render(ctx, 1920, 1080, style, runs);

                // Background fillRect should be the first fillRect call (before text drawing)
                const bg = calls.fillRect[0];
                const lineHeight = 36 * 1.2;
                const expectedHeight = 2 * lineHeight + 36 + PADDING * 2;
                expect(bg.h).to.be.closeTo(expectedHeight, 0.5);
            });

            it('4.5.6 — Multi-line with formatting: bold run on line 2', () => {
                const { ctx, calls } = createMockCtx(1920, 1080);
                const style = makeTitleStyle();
                const runs = [
                    makeTitleRun({ text: 'Plain\n', bold: false }),
                    makeTitleRun({ text: 'Bold\n', bold: true }),
                    makeTitleRun({ text: 'Plain', bold: false })
                ];
                render(ctx, 1920, 1080, style, runs);

                expect(calls.fillText.length).to.equal(3);
                // Line 2 should be bold
                expect(calls.font[1]).to.contain('bold');
            });

            it('4.5.7 — Multi-line with underline: underlines drawn on correct lines', () => {
                const { ctx, calls } = createMockCtx(1920, 1080);
                const style = makeTitleStyle({ fontSize: 36 });
                const runs = [makeTitleRun({ text: 'Hi\nThere', underline: true })];
                render(ctx, 1920, 1080, style, runs);

                // Two underlines (one per line)
                const underlines = calls.fillRect.filter(r => r.h === 2);
                expect(underlines.length).to.equal(2);
            });

            it('4.5.8 — Multi-line with interaction state: strokeRect drawn for multi-line box', () => {
                const { ctx, calls } = createMockCtx(1920, 1080);
                const style = makeTitleStyle({ fontSize: 36 });
                const runs = [makeTitleRun({ text: 'A\nB' })];
                render(ctx, 1920, 1080, style, runs, { hoverTarget: 'body' });

                expect(calls.strokeRect.length).to.be.at.least(1);
                // strokeRect height should cover both lines
                const stroke = calls.strokeRect[0];
                const lineHeight = 36 * 1.2;
                const expectedH = lineHeight + 36 + PADDING * 2;
                expect(stroke.h).to.be.closeTo(expectedH + 4, 0.5); // +4 for outline padding
            });

            it('4.5.9 — Multi-line right alignment: each line right-aligned within box', () => {
                const { ctx, calls } = createMockCtx(1920, 1080);
                const style = makeTitleStyle({
                    alignment: 'right',
                    titleBoxWidth: 500,
                    titleBoxX: 0,
                    titleBoxY: 500
                });
                const runs = [makeTitleRun({ text: 'Hi\nHello World' })];
                render(ctx, 1920, 1080, style, runs);

                expect(calls.fillText.length).to.equal(2);
                // Both lines should be right-aligned within the box
                // Line 1 'Hi' should be at x = 0 + (500 - width_of_Hi)
                // Line 2 'Hello World' should be at x = 0 + (500 - width_of_HelloWorld)
                // So line 1 x > line 2 x (shorter text is further right)
                expect(calls.fillText[0].x).to.be.greaterThan(calls.fillText[1].x);
            });

            it('4.5.10 — Multi-line left alignment: each line starts at box left edge', () => {
                const { ctx, calls } = createMockCtx(1920, 1080);
                const style = makeTitleStyle({
                    alignment: 'left',
                    titleBoxWidth: 500,
                    titleBoxX: 0,
                    titleBoxY: 500
                });
                const runs = [makeTitleRun({ text: 'Hi\nHello World' })];
                render(ctx, 1920, 1080, style, runs);

                expect(calls.fillText.length).to.equal(2);
                // Both lines start at x = 0 (box left)
                expect(calls.fillText[0].x).to.equal(0);
                expect(calls.fillText[1].x).to.equal(0);
            });
        });

        // ============================================================
        // Section 4.6: Backward Compatibility
        // ============================================================
        describe('Section 4.6 — Backward Compatibility', () => {
            it('4.6.1 — Single-line title renders at same position as before', () => {
                const { ctx, calls } = createMockCtx(1920, 1080);
                const style = makeTitleStyle({
                    alignment: 'center',
                    titleBoxWidth: null,
                    titleBoxX: null,
                    titleBoxY: null
                });
                const runs = [makeTitleRun({ text: 'Hello' })];
                render(ctx, 1920, 1080, style, runs);

                // Y should be at default bottom margin
                expect(calls.fillText[0].y).to.equal(1080 - 40);
                // X should be centered
                const textWidth = calls.measureText[0].width;
                expect(calls.fillText[0].x).to.be.closeTo((1920 - textWidth) / 2, 1);
            });

            it('4.6.2 — Single-line background height unchanged', () => {
                const { ctx, calls } = createMockCtx(1920, 1080);
                const style = makeTitleStyle({
                    showBackground: true,
                    alignment: 'center',
                    titleBoxWidth: null,
