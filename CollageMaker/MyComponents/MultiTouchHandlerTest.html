<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiTouchHandler Tests</title>
    <link rel="stylesheet" href="https://unpkg.com/mocha@10.2.0/mocha.css">
    <style>
        body { margin: 20px; font-family: sans-serif; }
        #mocha { margin-top: 20px; }
        .test-plan-ref { color: #888; font-size: 0.85em; }
    </style>
</head>
<body>
    <h1>CollageMaker — MultiTouchHandler Unit Tests</h1>
    <p class="test-plan-ref">Covers: Phase 4 — CR-06 Multi-Touch Gestures + Phase 1 — PointerEvents Migration</p>
    <div id="mocha"></div>

    <script src="https://unpkg.com/mocha@10.2.0/mocha.js"></script>
    <script src="https://unpkg.com/chai@4.3.10/chai.js"></script>
    <script>mocha.setup('bdd');</script>

    <script type="module">
        import {
            computeTouchMidpoint,
            computeTouchDistance,
            computePinchScale,
            applyZoomExponent,
            createMultiTouchHandler
        } from '../MyESModules/Interaction/MultiTouchHandler.js';
        import { LayoutStyle } from '../MyESModules/Models/LayoutStyle.js';

        const { expect } = chai;

        // ============================================================
        // Pure Math Functions — testable without DOM
        // ============================================================
        describe('computeTouchMidpoint', () => {
            it('returns midpoint of two touches', () => {
                const t1 = { clientX: 100, clientY: 200 };
                const t2 = { clientX: 300, clientY: 400 };
                const mid = computeTouchMidpoint(t1, t2);
                expect(mid.x).to.equal(200);
                expect(mid.y).to.equal(300);
            });

            it('returns same point when touches are identical', () => {
                const t = { clientX: 100, clientY: 200 };
                const mid = computeTouchMidpoint(t, t);
                expect(mid.x).to.equal(100);
                expect(mid.y).to.equal(200);
            });

            it('handles non-integer coordinates', () => {
                const t1 = { clientX: 100.5, clientY: 200.3 };
                const t2 = { clientX: 300.7, clientY: 400.9 };
                const mid = computeTouchMidpoint(t1, t2);
                expect(mid.x).to.equal(200.6);
                expect(mid.y).to.equal(300.6);
            });
        });

        describe('computeTouchDistance', () => {
            it('computes Euclidean distance between two touches', () => {
                const t1 = { clientX: 0, clientY: 0 };
                const t2 = { clientX: 300, clientY: 400 };
                const dist = computeTouchDistance(t1, t2);
                expect(dist).to.equal(500);
            });

            it('returns zero for identical touches', () => {
                const t = { clientX: 100, clientY: 200 };
                expect(computeTouchDistance(t, t)).to.equal(0);
            });

            it('handles horizontal distance', () => {
                const t1 = { clientX: 0, clientY: 100 };
                const t2 = { clientX: 200, clientY: 100 };
                expect(computeTouchDistance(t1, t2)).to.equal(200);
            });

            it('handles vertical distance', () => {
                const t1 = { clientX: 100, clientY: 0 };
                const t2 = { clientX: 100, clientY: 150 };
                expect(computeTouchDistance(t1, t2)).to.equal(150);
            });
        });

        describe('computePinchScale', () => {
            it('returns 1.0 when distances are equal (no zoom)', () => {
                expect(computePinchScale(100, 100)).to.equal(1.0);
            });

            it('returns factor > 1 when fingers spread (zoom in)', () => {
                const scale = computePinchScale(100, 200);
                expect(scale).to.equal(2.0);
            });

            it('returns factor < 1 when fingers close (zoom out)', () => {
                const scale = computePinchScale(200, 100);
                expect(scale).to.equal(0.5);
            });

            it('guards against zero initial distance', () => {
                const scale = computePinchScale(0, 100);
                expect(scale).to.be.a('number');
                expect(scale).to.not.be.NaN;
                expect(scale).to.equal(1.0);
            });

            it('guards against zero current distance', () => {
                const scale = computePinchScale(100, 0);
                expect(scale).to.be.a('number');
                expect(scale).to.not.be.NaN;
            });
        });

        // ============================================================
        // Phase 2: Zoom Sensitivity — applyZoomExponent
        // Exponent changed from 0.15 to 0.3 for responsive pinch-to-zoom.
        // ============================================================
        describe('applyZoomExponent', () => {
            it('2.4.1 — 2x spread produces ~1.23x zoom factor (exponent 0.3)', () => {
                const factor = applyZoomExponent(2.0);
                expect(factor).to.be.closeTo(1.23, 0.01);
            });

            it('2.4.2 — 0.5x squeeze produces ~0.81x zoom factor (exponent 0.3)', () => {
                const factor = applyZoomExponent(0.5);
                expect(factor).to.be.closeTo(0.81, 0.01);
            });

            it('2.4.3 — 1.0 ratio produces exactly 1.0 (no zoom)', () => {
                expect(applyZoomExponent(1.0)).to.equal(1.0);
            });

            it('factor > 1 for ratio > 1 (zoom in)', () => {
                expect(applyZoomExponent(1.5)).to.be.greaterThan(1.0);
            });

            it('factor < 1 for ratio < 1 (zoom out)', () => {
                expect(applyZoomExponent(0.75)).to.be.lessThan(1.0);
            });

            it('factor is always positive', () => {
                expect(applyZoomExponent(0.01)).to.be.greaterThan(0);
                expect(applyZoomExponent(10.0)).to.be.greaterThan(0);
            });

            it('2.4.4 — handles NaN ratio gracefully by returning 1.0', () => {
                const result = applyZoomExponent(NaN);
                expect(result).to.equal(1.0);
                expect(result).to.not.be.NaN;
            });

            it('2.4.5 — handles Infinity ratio gracefully by returning 1.0', () => {
                const result = applyZoomExponent(Infinity);
                expect(result).to.equal(1.0);
            });

            it('2.4.6 — handles undefined ratio gracefully by returning 1.0', () => {
                const result = applyZoomExponent(undefined);
                expect(result).to.equal(1.0);
                expect(result).to.not.be.NaN;
            });

            it('2.4.7 — handles null ratio gracefully by returning 1.0', () => {
                const result = applyZoomExponent(null);
                expect(result).to.equal(1.0);
            });
        });

        // ============================================================
        // Factory — createMultiTouchHandler
        // ============================================================
        describe('createMultiTouchHandler', () => {
            it('returns a handler object with attach and detach methods', () => {
                const handler = createMultiTouchHandler({
                    canvasId: 'testCanvas',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {} },
                    state: { selectedPanelId: 'panel-0' },
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                expect(handler).to.be.an('object');
                expect(handler.attach).to.be.a('function');
                expect(handler.detach).to.be.a('function');
            });

            // ============================================================
            // Phase 1: PointerEvents Migration — TouchEvent path removed
            // All touch input now goes through PointerEvent path.
            // ============================================================

            it('1.2.1 — PointerEvent listeners registered, TouchEvent listeners NOT registered after attach', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-migration1';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-migration1',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {} },
                    state: { selectedPanelId: 'panel-0' },
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });

                handler.attach();

                // PointerEvent listeners should be active
                let pointerPrevented = false;
                const p1 = new PointerEvent('pointerdown', {
                    pointerId: 1, clientX: 100, clientY: 100,
                    pointerType: 'mouse', bubbles: true, cancelable: true
                });
                p1.preventDefault = () => { pointerPrevented = true; };
                canvas.dispatchEvent(p1);

                const p2 = new PointerEvent('pointerdown', {
                    pointerId: 2, clientX: 200, clientY: 200,
                    pointerType: 'mouse', bubbles: true, cancelable: true
                });
                p2.preventDefault = () => { pointerPrevented = true; };
                canvas.dispatchEvent(p2);
                expect(pointerPrevented).to.be.true;

                // TouchEvent listeners should NOT be registered
                // Simulate a touchstart — it should NOT be intercepted
                const touchPrevented = false;
                const mockTouchEvent = new Event('touchstart', { bubbles: true, cancelable: true });
                mockTouchEvent.preventDefault = () => {
                    // If preventDefault is called, a TouchEvent listener exists
                    throw new Error('TouchEvent listener should not exist');
                };
                mockTouchEvent.touches = { length: 2, 0: { identifier: 1, clientX: 100, clientY: 100 }, 1: { identifier: 2, clientX: 200, clientY: 200 } };
                canvas.dispatchEvent(mockTouchEvent);
                // No error thrown = no TouchEvent listener

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('1.2.2 — Touch pointerType NOT early-returned in _onPointerDown', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-migration2';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-migration2',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {} },
                    state: { selectedPanelId: 'panel-0' },
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                let prevented = false;

                // First touch pointer — should NOT early return
                const tp1 = new PointerEvent('pointerdown', {
                    pointerId: 5, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                });
                canvas.dispatchEvent(tp1);

                // Second touch pointer — should start gesture and call preventDefault
                const tp2 = new PointerEvent('pointerdown', {
                    pointerId: 6, clientX: 200, clientY: 200,
                    pointerType: 'touch', bubbles: true, cancelable: true
                });
                tp2.preventDefault = () => { prevented = true; };
                canvas.dispatchEvent(tp2);

                expect(prevented).to.be.true;

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('1.2.3 — setPointerCapture called for touch pointer IDs', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-migration3';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                let capturedIds = [];
                canvas.setPointerCapture = (pid) => { capturedIds.push(pid); };

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-migration3',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {} },
                    state: { selectedPanelId: 'panel-0' },
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                // Two touch pointers down
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 10, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 11, clientX: 200, clientY: 200,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));

                // Both touch pointer IDs should be captured
                expect(capturedIds).to.include(10);
                expect(capturedIds).to.include(11);

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('1.2.4 — _multiTouchGestureActive set synchronously on gesture start with touch pointers', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-migration4';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                const state = { selectedPanelId: 'panel-0', _multiTouchGestureActive: false };

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-migration4',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {}, getPanelImage: () => ({ width: 1920, height: 1080 }) },
                    state: state,
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                // First touch pointer
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 20, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));
                expect(state._multiTouchGestureActive).to.be.false;

                // Second touch pointer — flag set synchronously
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 21, clientX: 200, clientY: 200,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));
                expect(state._multiTouchGestureActive).to.be.true;

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('1.2.5 — releasePointerCapture called for touch pointers on gesture end', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-migration5';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                let capturedIds = [];
                let releasedIds = [];
                canvas.setPointerCapture = (pid) => { capturedIds.push(pid); };
                canvas.releasePointerCapture = (pid) => { releasedIds.push(pid); };

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-migration5',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {} },
                    state: { selectedPanelId: 'panel-0' },
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                // Start gesture with two touch pointers
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 30, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 31, clientX: 200, clientY: 200,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));

                // Lift one touch pointer — gesture ends
                canvas.dispatchEvent(new PointerEvent('pointerup', {
                    pointerId: 30, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));

                // Both pointers should be released
                expect(releasedIds).to.include(30);
                expect(releasedIds).to.include(31);

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('1.2.6 — pointercancel clears all gesture state including _multiTouchGestureActive for touch', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-migration6';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                let releasedIds = [];
                canvas.setPointerCapture = () => {};
                canvas.releasePointerCapture = (pid) => { releasedIds.push(pid); };

                const state = { selectedPanelId: 'panel-0', _multiTouchGestureActive: false };

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-migration6',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {}, getPanelImage: () => ({ width: 1920, height: 1080 }) },
                    state: state,
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                // Start gesture with two touch pointers
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 40, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 41, clientX: 200, clientY: 200,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));
                expect(state._multiTouchGestureActive).to.be.true;

                // pointercancel fires (e.g., device rotation)
                canvas.dispatchEvent(new PointerEvent('pointercancel', {
                    pointerId: 40, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));

                expect(state._multiTouchGestureActive).to.be.false;
                // All captures released
                expect(releasedIds).to.include(40);
                expect(releasedIds).to.include(41);

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('1.2.7 — detach removes PointerEvent listeners; TouchEvent listeners NOT removed (never attached)', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-migration7';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-migration7',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {} },
                    state: { selectedPanelId: 'panel-0' },
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });

                handler.attach();
                handler.detach();

                // Pointer events should not be intercepted after detach
                let prevented = false;
                const p1 = new PointerEvent('pointerdown', {
                    pointerId: 1, clientX: 100, clientY: 100, pointerType: 'mouse',
                    bubbles: true, cancelable: true
                });
                p1.preventDefault = () => { prevented = true; };
                canvas.dispatchEvent(p1);

                const p2 = new PointerEvent('pointerdown', {
                    pointerId: 2, clientX: 200, clientY: 200, pointerType: 'mouse',
                    bubbles: true, cancelable: true
                });
                p2.preventDefault = () => { prevented = true; };
                canvas.dispatchEvent(p2);
                expect(prevented).to.be.false;

                document.body.removeChild(canvas);
            });

            it('1.2.8 — No selected panel: touch pointers do not start gesture, activePointers cleared', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-migration8';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                let prevented = false;

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-migration8',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {} },
                    state: { selectedPanelId: null }, // No panel selected
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                // First touch pointer
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 50, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));

                // Second touch pointer — should NOT start gesture
                const tp2 = new PointerEvent('pointerdown', {
                    pointerId: 51, clientX: 200, clientY: 200,
                    pointerType: 'touch', bubbles: true, cancelable: true
                });
                tp2.preventDefault = () => { prevented = true; };
                canvas.dispatchEvent(tp2);

                expect(prevented).to.be.false;

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('1.2.9 — Pointer capture released when startGesture fails (no selected panel)', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-migration9';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                let capturedIds = [];
                let releasedIds = [];
                canvas.setPointerCapture = (pid) => { capturedIds.push(pid); };
                canvas.releasePointerCapture = (pid) => { releasedIds.push(pid); };

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-migration9',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {} },
                    state: { selectedPanelId: null }, // No panel — startGesture will fail
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                // Two pointers down — captured but gesture fails
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 60, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 61, clientX: 200, clientY: 200,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));

                // Both pointers should be captured
                expect(capturedIds).to.include(60);
                expect(capturedIds).to.include(61);
                // Both should also be released (cleanup on failed startGesture)
                expect(releasedIds).to.include(60);
                expect(releasedIds).to.include(61);

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('1.2.10 — 3+ pointers call preventDefault (OS gesture guard)', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-migration10';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                let prevented = false;

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-migration10',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {} },
                    state: { selectedPanelId: 'panel-0' },
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                // Three pointers down — third should call preventDefault
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 70, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 71, clientX: 200, clientY: 200,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));

                const p3 = new PointerEvent('pointerdown', {
                    pointerId: 72, clientX: 150, clientY: 150,
                    pointerType: 'touch', bubbles: true, cancelable: true
                });
                p3.preventDefault = () => { prevented = true; };
                canvas.dispatchEvent(p3);

                // Third pointer should call preventDefault to block OS gestures
                expect(prevented).to.be.true;

                handler.detach();
                document.body.removeChild(canvas);
            });

            // ============================================================
            // Touch Pointer Gesture Behavior (migrated from TouchEvent tests)
            // All touch gestures now use PointerEvent path with pointerType: 'touch'
            // ============================================================

            it('touch two pointers start gesture and call preventDefault', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-touch1';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-touch1',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {} },
                    state: { selectedPanelId: 'panel-0' },
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                let prevented = false;

                // First touch pointer — should NOT start gesture yet
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 100, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));

                // Second touch pointer — should start gesture and call preventDefault
                const tp2 = new PointerEvent('pointerdown', {
                    pointerId: 101, clientX: 200, clientY: 200,
                    pointerType: 'touch', bubbles: true, cancelable: true
                });
                tp2.preventDefault = () => { prevented = true; };
                canvas.dispatchEvent(tp2);

                expect(prevented).to.be.true;

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('touch single pointer does not start gesture', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-touch2';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                let prevented = false;

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-touch2',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {} },
                    state: { selectedPanelId: 'panel-0' },
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                const tp1 = new PointerEvent('pointerdown', {
                    pointerId: 110, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                });
                tp1.preventDefault = () => { prevented = true; };
                canvas.dispatchEvent(tp1);

                // Single touch pointer should NOT be intercepted
                expect(prevented).to.be.false;

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('touch two pointers calls adjustCrop on move', async () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-touch3';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                canvas.style.position = 'absolute';
                canvas.style.left = '0px';
                canvas.style.top = '0px';
                document.body.appendChild(canvas);

                let adjustCalled = false;
                let adjustPanelId = null;
                let adjustDelta = null;

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-touch3',
                    cropManager: {
                        adjustCrop: (panelId, delta) => {
                            adjustCalled = true;
                            adjustPanelId = panelId;
                            adjustDelta = delta;
                        },
                        zoomCrop: () => {},
                        getPanelImage: () => ({ width: 1920, height: 1080 })
                    },
                    state: { selectedPanelId: 'panel-0' },
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                // Start two-finger touch gesture
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 120, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 121, clientX: 200, clientY: 200,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));

                // Move both pointers significantly
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    pointerId: 120, clientX: 160, clientY: 160,

                    pointerId: 1, clientX: 100, clientY: 100,
                    pointerType: 'mouse', bubbles: true, cancelable: true
                }));
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 2, clientX: 200, clientY: 200,
                    pointerType: 'mouse', bubbles: true, cancelable: true
                }));

                canvas.dispatchEvent(new PointerEvent('pointercancel', {
                    pointerId: 1, clientX: 100, clientY: 100,
                    pointerType: 'mouse', bubbles: true, cancelable: true
                }));

                expect(releasedPointerIds).to.include(1);
                expect(releasedPointerIds).to.include(2);

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('setPointerCapture failure does not throw (try/catch guard)', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-ptr-capture3';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                canvas.setPointerCapture = () => { throw new DOMException('Not supported'); };

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-ptr-capture3',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {} },
                    state: { selectedPanelId: 'panel-0' },
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                expect(() => {
                    canvas.dispatchEvent(new PointerEvent('pointerdown', {
                        pointerId: 1, clientX: 100, clientY: 100,
                        pointerType: 'mouse', bubbles: true, cancelable: true
                    }));
                }).to.not.throw();

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('releasePointerCapture failure does not throw (try/catch guard)', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-ptr-release3';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                canvas.setPointerCapture = () => {};
                canvas.releasePointerCapture = () => { throw new DOMException('Not supported'); };

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-ptr-release3',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {} },
                    state: { selectedPanelId: 'panel-0' },
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 1, clientX: 100, clientY: 100,
                    pointerType: 'mouse', bubbles: true, cancelable: true
                }));
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 2, clientX: 200, clientY: 200,
                    pointerType: 'mouse', bubbles: true, cancelable: true
                }));

                expect(() => {
                    canvas.dispatchEvent(new PointerEvent('pointerup', {
                        pointerId: 1, clientX: 100, clientY: 100,
                        pointerType: 'mouse', bubbles: true, cancelable: true
                    }));
                }).to.not.throw();

                handler.detach();
                document.body.removeChild(canvas);
            });
        });

        // ============================================================
        // MultiTouchHandler — dragSourceId coordination (Phase 1: Panel Swap During Multitouch)
        // startGesture() and _onPointerCancel() clear state.dragSourceId so PanelSwap
        // does not perform an unintended swap when a finger lifts during a two-finger gesture.
        // ============================================================
        describe('MultiTouchHandler — dragSourceId coordination', () => {
            it('1.3.1 — startGesture() clears state.dragSourceId', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-dragcoord1';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                const state = {
                    selectedPanelId: 'panel-0',
                    _multiTouchGestureActive: false,
                    dragSourceId: 'panel-0'  // Simulates PanelSwap setting it on first finger's pointerdown
                };

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-dragcoord1',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {}, getPanelImage: () => ({ width: 1920, height: 1080 }) },
                    state: state,
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                // First pointer down (no gesture yet)
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 1, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));
                expect(state.dragSourceId).to.equal('panel-0'); // Still set

                // Second pointer down — startGesture() should clear dragSourceId
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 2, clientX: 200, clientY: 200,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));

                expect(state.dragSourceId).to.be.null;
                expect(state._multiTouchGestureActive).to.be.true;

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('1.3.2 — startGesture() does not error when dragSourceId is already null', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-dragcoord2';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                const state = {
                    selectedPanelId: 'panel-0',
                    _multiTouchGestureActive: false,
                    dragSourceId: null  // Already null
                };

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-dragcoord2',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {}, getPanelImage: () => ({ width: 1920, height: 1080 }) },
                    state: state,
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                // Two pointers down — should not error
                expect(() => {
                    canvas.dispatchEvent(new PointerEvent('pointerdown', {
                        pointerId: 1, clientX: 100, clientY: 100,
                        pointerType: 'touch', bubbles: true, cancelable: true
                    }));
                    canvas.dispatchEvent(new PointerEvent('pointerdown', {
                        pointerId: 2, clientX: 200, clientY: 200,
                        pointerType: 'touch', bubbles: true, cancelable: true
                    }));
                }).to.not.throw();

                expect(state._multiTouchGestureActive).to.be.true;
                expect(state.dragSourceId).to.be.null;

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('1.3.3 — _onPointerCancel() clears state.dragSourceId', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-dragcoord3';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                const state = {
                    selectedPanelId: 'panel-0',
                    _multiTouchGestureActive: false,
                    dragSourceId: null
                };

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-dragcoord3',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {}, getPanelImage: () => ({ width: 1920, height: 1080 }) },
                    state: state,
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                // Start gesture
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 1, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 2, clientX: 200, clientY: 200,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));
                expect(state._multiTouchGestureActive).to.be.true;

                // Simulate PanelSwap somehow setting dragSourceId during gesture
                state.dragSourceId = 'panel-0';

                // pointercancel fires (e.g., device rotation)
                canvas.dispatchEvent(new PointerEvent('pointercancel', {
                    pointerId: 1, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));

                expect(state._multiTouchGestureActive).to.be.false;
                expect(state.dragSourceId).to.be.null;

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('1.3.4 — gesture end (endGesture) does not side-effect state.dragSourceId', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-dragcoord4';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                const state = {
                    selectedPanelId: 'panel-0',
                    _multiTouchGestureActive: false,
                    dragSourceId: null
                };

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-dragcoord4',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {}, getPanelImage: () => ({ width: 1920, height: 1080 }) },
                    state: state,
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                // Start gesture
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 1, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 2, clientX: 200, clientY: 200,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));

                // End gesture (one pointer up)
                canvas.dispatchEvent(new PointerEvent('pointerup', {
                    pointerId: 1, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));

                // dragSourceId should remain null (no side effect from endGesture)
                expect(state.dragSourceId).to.be.null;
                expect(state._multiTouchGestureActive).to.be.false;

                handler.detach();
                document.body.removeChild(canvas);
            });
        });

        // ============================================================
        // Phase 2 (Title Intercept Fix): onGestureStart callback
        // ============================================================
        describe('MultiTouchHandler — onGestureStart callback', () => {
            it('2.3.1 — onGestureStart callback called on gesture start', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-gesture-callback1';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                let gestureStartCalled = false;

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-gesture-callback1',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {}, getPanelImage: () => ({ width: 1920, height: 1080 }) },
                    state: { selectedPanelId: 'panel-0', _multiTouchGestureActive: false, dragSourceId: null },
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {},
                    onGestureStart: () => { gestureStartCalled = true; }
                });
                handler.attach();

                // First pointer down
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 1, clientX: 100, clientY: 100,
                    pointerType: 'mouse', bubbles: true, cancelable: true
                }));

                expect(gestureStartCalled).to.be.false;

                // Second pointer down — gesture starts
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 2, clientX: 200, clientY: 200,
                    pointerType: 'mouse', bubbles: true, cancelable: true
                }));

                expect(gestureStartCalled).to.be.true;

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('2.3.2 — missing onGestureStart does not cause error', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-gesture-callback2';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-gesture-callback2',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {}, getPanelImage: () => ({ width: 1920, height: 1080 }) },
                    state: { selectedPanelId: 'panel-0', _multiTouchGestureActive: false, dragSourceId: null },
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                    // No onGestureStart
                });
                handler.attach();

                // Two pointers down — should not throw
                expect(() => {
                    canvas.dispatchEvent(new PointerEvent('pointerdown', {
                        pointerId: 1, clientX: 100, clientY: 100,
                        pointerType: 'mouse', bubbles: true, cancelable: true
                    }));
                    canvas.dispatchEvent(new PointerEvent('pointerdown', {
                        pointerId: 2, clientX: 200, clientY: 200,
                        pointerType: 'mouse', bubbles: true, cancelable: true
                    }));
                }).to.not.throw();

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('2.3.3 — onGestureStart NOT called when startGesture fails (no selected panel)', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-gesture-callback3';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                let gestureStartCalled = false;

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-gesture-callback3',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {}, getPanelImage: () => ({ width: 1920, height: 1080 }) },
                    state: { selectedPanelId: null, _multiTouchGestureActive: false, dragSourceId: null }, // No panel selected
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {},
                    onGestureStart: () => { gestureStartCalled = true; }
                });
                handler.attach();

                // Two pointers down — startGesture fails because no panel selected
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 1, clientX: 100, clientY: 100,
                    pointerType: 'mouse', bubbles: true, cancelable: true
                }));
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 2, clientX: 200, clientY: 200,
                    pointerType: 'mouse', bubbles: true, cancelable: true
                }));

                // onGestureStart should NOT have been called
                expect(gestureStartCalled).to.be.false;

                handler.detach();
                document.body.removeChild(canvas);
            });

            it('onGestureStart called synchronously with gesture start (touch pointer)', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-gesture-callback4';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                let gestureStartCalled = false;
                const state = { selectedPanelId: 'panel-0', _multiTouchGestureActive: false, dragSourceId: null };

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-gesture-callback4',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {}, getPanelImage: () => ({ width: 1920, height: 1080 }) },
                    state: state,
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {},
                    onGestureStart: () => {
                        // Callback fires synchronously — flag should already be set
                        expect(state._multiTouchGestureActive).to.be.true;
                        gestureStartCalled = true;
                    }
                });
                handler.attach();

                // Two touch pointers
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 1, clientX: 100, clientY: 100,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 2, clientX: 200, clientY: 200,
                    pointerType: 'touch', bubbles: true, cancelable: true
                }));

                expect(gestureStartCalled).to.be.true;

                handler.detach();
                document.body.removeChild(canvas);
            });
        });

        mocha.run();
    </script>
