<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendering Tests</title>
    <link rel="stylesheet" href="https://unpkg.com/mocha@10.2.0/mocha.css">
    <style>
        body { margin: 20px; font-family: sans-serif; }
        #mocha { margin-top: 20px; }
        .test-plan-ref { color: #888; font-size: 0.85em; }
    </style>
</head>
<body>
    <h1>CollageMaker — Rendering Tests</h1>
    <p class="test-plan-ref">Covers: Phase 3 - Section 3.3 (Consolidate canvas clearing)</p>
    <div id="mocha"></div>

    <script src="https://unpkg.com/mocha@10.2.0/mocha.js"></script>
    <script src="https://unpkg.com/chai@4.3.10/chai.js"></script>
    <script>mocha.setup('bdd');</script>

    <script type="module">
        import { createCanvasRenderer } from '../MyESModules/Rendering/CanvasRenderer.js';
        import { createCollageAssembler } from '../MyESModules/Rendering/CollageAssembler.js';

        const { expect } = chai;

        // ============================================================
        // Section 3.3: Canvas Clearing Consolidation
        // ============================================================
        describe('Section 3.3 — Canvas Clearing', () => {
            it('3.3.1 — CanvasRenderer has a clear method', async () => {
                const renderer = createCanvasRenderer('dummy');
                expect(renderer.clear).to.be.a('function');
            });

            it('3.3.2 — CanvasRenderer.render method exists', async () => {
                const renderer = createCanvasRenderer('dummy');
                expect(renderer.render).to.be.a('function');
            });

            it('3.3.3 — CollageAssembler has render method', async () => {
                const assembler = createCollageAssembler();
                expect(assembler.render).to.be.a('function');
            });

            it('3.3.4 — CollageAssembler does not have a clear method (clearing is in renderer)', async () => {
                const assembler = createCollageAssembler();
                expect(assembler.clear).to.be.undefined;
            });

            it('3.3.5 — CanvasRenderer clear method signature accepts width and height', async () => {
                const renderer = createCanvasRenderer('dummy');
                // This will fail if canvas not initialized, but we're just checking the function exists
                expect(() => renderer.clear(800, 600)).to.not.throw();
            });

            it('3.3.6 — CanvasRenderer has dispose method', async () => {
                const renderer = createCanvasRenderer('dummy');
                expect(renderer.dispose).to.be.a('function');
            });

            it('3.3.7 — CollageAssembler has computeDefaultCrops method', async () => {
                const assembler = createCollageAssembler();
                expect(assembler.computeDefaultCrops).to.be.a('function');
            });

            it('3.3.8 — CollageAssembler._drawBackgroundOnly exists (renamed from _drawBackground)', async () => {
                const assembler = createCollageAssembler();
                // This is a private method, but we can check its existence for verification
                expect(assembler._drawBackgroundOnly).to.be.a('function');
            });

            it('3.3.9 — CollageAssembler does not have _drawBackground (should be renamed)', async () => {
                const assembler = createCollageAssembler();
                expect(assembler._drawBackground).to.be.undefined;
            });
        });

        // ============================================================
        // Phase 2: Memory & Lifecycle Cleanup — CanvasRenderer.dispose()
        // ============================================================
        describe('Phase 2 — CanvasRenderer.dispose() Memory Cleanup', () => {
            let testCanvas;

            beforeEach(() => {
                // Create a real canvas element for testing
                testCanvas = document.createElement('canvas');
                testCanvas.id = 'testDisposeCanvas';
                testCanvas.width = 100;
                testCanvas.height = 100;
                document.body.appendChild(testCanvas);
            });

            afterEach(() => {
                if (testCanvas && testCanvas.parentNode) {
                    testCanvas.parentNode.removeChild(testCanvas);
                }
            });

            it('P2.1 — dispose() clears canvas buffer to release GPU memory', () => {
                const renderer = createCanvasRenderer('testDisposeCanvas');
                renderer.init({ width: 100, height: 100 });

                // Draw something on the canvas
                const ctx = renderer.getContext();
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(0, 0, 100, 100);

                // Verify canvas has content before dispose
                const dataBefore = ctx.getImageData(50, 50, 1, 1).data;
                expect(dataBefore[0]).to.equal(255); // red
                expect(dataBefore[1]).to.equal(0);

                // Dispose
                renderer.dispose();

                // After dispose, canvas dimensions should be zeroed
                expect(testCanvas.width).to.equal(0);
                expect(testCanvas.height).to.equal(0);
            });

            it('P2.2 — dispose() followed by init() works correctly', () => {
                const renderer = createCanvasRenderer('testDisposeCanvas');
                renderer.init({ width: 100, height: 100 });

                // Draw something
                const ctx1 = renderer.getContext();
                ctx1.fillStyle = '#ff0000';
                ctx1.fillRect(0, 0, 100, 100);

                // Dispose
                renderer.dispose();

                // Re-init with same canvas ID
                const result = renderer.init({ width: 200, height: 150 });
                expect(result).to.be.true;

                // Verify new context works
                const ctx2 = renderer.getContext();
                expect(ctx2).to.not.be.null;
                ctx2.fillStyle = '#0000ff';
                ctx2.fillRect(0, 0, 200, 150);

                const dataAfter = ctx2.getImageData(100, 75, 1, 1).data;
                expect(dataAfter[2]).to.equal(255); // blue
            });

            it('P2.3 — dispose() on uninitialized renderer is safe (no exception)', () => {
                const renderer = createCanvasRenderer('nonExistentCanvas');
                // Should not throw
                expect(() => renderer.dispose()).to.not.throw();
            });

            it('P2.4 — dispose() on renderer that failed init is safe', () => {
                const renderer = createCanvasRenderer('nonExistentCanvas');
                renderer.init({ width: 100, height: 100 }); // Will fail — element not found
                // Should not throw
                expect(() => renderer.dispose()).to.not.throw();
            });

            it('P2.5 — dispose() cancels pending renders', () => {
                const renderer = createCanvasRenderer('testDisposeCanvas');
                renderer.init({ width: 100, height: 100 });

                let drawCalled = false;
                renderer.scheduleRender(() => { drawCalled = true; });

                // Cancel the pending render
                renderer.dispose();

                // Flush any pending rAF callbacks
                // In a real browser, the rAF callback would fire, but cancelPending()
                // should have cancelled it. We can verify by checking the renderer state.
                // Since we can't easily control rAF timing, verify cancelPending exists
                // and was called (it's the first thing dispose does).
                expect(renderer.cancelPending).to.be.a('function');
            });
        });

        // ============================================================
        // Phase 2 Pre-Merge Review: Render Order — Issue #2
        // Drag target must be drawn BEFORE selection border
        // so the selection border appears visually on top.
        // ============================================================
        describe('Phase 2 — Render Order: Drag Target vs Selection Border', () => {
            let testCanvas, ctx, callLog;

            beforeEach(() => {
                testCanvas = document.createElement('canvas');
                testCanvas.id = 'test-render-order-canvas';
                testCanvas.width = 400;
                testCanvas.height = 300;
                document.body.appendChild(testCanvas);

                ctx = testCanvas.getContext('2d');
                callLog = [];

                // Wrap stroke and strokeRect to capture canvas state at call time
                const origStroke = ctx.stroke.bind(ctx);
                const origStrokeRect = ctx.strokeRect.bind(ctx);
                ctx.stroke = function () {
                    callLog.push({
                        method: 'stroke',
                        lineDash: ctx.getLineDash().join(','),
                        strokeStyle: ctx.strokeStyle,
                        shadowColor: ctx.shadowColor,
                        globalAlpha: ctx.globalAlpha
                    });
                    return origStroke();
                };
                ctx.strokeRect = function () {
                    callLog.push({
                        method: 'strokeRect',
                        lineDash: ctx.getLineDash().join(','),
                        strokeStyle: ctx.strokeStyle,
                        shadowColor: ctx.shadowColor,
                        globalAlpha: ctx.globalAlpha
                    });
                    return origStrokeRect.apply(ctx, arguments);
                };
            });

            afterEach(() => {
                if (testCanvas && testCanvas.parentNode) {
                    testCanvas.parentNode.removeChild(testCanvas);
                }
            });

            it('2.2.1 — drag target drawn before selection border when both set', () => {
                const assembler = createCollageAssembler();

                // Simple rect panels for predictable rendering
                const panels = [
                    { id: 'panel-A', geometry: { type: 'rect', rect: { x: 10, y: 10, width: 100, height: 100 } } },
                    { id: 'panel-B', geometry: { type: 'rect', rect: { x: 120, y: 10, width: 100, height: 100 } } }
                ];

                assembler.render(ctx, {
                    panels: panels,
                    images: [],
                    crops: new Map(),
                    panelAssignments: new Map(),
                    backgroundColor: '#ffffff',
                    canvasSize: { width: 400, height: 300 },
                    selectedPanelId: 'panel-B',
                    hoveredPanelId: null,
                    dragTargetId: 'panel-A'
                });

                // Find the stroke/strokeRect calls for drag target (blue dashed)
                // and selection border (white with shadow)
                const dragTargetCalls = callLog.filter(c => c.strokeStyle === '#4285f4');
                const selectionCalls = callLog.filter(c => c.strokeStyle === '#ffffff');

                expect(dragTargetCalls.length).to.be.greaterThan(0, 'drag target border should be drawn');
                expect(selectionCalls.length).to.be.greaterThan(0, 'selection border should be drawn');

                // Drag target must appear BEFORE selection border in call log
                const firstDragTargetIndex = callLog.indexOf(dragTargetCalls[0]);
                const firstSelectionIndex = callLog.indexOf(selectionCalls[0]);
                expect(firstDragTargetIndex).to.be.lessThan(firstSelectionIndex,
                    'drag target (blue dashed) must be drawn before selection border (white)');
            });

            it('2.2.2 — only drag target drawn when no selection', () => {
                const assembler = createCollageAssembler();

                const panels = [
                    { id: 'panel-A', geometry: { type: 'rect', rect: { x: 10, y: 10, width: 100, height: 100 } } }
                ];

                assembler.render(ctx, {
                    panels: panels,
                    images: [],
                    crops: new Map(),
                    panelAssignments: new Map(),
                    backgroundColor: '#ffffff',
                    canvasSize: { width: 400, height: 300 },
                    selectedPanelId: null,
                    hoveredPanelId: null,
                    dragTargetId: 'panel-A'
                });

                const dragTargetCalls = callLog.filter(c => c.strokeStyle === '#4285f4');
                const selectionCalls = callLog.filter(c => c.strokeStyle === '#ffffff');

                expect(dragTargetCalls.length).to.be.greaterThan(0, 'drag target border should be drawn');
                expect(selectionCalls.length).to.equal(0, 'no selection border when selectedPanelId is null');
            });

            it('2.2.1b — drag target skipped when same as selected panel (avoid compositing artifacts)', () => {
                const assembler = createCollageAssembler();

                const panels = [
                    { id: 'panel-A', geometry: { type: 'rect', rect: { x: 10, y: 10, width: 100, height: 100 } } }
                ];

                assembler.render(ctx, {
                    panels: panels,
                    images: [],
                    crops: new Map(),
                    panelAssignments: new Map(),
                    backgroundColor: '#ffffff',
                    canvasSize: { width: 400, height: 300 },
                    selectedPanelId: 'panel-A',
                    hoveredPanelId: null,
                    dragTargetId: 'panel-A' // Same as selected — should skip drag target
                });

                const dragTargetCalls = callLog.filter(c => c.strokeStyle === '#4285f4');
                const selectionCalls = callLog.filter(c => c.strokeStyle === '#ffffff');

                expect(dragTargetCalls.length).to.equal(0,
                    'drag target should be skipped when it matches the selected panel');
                expect(selectionCalls.length).to.be.greaterThan(0,
                    'selection border should still be drawn');
            });

            it('2.2.3 — only selection border drawn when no drag target', () => {
                const assembler = createCollageAssembler();

                const panels = [
                    { id: 'panel-A', geometry: { type: 'rect', rect: { x: 10, y: 10, width: 100, height: 100 } } }
                ];

                assembler.render(ctx, {
                    panels: panels,
                    images: [],
                    crops: new Map(),
                    panelAssignments: new Map(),
                    backgroundColor: '#ffffff',
                    canvasSize: { width: 400, height: 300 },
                    selectedPanelId: 'panel-A',
                    hoveredPanelId: null,
                    dragTargetId: null
                });

                const dragTargetCalls = callLog.filter(c => c.strokeStyle === '#4285f4');
                const selectionCalls = callLog.filter(c => c.strokeStyle === '#ffffff');

                expect(dragTargetCalls.length).to.equal(0, 'no drag target when dragTargetId is null');
                expect(selectionCalls.length).to.be.greaterThan(0, 'selection border should be drawn');
            });
        });

        // Run mocha after all tests are defined
        window.addEventListener('load', () => {
            mocha.run();
        });
    </script>
</body>
</html>
