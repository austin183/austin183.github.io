<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitleInteraction Tests</title>
    <link rel="stylesheet" href="https://unpkg.com/mocha@10.2.0/mocha.css">
    <style>
        body { margin: 20px; font-family: sans-serif; }

<body>
    <h1>CollageMaker — TitleInteraction Unit Tests</h1>
    <p class="test-plan-ref">Covers: Phase 6 — Title Canvas Interaction (drag to move, edge-drag to resize)</p>
    <div id="mocha"></div>

    <script src="https://unpkg.com/mocha@10.2.0/mocha.js"></script>
    <script src="https://unpkg.com/chai@4.3.10/chai.js"></script>
    <script>mocha.setup('bdd');</script>

    <script type="module">
        import { createTitleInteraction } from '../MyESModules/Interaction/TitleInteraction.js';
        import { computeMultiLineBounds } from '../MyESModules/Rendering/TitleRenderer.js';

        const { expect } = chai;

        // ============================================================
        // Helpers
        // ============================================================

        function makeTitleRun({ text = 'Hello World', bold = false, italic = false, underline = false } = {}) {
            return { text, bold, italic, underline };
        }

        function makeTitleStyle({
            fontSize = 36,
            fontFamily = 'Arial',
            alignment = 'center',
            titleBoxWidth = 400,
            titleBoxX = 500,
            titleBoxY = 900
        } = {}) {
            return { fontSize, fontFamily, alignment, titleBoxWidth, titleBoxX, titleBoxY };
        }

        function createTestState(titleStyle, titleRuns) {
            return {
                titleStyle: titleStyle || makeTitleStyle(),
                titleRuns: titleRuns || [makeTitleRun()],
                panels: [],
                panelAssignments: new Map(),
                _multiTouchGestureActive: false,
                titleInteractionMode: null,
                titleHoverTarget: null
            };
        }

        // Create a canvas element for DOM-based tests
        function createTestCanvas() {
            const canvas = document.createElement('canvas');
            canvas.id = 'title-interaction-test-canvas';
            canvas.width = 1920;
            canvas.height = 1080;
            canvas.style.cssText = 'width: 960px; height: 540px; position: fixed; top: 0px; left: 0px; z-index: -1;';
            document.body.appendChild(canvas);
            return canvas;
        }

        // ============================================================
        // Section 6.3: Hit Testing
        // ============================================================
        describe('TitleInteraction — Hit Testing', () => {
            let canvas;

            beforeEach(() => {
                canvas = createTestCanvas();
            });

            afterEach(() => {
                if (canvas && canvas.parentNode) {
                    canvas.parentNode.removeChild(canvas);
                }
            });

            it('6.3.1 — Hit test on title body returns body target', () => {
                const state = createTestState(
                    makeTitleStyle({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun({ text: 'Hello World' })]
                );

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Canvas CSS: 960x540, logical: 1920x1080
                // Title box: logical (500, 900) with width 400, height ~60 (fontSize 36 + padding 24)
                // Logical box Y top: 900 - 36 - 12 = 852, bottom: 900 + 12 = 912
                // CSS coords: x = 500/2 = 250, y_top = 852/2 = 426
                // Center of box in CSS: x=250+100=350, y=426+30=456
                const result = handler._hitTestTitle(350, 456, 960, 540);

                expect(result.hit).to.be.true;
                expect(result.target).to.equal('body');

                handler.detach();
            });

            it('6.3.2 — Hit test on left edge returns left-edge target', () => {
                const state = createTestState(
                    makeTitleStyle({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun({ text: 'Hello World' })]
                );

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Left edge of title box in CSS coords
                // Logical left: 500, CSS left: 250
                // Within EDGE_THRESHOLD (8 CSS px) of left edge
                const result = handler._hitTestTitle(253, 456, 960, 540);

                expect(result.hit).to.be.true;
                expect(result.target).to.equal('left-edge');

                handler.detach();
            });

            it('6.3.3 — Hit test on right edge returns right-edge target', () => {
                const state = createTestState(
                    makeTitleStyle({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun({ text: 'Hello World' })]
                );

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Right edge of title box in CSS coords
                // Logical right: 500 + 400 = 900, CSS right: 450
                // Within EDGE_THRESHOLD (8 CSS px) of right edge
                const result = handler._hitTestTitle(447, 456, 960, 540);

                expect(result.hit).to.be.true;
                expect(result.target).to.equal('right-edge');

                handler.detach();
            });

            it('6.3.4 — Hit test outside title box returns no hit', () => {
                const state = createTestState(
                    makeTitleStyle({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun({ text: 'Hello World' })]
                );

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Point far from title box
                const result = handler._hitTestTitle(100, 100, 960, 540);

                expect(result.hit).to.be.false;

                handler.detach();
            });

            it('6.3.5 — Hit test with no title text returns no hit', () => {
                const state = createTestState(
                    makeTitleStyle(),
                    []
                );

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => [],
                    getState: () => ({ runs: [], style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                const result = handler._hitTestTitle(350, 456, 960, 540);

                expect(result.hit).to.be.false;

                handler.detach();
            });
        });

        // ============================================================
        // Phase 2: SIZE_CONSTANTS usage
        // ============================================================
        describe('Phase 2 — SIZE_CONSTANTS usage', () => {
            let canvas;

            beforeEach(() => {
                canvas = createTestCanvas();
            });

            afterEach(() => {
                if (canvas && canvas.parentNode) {
                    canvas.parentNode.removeChild(canvas);
                }
            });

            it('2.T.5 — Hit test uses SIZE_CONSTANTS defaultCanvasWidth (1920) not hardcoded', () => {
                const state = createTestState(
                    makeTitleStyle({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun({ text: 'Hello World' })]
                );

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Hit test at the far right edge of canvas (CSS: 960 = logical 1920)
                // If SIZE_CONSTANTS.defaultCanvasWidth (1920) is used, the scale factor is correct
                // and the hit test should work at the edge
                const result = handler._hitTestTitle(959, 456, 960, 540);
                // At the far right edge, it should not hit the title box at x=500,w=400
                // (logical right edge of box = 900, CSS = 450)
                expect(result.hit).to.be.false;

                handler.detach();
            });

            it('2.T.5b — Hit test scale factors use SIZE_CONSTANTS aspect ratio', () => {
                const state = createTestState(
                    makeTitleStyle({ titleBoxX: 960, titleBoxY: 900, titleBoxWidth: 200 }),
                    [makeTitleRun({ text: 'Hello World' })]
                );

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Title box: logical (960, 900), width 200
                // With SIZE_CONSTANTS: scaleX = 960/1920 = 0.5, scaleY = 540/1080 = 0.5
                // CSS box: left = 960*0.5 = 480, right = 1160*0.5 = 580
                // Center CSS: x = 530, y = 441
                const result = handler._hitTestTitle(530, 441, 960, 540);
                expect(result.hit).to.be.true;

                handler.detach();
            });
        });

        // ============================================================
        // Phase 2: Drag VISIBLE_MIN clamping
        // ============================================================
        describe('Phase 2 — Drag VISIBLE_MIN clamping', () => {
            let canvas;

            beforeEach(() => {
                canvas = createTestCanvas();
            });

            afterEach(() => {
                if (canvas && canvas.parentNode) {
                    canvas.parentNode.removeChild(canvas);
                }
            });

            it('2.T.1 — Drag left: clamped to -boxWidth + VISIBLE_MIN (not 0)', () => {
                const state = createTestState(
                    makeTitleStyle({ titleBoxX: 100, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun({ text: 'Hello World' })]
                );

                let positionCalls = [];
                const titleManager = {
                    setPosition: (x, y) => { positionCalls.push({ x, y }); state.titleStyle.titleBoxX = x; state.titleStyle.titleBoxY = y; },
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Pointer down on title body (CSS: x=150, y=441)
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 150, clientY: 441, button: 0, bubbles: true
                }));

                // Drag far left — should clamp to -boxWidth + VISIBLE_MIN = -400 + 50 = -350
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    clientX: -500, clientY: 441, bubbles: true
                }));

                const lastPos = positionCalls[positionCalls.length - 1];
                // With VISIBLE_MIN=50, left clamp is -350 (not 0)
                expect(lastPos.x).to.equal(-350);
                expect(lastPos.x).to.be.at.least(-350);

                handler.detach();
            });

            it('2.T.2 — Drag right: clamped to canvasWidth - VISIBLE_MIN (not canvasWidth - boxWidth)', () => {
                const state = createTestState(
                    makeTitleStyle({ titleBoxX: 1300, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun({ text: 'Hello World' })]
                );

                let positionCalls = [];
                const titleManager = {
                    setPosition: (x, y) => { positionCalls.push({ x, y }); state.titleStyle.titleBoxX = x; state.titleStyle.titleBoxY = y; },
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // CSS box: left=650, top=426, right=850, bottom=456
                // Center of box in CSS: x=750, y=441
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 750, clientY: 441, button: 0, bubbles: true
                }));

                // Drag far right — should clamp to 1920 - 50 = 1870 (not 1920 - 400 = 1520)
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    clientX: 2000, clientY: 441, bubbles: true
                }));

                const lastPos = positionCalls[positionCalls.length - 1];
                // With VISIBLE_MIN=50, right clamp is 1870 (not 1520)
                expect(lastPos.x).to.equal(1870);
                expect(lastPos.x).to.be.at.most(1870);

                handler.detach();
            });

            it('2.T.3 — Drag within bounds: no clamping applied', () => {
                const state = createTestState(
                    makeTitleStyle({ titleBoxX: 960, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun({ text: 'Hello World' })]
                );

                let positionCalls = [];
                const titleManager = {
                    setPosition: (x, y) => { positionCalls.push({ x, y }); state.titleStyle.titleBoxX = x; state.titleStyle.titleBoxY = y; },
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // CSS box: left=480, top=426, right=680, bottom=456
                // Center: x=580, y=441
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 580, clientY: 441, button: 0, bubbles: true
                }));

                // Drag 100px left (CSS: 580 -> 480, logical: 960 -> 760)
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    clientX: 480, clientY: 441, bubbles: true
                }));

                const lastPos = positionCalls[positionCalls.length - 1];
                // Within bounds, no clamping — should be 960 - 200 = 760
                expect(lastPos.x).to.equal(760);

                handler.detach();
            });

            it('2.T.4 — Y-axis clamping preserved: top clamp at fontSize + 12', () => {
                const state = createTestState(
                    makeTitleStyle({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400, fontSize: 36 }),
                    [makeTitleRun({ text: 'Hello World' })]
                );

                let positionCalls = [];
                const titleManager = {
                    setPosition: (x, y) => { positionCalls.push({ x, y }); state.titleStyle.titleBoxX = x; state.titleStyle.titleBoxY = y; },
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 350, clientY: 441, button: 0, bubbles: true
                }));

                // Drag far up — should clamp to boxHeight = fontSize + PADDING*2 = 36 + 24 = 60
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    clientX: 350, clientY: 0, bubbles: true
                }));

                const lastPos = positionCalls[positionCalls.length - 1];
                expect(lastPos.y).to.equal(60);

                handler.detach();
            });

            it('2.T.4b — Y-axis clamping preserved: bottom clamp at canvasHeight - 12', () => {
                const state = createTestState(
                    makeTitleStyle({ titleBoxX: 500, titleBoxY: 100, titleBoxWidth: 400, fontSize: 36 }),
                    [makeTitleRun({ text: 'Hello World' })]
                );

                let positionCalls = [];
                const titleManager = {
                    setPosition: (x, y) => { positionCalls.push({ x, y }); state.titleStyle.titleBoxX = x; state.titleStyle.titleBoxY = y; },
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // CSS box for y=100: boxTop = (100 - 36 - 12)/2 = 26
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 350, clientY: 31, button: 0, bubbles: true
                }));

                // Drag far down — should clamp to 1080 - 12 = 1068
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    clientX: 350, clientY: 600, bubbles: true
                }));

                const lastPos = positionCalls[positionCalls.length - 1];
                expect(lastPos.y).to.equal(1068);

                handler.detach();
            });
        });

        // ============================================================
        // Section 6.3: Drag Behavior
        // ============================================================
        describe('TitleInteraction — Drag Behavior', () => {
            let canvas;

            beforeEach(() => {
                canvas = createTestCanvas();
            });

            afterEach(() => {
                if (canvas && canvas.parentNode) {
                    canvas.parentNode.removeChild(canvas);
                }
            });

            it('6.3.6 — Drag clamps X to left boundary with VISIBLE_MIN', () => {
                const state = createTestState(
                    makeTitleStyle({ titleBoxX: 100, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun({ text: 'Hello World' })]
                );

                let positionCalls = [];
                const titleManager = {
                    setPosition: (x, y) => { positionCalls.push({ x, y }); state.titleStyle.titleBoxX = x; state.titleStyle.titleBoxY = y; },
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Title box: logical (100, 900), width 400, height ~60
                // CSS box: left=50, top=426, right=250, bottom=456
                // Center of box in CSS: x=150, y=441
                // Pointer down on title body
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 150, clientY: 441, button: 0, bubbles: true
                }));

                // Drag far left (should clamp to -boxWidth + VISIBLE_MIN = -350)
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    clientX: -500, clientY: 441, bubbles: true
                }));

                // Verify X was clamped to >= -350 (at least 50px visible)
                const lastPos = positionCalls[positionCalls.length - 1];
                expect(lastPos.x).to.be.at.least(-350);

                handler.detach();
            });

            it('6.3.7 — Drag clamps X to right boundary with VISIBLE_MIN', () => {
                const state = createTestState(
                    makeTitleStyle({ titleBoxX: 1300, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun({ text: 'Hello World' })]
                );

                let positionCalls = [];
                const titleManager = {
                    setPosition: (x, y) => { positionCalls.push({ x, y }); state.titleStyle.titleBoxX = x; state.titleStyle.titleBoxY = y; },
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Title box: logical (1300, 900), width 400, height ~60
                // CSS box: left=650, top=426, right=850, bottom=456
                // Center of box in CSS: x=750, y=441
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 750, clientY: 441, button: 0, bubbles: true
                }));

                // Drag far right (should clamp to canvasWidth - VISIBLE_MIN = 1870)
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    clientX: 2000, clientY: 441, bubbles: true
                }));

                const lastPos = positionCalls[positionCalls.length - 1];
                // With VISIBLE_MIN=50, right clamp is 1920 - 50 = 1870
                expect(lastPos.x).to.be.at.most(1870);

                handler.detach();
            });

            it('6.3.8 — Resize clamps width to minimum (textWidth)', () => {
                const state = createTestState(
                    makeTitleStyle({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun({ text: 'Hello World' })]
                );

                let widthCalls = [];
                const titleManager = {
                    setPosition: () => {},
                    setWidth: (w) => { widthCalls.push(w); state.titleStyle.titleBoxWidth = w; },
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Pointer down on right edge
                // Logical right: 500 + 400 = 900, CSS right: 450
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 447, clientY: 456, button: 0, bubbles: true
                }));

                // Drag far left to shrink width to near zero
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    clientX: 100, clientY: 456, bubbles: true
                }));

                // Width should be clamped to at least textWidth (or minimum 100)
                if (widthCalls.length > 0) {
                    const minWidth = Math.min(...widthCalls);
                    expect(minWidth).to.be.at.least(100);
                }

                handler.detach();
            });

            it('Drag interaction updates titleInteractionMode state', () => {
                const state = createTestState(
                    makeTitleStyle({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun({ text: 'Hello World' })]
                );

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Pointer down on title body
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 350, clientY: 456, button: 0, bubbles: true
                }));

                // Move to trigger drag threshold
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    clientX: 400, clientY: 456, bubbles: true
                }));

                expect(state.titleInteractionMode).to.equal('drag');

                handler.detach();
            });

            it('Resize-right interaction updates titleInteractionMode to resize-right', () => {
                const state = createTestState(
                    makeTitleStyle({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun({ text: 'Hello World' })]
                );

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Pointer down on right edge

                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 350, clientY: 456, button: 0, bubbles: true,
                    pointerType: 'mouse', pointerId: 2
                }));

                expect(state.titleInteractionPointerType).to.equal('mouse');

                handler.detach();
            });

            it('4.3.3 — pointerup clears titleInteractionPointerType', () => {
                const state = createTestState2(
                    makeTitleStyle2({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun2({ text: 'Hello World' })]
                );

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-ptr-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Touch pointer down
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 350, clientY: 456, button: 0, bubbles: true,
                    pointerType: 'touch', pointerId: 1
                }));

                expect(state.titleInteractionPointerType).to.equal('touch');

                // Pointer up
                canvas.dispatchEvent(new PointerEvent('pointerup', {
                    clientX: 350, clientY: 456, bubbles: true,
                    pointerType: 'touch', pointerId: 1
                }));

                expect(state.titleInteractionPointerType).to.be.null;

                handler.detach();
            });

            it('4.3.4 — Touch hover (pointermove) sets titleInteractionPointerType to touch', () => {
                const state = createTestState2(
                    makeTitleStyle2({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun2({ text: 'Hello World' })]
                );

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-ptr-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Touch hover over title body (no pointer down)
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    clientX: 350, clientY: 456, bubbles: true,
                    pointerType: 'touch', pointerId: 1
                }));

                expect(state.titleInteractionPointerType).to.equal('touch');
                expect(state.titleHoverTarget).to.equal('body');

                handler.detach();
            });

            it('4.3.5 — Hover outside title clears titleInteractionPointerType', () => {
                const state = createTestState2(
                    makeTitleStyle2({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun2({ text: 'Hello World' })]
                );

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-ptr-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Hover over title first
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    clientX: 350, clientY: 456, bubbles: true,
                    pointerType: 'touch', pointerId: 1
                }));

                expect(state.titleInteractionPointerType).to.equal('touch');

                // Move away from title
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    clientX: 100, clientY: 100, bubbles: true,
                    pointerType: 'touch', pointerId: 1
                }));

                expect(state.titleInteractionPointerType).to.be.null;

                handler.detach();
            });

            it('4.3.8 — Touch edge threshold meets WCAG 2.5.8 (44px minimum target)', () => {
                // WCAG 2.5.8 requires touch targets to be at least 44 CSS pixels.
                // The edge threshold should be >= 22px (half of 44px) so the hit zone
                // extends at least 22px from the handle center on each side.
                const state = createTestState2(
                    makeTitleStyle2({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun2({ text: 'Hello World' })]
                );

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-ptr-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Title box: logical (500, 900), width 400, height ~60
                // CSS: left = 250, right = 450, center Y = 441
                // Test: touch pointer 21px from right edge should still hit
                // (WCAG requires 44px target = 22px threshold from center)
                const resultAt22 = handler._hitTestTitle(450 - 22, 441, 960, 540, 'touch');
                expect(resultAt22.hit).to.be.true;
                expect(resultAt22.target).to.equal('right-edge');

                // Test: touch pointer 21px from left edge should still hit
                const resultLeft22 = handler._hitTestTitle(250 + 22, 441, 960, 540, 'touch');
                expect(resultLeft22.hit).to.be.true;
                expect(resultLeft22.target).to.equal('left-edge');

                handler.detach();
            });

            it('4.3.9 — pointerleave clears hover state and pointer type', () => {
                // When pointer leaves canvas, hover state should be cleared
                // so touch handles don't persist after pointer exits
                const state = createTestState2(
                    makeTitleStyle2({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun2({ text: 'Hello World' })]
                );

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                let renderScheduled = false;
                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-ptr-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => { renderScheduled = true; },
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Hover over title first to establish state
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    clientX: 350, clientY: 456, bubbles: true,
                    pointerType: 'touch', pointerId: 1
                }));

                expect(state.titleHoverTarget).to.equal('body');
                expect(state.titleInteractionPointerType).to.equal('touch');

                // Pointer leaves canvas
                renderScheduled = false;
                canvas.dispatchEvent(new PointerEvent('pointerleave', {
                    bubbles: true, pointerType: 'touch', pointerId: 1
                }));

                // Hover state should be cleared
                expect(state.titleHoverTarget).to.be.null;
                expect(state.titleInteractionPointerType).to.be.null;
                // Should have scheduled a render to remove touch handles
                expect(renderScheduled).to.be.true;

                handler.detach();
            });

            it('4.3.6 — pointercancel clears titleInteractionPointerType', () => {
                const state = createTestState2(
                    makeTitleStyle2({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun2({ text: 'Hello World' })]
                );

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-interaction-ptr-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Touch pointer down
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 350, clientY: 456, button: 0, bubbles: true,
                    pointerType: 'touch', pointerId: 1
                }));

                expect(state.titleInteractionPointerType).to.equal('touch');

                // pointercancel (e.g., device rotation)
                canvas.dispatchEvent(new PointerEvent('pointercancel', {
                    clientX: 350, clientY: 456, bubbles: true,
                    pointerType: 'touch', pointerId: 1
                }));

                expect(state.titleInteractionPointerType).to.be.null;
                expect(state.titleInteractionMode).to.be.null;

                handler.detach();
            });
        });

        // ============================================================
        // Phase 2 (Title Intercept Fix): cancelPendingInteraction
        // ============================================================
        describe('Phase 2 — cancelPendingInteraction', () => {
            let canvas;

            function makeTitleRun3({ text = 'Hello World' } = {}) {
                return { text, bold: false, italic: false, underline: false };
            }

            function makeTitleStyle3({
                fontSize = 36,
                fontFamily = 'Arial',
                alignment = 'center',
                titleBoxWidth = 400,
                titleBoxX = 500,
                titleBoxY = 900
            } = {}) {
                return { fontSize, fontFamily, alignment, titleBoxWidth, titleBoxX, titleBoxY };
            }

            function createTestState3(titleStyle, titleRuns) {
                return {
                    titleStyle: titleStyle || makeTitleStyle3(),
                    titleRuns: titleRuns || [makeTitleRun3()],
                    panels: [],
                    panelAssignments: new Map(),
                    _multiTouchGestureActive: false,
                    titleInteractionMode: null,
                    titleHoverTarget: null,
                    titleInteractionPointerType: null
                };
            }

            beforeEach(() => {
                canvas = document.createElement('canvas');
                canvas.id = 'title-cancel-test-canvas';
                canvas.width = 1920;
                canvas.height = 1080;
                canvas.style.cssText = 'width: 960px; height: 540px; position: fixed; top: 0px; left: 0px; z-index: -1;';
                document.body.appendChild(canvas);
            });

            afterEach(() => {
                if (canvas && canvas.parentNode) {
                    canvas.parentNode.removeChild(canvas);
                }
            });

            it('2.2.1 — cancelPendingInteraction clears pending state', () => {
                const state = createTestState3(
                    makeTitleStyle3({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun3({ text: 'Hello World' })]
                );

                let renderCount = 0;
                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-cancel-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => { renderCount++; },
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Step 1: pointerdown on title body — sets pending state
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 350, clientY: 456, button: 0, bubbles: true,
                    pointerType: 'touch', pointerId: 1
                }));

                // Pending state should be set
                expect(state.titleInteractionMode).to.equal('drag');
                expect(state.titleHoverTarget).to.equal('body');
                expect(state.titleInteractionPointerType).to.equal('touch');

                // Step 2: cancel pending interaction
                handler.cancelPendingInteraction();

                // All pending state should be cleared
                expect(state.titleInteractionMode).to.be.null;
                expect(state.titleHoverTarget).to.be.null;
                expect(state.titleInteractionPointerType).to.be.null;
                // Render should have been scheduled to clear visual feedback
                expect(renderCount).to.be.at.least(1);

                handler.detach();
            });

            it('2.2.2 — cancelPendingInteraction is no-op when no pending state', () => {
                const state = createTestState3(
                    makeTitleStyle3({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun3({ text: 'Hello World' })]
                );

                let renderCount = 0;
                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-cancel-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => { renderCount++; },
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // No pointerdown happened — no pending state
                handler.cancelPendingInteraction();

                // Should not throw and should not schedule a render
                expect(renderCount).to.equal(0);
                // State should remain unchanged
                expect(state.titleInteractionMode).to.be.null;

                handler.detach();
            });

            it('2.2.3 — cancelPendingInteraction does NOT clear active interaction', () => {
                const state = createTestState3(
                    makeTitleStyle3({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun3({ text: 'Hello World' })]
                );

                let interactionEndCalled = false;
                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-cancel-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => { interactionEndCalled = true; }
                });

                handler.attach();

                // Step 1: pointerdown on title body
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 350, clientY: 456, button: 0, bubbles: true
                }));

                // Step 2: move to cross drag threshold — starts active interaction
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    clientX: 400, clientY: 456, bubbles: true
                }));

                expect(state.titleInteractionMode).to.equal('drag');

                // Step 3: cancelPendingInteraction — should be no-op for active interaction
                handler.cancelPendingInteraction();

                // Active interaction should NOT be cleared
                expect(state.titleInteractionMode).to.equal('drag');
                // onInteractionEnd should NOT have been called
                expect(interactionEndCalled).to.be.false;

                handler.detach();
            });

            it('2.2.4 — cancelPendingInteraction releases pointer capture', () => {
                const state = createTestState3(
                    makeTitleStyle3({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun3({ text: 'Hello World' })]
                );

                let capturedIds = [];
                let releasedIds = [];
                canvas.setPointerCapture = (pid) => { capturedIds.push(pid); };
                canvas.releasePointerCapture = (pid) => { releasedIds.push(pid); };

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-cancel-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Step 1: pointerdown with pointerId — captures pointer
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 350, clientY: 456, button: 0, bubbles: true,
                    pointerType: 'touch', pointerId: 99
                }));

                // Step 2: cancel pending interaction
                handler.cancelPendingInteraction();

                // Pointer capture should be released
                expect(releasedIds).to.include(99);

                handler.detach();
            });

            it('2.2.5 — cancelPendingInteraction resets cursor', () => {
                const state = createTestState3(
                    makeTitleStyle3({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun3({ text: 'Hello World' })]
                );

                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-cancel-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => {},
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Step 1: pointerdown on title body — cursor set to 'grab'
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 350, clientY: 456, button: 0, bubbles: true
                }));

                expect(canvas.style.cursor).to.equal('grab');

                // Step 2: cancel pending interaction
                handler.cancelPendingInteraction();

                // Cursor should be reset
                expect(canvas.style.cursor).to.equal('');

                handler.detach();
            });

            it('2.2.6 — cancelPendingInteraction schedules render', () => {
                const state = createTestState3(
                    makeTitleStyle3({ titleBoxX: 500, titleBoxY: 900, titleBoxWidth: 400 }),
                    [makeTitleRun3({ text: 'Hello World' })]
                );

                let renderCount = 0;
                const titleManager = {
                    setPosition: () => {},
                    setWidth: () => {},
                    getRuns: () => state.titleRuns,
                    getState: () => ({ runs: state.titleRuns, style: state.titleStyle })
                };

                const handler = createTitleInteraction({
                    canvasId: 'title-cancel-test-canvas',
                    state,
                    titleManager,
                    onRenderScheduled: () => { renderCount++; },
                    onInteractionStart: () => {},
                    onInteractionEnd: () => {}
                });

                handler.attach();

                // Step 1: pointerdown on title body
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: 350, clientY: 456, button: 0, bubbles: true
                }));

                const rendersAfterDown = renderCount;

                // Step 2: cancel pending interaction
                handler.cancelPendingInteraction();

                // Should have scheduled at least one more render
                expect(renderCount).to.be.greaterThan(rendersAfterDown);

                handler.detach();
            });
        });
    </script>
