<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitleManager Tests</title>
    <link rel="stylesheet" href="https://unpkg.com/mocha@10.2.0/mocha.css">
    <style>
        body { margin: 20px; font-family: sans-serif; }
        #mocha { margin-top: 20px; }
        .test-plan-ref { color: #888; font-size: 0.85em; }
    </style>
</head>
<body>
    <h1>CollageMaker — TitleManager Unit Tests</h1>
    <p class="test-plan-ref">Covers: Section 3 (TitleManager) — all P0 tests</p>
    <div id="mocha"></div>

    <script src="https://unpkg.com/mocha@10.2.0/mocha.js"></script>
    <script src="https://unpkg.com/chai@4.3.10/chai.js"></script>
    <script>mocha.setup('bdd');</script>

    <script type="module">
        import { createTitleManager } from '../MyESModules/State/TitleManager.js';
        import { createTitleRun, cloneTitleRun, runsHaveSameFormatting } from '../MyESModules/Models/TitleRun.js';
        import { createTitleStyle } from '../MyESModules/Models/TitleStyle.js';

        const { expect } = chai;

        function makeState(titleText = '', titleRuns = [], titleStyle = null) {
            return { titleText, titleRuns, titleStyle };
        }

        // ============================================================
        // Section 3.1: Character Mutations
        // ============================================================
        describe('Section 3.1 — Character Mutations', () => {
            let tm, state;

            beforeEach(() => {
                state = makeState();
                tm = createTitleManager(state);
            });

            it('3.1.1 — insertChar at start', () => {
                tm.setText('Hello');
                tm.insertChar(0, '!');
                const runs = tm.getRuns();
                expect(tm.getFullText()).to.equal('!Hello');
                // '!' is plain, 'Hello' is plain — they should merge
                expect(runs.length).to.equal(1);
                expect(runs[0].text).to.equal('!Hello');
            });

            it('3.1.2 — insertChar at end', () => {
                tm.setText('Hello');
                tm.insertChar(5, '!');
                const runs = tm.getRuns();
                expect(tm.getFullText()).to.equal('Hello!');
                expect(runs.length).to.equal(1);
                expect(runs[0].text).to.equal('Hello!');
            });

            it('3.1.3 — insertChar in middle', () => {
                tm.setText('Hello');
                tm.insertChar(2, '!');
                expect(tm.getFullText()).to.equal('He!llo');
                // All plain, should merge to one run
                const runs = tm.getRuns();
                expect(runs.length).to.equal(1);
                expect(runs[0].text).to.equal('He!llo');
            });

            it('3.1.4 — deleteChar at start', () => {
                tm.setText('Hello');
                tm.deleteChar(0);
                expect(tm.getFullText()).to.equal('ello');
            });

            it('3.1.5 — deleteChar at end', () => {
                tm.setText('Hello');
                tm.deleteChar(4);
                expect(tm.getFullText()).to.equal('Hell');
            });

            it('3.1.6 — deleteChar in middle', () => {
                tm.setText('Hello');
                tm.deleteChar(2);
                expect(tm.getFullText()).to.equal('Helo');
            });

            it('3.1.7 — deleteChar only char results in empty', () => {
                tm.setText('A');
                tm.deleteChar(0);
                expect(tm.getFullText()).to.equal('');
                expect(tm.getRuns().length).to.equal(0);
            });

            it('3.1.8 — deleteChar out of bounds is no-op', () => {
                tm.setText('Hello');
                tm.deleteChar(10);
                expect(tm.getFullText()).to.equal('Hello');
                tm.deleteChar(-1);
                expect(tm.getFullText()).to.equal('Hello');
            });
        });

        // ============================================================
        // Section 3.2: Formatting Toggles (Ranges)
        // ============================================================
        describe('Section 3.2 — Formatting Toggles (Ranges)', () => {
            let tm, state;

            beforeEach(() => {
                state = makeState();
                tm = createTitleManager(state);
            });

            it('3.2.1 — toggleBold entire string', () => {
                tm.setText('Hello');
                tm.toggleBold(0, 5);
                const runs = tm.getRuns();
                expect(runs.length).to.equal(1);
                expect(runs[0].bold).to.be.true;
                expect(runs[0].text).to.equal('Hello');
            });

            it('3.2.2 — toggleBold middle range', () => {
                tm.setText('Hello');
                tm.toggleBold(1, 3);
                const runs = tm.getRuns();
                expect(runs.length).to.equal(3);
                expect(runs[0].text).to.equal('H');
                expect(runs[0].bold).to.be.false;
                expect(runs[1].text).to.equal('el');
                expect(runs[1].bold).to.be.true;
                expect(runs[2].text).to.equal('lo');
                expect(runs[2].bold).to.be.false;
            });

            it('3.2.3 — toggleBold start range', () => {
                tm.setText('Hello');
                tm.toggleBold(0, 2);
                const runs = tm.getRuns();
                expect(runs.length).to.equal(2);
                expect(runs[0].text).to.equal('He');
                expect(runs[0].bold).to.be.true;
                expect(runs[1].text).to.equal('llo');
                expect(runs[1].bold).to.be.false;
            });

            it('3.2.4 — toggleBold end range', () => {
                tm.setText('Hello');
                tm.toggleBold(3, 5);
                const runs = tm.getRuns();
                expect(runs.length).to.equal(2);
                expect(runs[0].text).to.equal('Hel');
                expect(runs[0].bold).to.be.false;
                expect(runs[1].text).to.equal('lo');
                expect(runs[1].bold).to.be.true;
            });

            it('3.2.5 — toggleBold does not affect italic or underline', () => {
                tm.setText('Hello');
                tm.toggleBold(1, 3);  // 'el' becomes bold only
                const runs = tm.getRuns();
                expect(runs.length).to.equal(3);
                expect(runs[1].text).to.equal('el');
                expect(runs[1].bold).to.be.true;
                expect(runs[1].italic).to.be.false;
                expect(runs[1].underline).to.be.false;
            });

            it('3.2.8 — toggleItalic does not affect bold or underline', () => {
                tm.setText('Hello');
                tm.toggleItalic(1, 3);
                const runs = tm.getRuns();
                expect(runs[1].italic).to.be.true;
                expect(runs[1].bold).to.be.false;
                expect(runs[1].underline).to.be.false;
            });

            it('3.2.9 — toggleUnderline does not affect bold or italic', () => {
                tm.setText('Hello');
                tm.toggleUnderline(1, 3);
                const runs = tm.getRuns();
                expect(runs[1].underline).to.be.true;
                expect(runs[1].bold).to.be.false;
                expect(runs[1].italic).to.be.false;
            });

            it('3.2.10 — toggleBold on italic range preserves italic', () => {
                tm.setText('Hello');
                tm.toggleItalic(1, 3);  // 'el' is italic
                tm.toggleBold(1, 3);    // 'el' becomes bold+italic (italic preserved)
                const runs = tm.getRuns();
                expect(runs[1].bold).to.be.true;
                expect(runs[1].italic).to.be.true;
                expect(runs[1].underline).to.be.false;
            });

            it('3.2.6 — toggleUnderline single char', () => {
                tm.setText('Hello');
                tm.toggleUnderline(0, 1);
                const runs = tm.getRuns();
                expect(runs.length).to.equal(2);
                expect(runs[0].text).to.equal('H');
                expect(runs[0].underline).to.be.true;
                expect(runs[1].text).to.equal('ello');
                expect(runs[1].underline).to.be.false;
            });

            it('3.2.7 — toggle inverse (unbold)', () => {
                tm.setText('Hello');
                tm.toggleBold(1, 3);  // 'el' is bold
                tm.toggleBold(1, 3);  // 'el' returns to plain
                const runs = tm.getRuns();
                expect(runs.length).to.equal(1);
                expect(runs[0].bold).to.be.false;
                expect(runs[0].text).to.equal('Hello');
            });
        });

        // ============================================================
        // Section 3.3: Run Merging & Splitting
        // ============================================================
        describe('Section 3.3 — Run Merging & Splitting', () => {
            let tm, state;

            beforeEach(() => {
                state = makeState();
                tm = createTitleManager(state);
            });

            it('3.3.1 — split single run via bold range', () => {
                tm.setText('Hello');
                tm.toggleBold(1, 3);
                const runs = tm.getRuns();
                expect(runs.length).to.equal(3);
                expect(runs[0].text).to.equal('H');
                expect(runs[0].bold).to.be.false;
                expect(runs[1].text).to.equal('el');
                expect(runs[1].bold).to.be.true;
                expect(runs[2].text).to.equal('lo');
                expect(runs[2].bold).to.be.false;
            });

            it('3.3.2 — merge adjacent same-style runs', () => {
                // Create two bold runs manually
                state.titleRuns = [
                    createTitleRun('A', true, false, false),
                    createTitleRun('B', true, false, false)
                ];
                tm.setText(''); // Reset text
                // Use toggleBold to trigger merge
                tm.setText('AB');
                tm.toggleBold(0, 2);
                const runs = tm.getRuns();
                expect(runs.length).to.equal(1);
                expect(runs[0].text).to.equal('AB');
                expect(runs[0].bold).to.be.true;
            });

            it('3.3.3 — toggleBold on mixed runs flips formatting', () => {
                // Start with: A (B), B (P), C (B)
                state.titleRuns = [
                    createTitleRun('A', true, false, false),
                    createTitleRun('B', false, false, false),
                    createTitleRun('C', true, false, false)
                ];
                state.titleText = 'ABC';
                // toggleBold flips: A→plain, B→bold, C→plain
                tm.toggleBold(0, 3);
                const runs = tm.getRuns();
                expect(runs.length).to.equal(3);
                expect(runs[0].text).to.equal('A');
                expect(runs[0].bold).to.be.false;
                expect(runs[1].text).to.equal('B');
                expect(runs[1].bold).to.be.true;
                expect(runs[2].text).to.equal('C');
                expect(runs[2].bold).to.be.false;
            });

            it('3.3.4 — split via range plain (unbold middle)', () => {
                tm.setText('ABC');
                tm.toggleBold(0, 3);  // All bold
                tm.toggleBold(1, 2);  // Unbold 'B'
                const runs = tm.getRuns();
                expect(runs.length).to.equal(3);
                expect(runs[0].text).to.equal('A');
                expect(runs[0].bold).to.be.true;
                expect(runs[1].text).to.equal('B');
                expect(runs[1].bold).to.be.false;
                expect(runs[2].text).to.equal('C');
                expect(runs[2].bold).to.be.true;
            });

            it('3.3.5 — formatting empty string is no-op', () => {
                tm.setText('');
                tm.toggleBold(0, 0);
                expect(tm.getRuns().length).to.equal(0);
                expect(tm.getFullText()).to.equal('');
            });
        });

        // ============================================================
        // Additional TitleManager tests
        // ============================================================
        describe('Section 3 — Additional TitleManager behavior', () => {
            let tm, state;

            beforeEach(() => {
                state = makeState();
                tm = createTitleManager(state);
            });

            it('setText creates single plain run', () => {
                tm.setText('Hello');
                const runs = tm.getRuns();
                expect(runs.length).to.equal(1);
                expect(runs[0].text).to.equal('Hello');
                expect(runs[0].bold).to.be.false;
                expect(runs[0].italic).to.be.false;
                expect(runs[0].underline).to.be.false;
            });

            it('setText with empty string clears runs', () => {
                tm.setText('Hello');
                tm.setText('');
                expect(tm.getRuns().length).to.equal(0);
                expect(tm.getFullText()).to.equal('');
            });

            it('setText updates titleText in state', () => {
                tm.setText('Hello');
                expect(state.titleText).to.equal('Hello');
            });

            it('getFullText concatenates all runs', () => {
                state.titleRuns = [
                    createTitleRun('He', false, false, false),
                    createTitleRun('llo', true, false, false)
                ];
                expect(tm.getFullText()).to.equal('Hello');
            });

            it('getTextAt finds correct run', () => {
                tm.setText('Hello');
                tm.toggleBold(1, 4);  // 'ell' is bold
                const run0 = tm.getTextAt(0);
                expect(run0.text).to.equal('H');
                expect(run0.bold).to.be.false;

                const run1 = tm.getTextAt(2);
                expect(run1.text).to.equal('ell');
                expect(run1.bold).to.be.true;

                const run2 = tm.getTextAt(4);
                expect(run2.text).to.equal('o');
                expect(run2.bold).to.be.false;
            });

            it('getTextAt returns null for out of range', () => {
                tm.setText('Hello');
                expect(tm.getTextAt(-1)).to.be.null;
                expect(tm.getTextAt(5)).to.be.null;
                expect(tm.getTextAt(100)).to.be.null;
            });

            it('getState returns snapshot', () => {
                tm.setText('Hello');
                const titleStyle = { fontFamily: 'Arial', fontSize: 36 };
                state.titleStyle = titleStyle;
                const snap = tm.getState();
                expect(snap.text).to.equal('Hello');
                expect(snap.runs.length).to.equal(1);
                expect(snap.style).to.equal(titleStyle);
            });

            it('onTitleChanged fires on setText', () => {
                let called = false;
                tm.onTitleChanged(() => { called = true; });
                tm.setText('Hello');
                expect(called).to.be.true;
            });

            it('onTitleChanged fires on insertChar', () => {
                let called = 0;
                tm.onTitleChanged(() => { called++; });
                tm.setText('Hi');
                tm.insertChar(2, '!');
                expect(called).to.equal(2);
            });

            it('onTitleChanged fires on deleteChar', () => {
                let called = false;
                tm.onTitleChanged(() => { called = true; });
                tm.setText('Hello');
                tm.deleteChar(0);
                expect(called).to.be.true;
            });

            it('onTitleChanged fires on toggleBold', () => {
                let called = false;
                tm.onTitleChanged(() => { called = true; });
                tm.setText('Hello');
                tm.toggleBold(0, 5);
                expect(called).to.be.true;
            });

            it('insertChar with formatting creates correctly styled run', () => {
                tm.setText('Hello');
                tm.toggleBold(0, 5);  // All bold
                tm.insertChar(5, '!', false, false, false); // Insert plain '!'
                const runs = tm.getRuns();
                expect(runs.length).to.equal(2);
                expect(runs[0].text).to.equal('Hello');
                expect(runs[0].bold).to.be.true;
                expect(runs[1].text).to.equal('!');
                expect(runs[1].bold).to.be.false;
            });

            it('rapid formatting toggles produce correct final state', () => {
                tm.setText('Hello');
                // Toggle bold 10 times — should end up plain (even number)
                for (let i = 0; i < 10; i++) {
                    tm.toggleBold(0, 5);
                }
                const runs = tm.getRuns();
                expect(runs.length).to.equal(1);
                expect(runs[0].bold).to.be.false;
            });

            it('rapid formatting toggles — odd count', () => {
                tm.setText('Hello');
                for (let i = 0; i < 5; i++) {
                    tm.toggleBold(0, 5);
                }
                const runs = tm.getRuns();
                expect(runs.length).to.equal(1);
                expect(runs[0].bold).to.be.true;
            });
        });

        // ============================================================
        // Title Style Setters (new methods from Phase 2 refactoring)
        // ============================================================
        describe('Title Style Setters', () => {
            let tm, state;

            beforeEach(() => {
                state = makeState();
                // Ensure titleStyle exists
                if (!state.titleStyle) {
                    state.titleStyle = {
                        fontFamily: 'Arial',
                        fontSize: 36,
                        fontColor: '#FFFFFF',
                        backgroundColor: '#000000',
                        alignment: 'center',
                        showBackground: false
                    };
                }
                tm = createTitleManager(state);
            });

            it('setFontFamily updates titleStyle.fontFamily', () => {
                tm.setFontFamily('Helvetica');
                expect(state.titleStyle.fontFamily).to.equal('Helvetica');
            });

            it('setFontSize updates titleStyle.fontSize', () => {
                tm.setFontSize(48);
                expect(state.titleStyle.fontSize).to.equal(48);
            });

            it('setFontColor updates titleStyle.fontColor', () => {
                tm.setFontColor('#FF0000');
                expect(state.titleStyle.fontColor).to.equal('#FF0000');
            });

            it('setBackgroundColor updates titleStyle.backgroundColor', () => {
                tm.setBackgroundColor('#00FF00');
                expect(state.titleStyle.backgroundColor).to.equal('#00FF00');
            });

            it('setAlignment updates titleStyle.alignment', () => {
                tm.setAlignment('left');
                expect(state.titleStyle.alignment).to.equal('left');
            });

            it('showBackground updates titleStyle.showBackground', () => {
                tm.showBackground(true);
                expect(state.titleStyle.showBackground).to.be.true;
                tm.showBackground(false);
                expect(state.titleStyle.showBackground).to.be.false;
            });

            it('all setters trigger notify callback', () => {
                let notified = false;
                const tmWithCallback = createTitleManager(state, () => { notified = true; });

                tmWithCallback.setFontFamily('Verdana');
                expect(notified).to.be.true;

                notified = false;
                tmWithCallback.setFontSize(24);
                expect(notified).to.be.true;

                notified = false;
                tmWithCallback.setAlignment('right');
                expect(notified).to.be.true;
            });

            // Phase 3: Opacity setters
            it('setFontOpacity sets value in range', () => {
                tm.setFontOpacity(0.5);
                expect(state.titleStyle.fontOpacity).to.equal(0.5);
            });

            it('setFontOpacity clamps negative to 0', () => {
                tm.setFontOpacity(-0.5);
                expect(state.titleStyle.fontOpacity).to.equal(0);
            });

            it('setFontOpacity clamps above 1 to 1', () => {
                tm.setFontOpacity(1.5);
                expect(state.titleStyle.fontOpacity).to.equal(1);
            });

            it('setBgOpacity sets value in range', () => {
                tm.setBgOpacity(0.7);
                expect(state.titleStyle.bgOpacity).to.equal(0.7);
            });

            it('setBgOpacity clamps negative to 0', () => {
                tm.setBgOpacity(-0.3);
                expect(state.titleStyle.bgOpacity).to.equal(0);
            });

            it('setBgOpacity clamps above 1 to 1', () => {
                tm.setBgOpacity(2.0);
                expect(state.titleStyle.bgOpacity).to.equal(1);
            });

            it('opacity setters trigger notify callback', () => {
                let notified = 0;
                const tmWithCallback = createTitleManager(state, () => { notified++; });

                tmWithCallback.setFontOpacity(0.5);
                expect(notified).to.equal(1);

                tmWithCallback.setBgOpacity(0.3);
                expect(notified).to.equal(2);
            });

            // Phase 4: Width setter
            it('setWidth sets positive value', () => {
                tm.setWidth(400);
                expect(state.titleStyle.titleBoxWidth).to.equal(400);
            });

            it('setWidth nulls zero value', () => {
                tm.setWidth(0);
                expect(state.titleStyle.titleBoxWidth).to.be.null;
            });

            it('setWidth nulls negative value', () => {
                tm.setWidth(-10);
                expect(state.titleStyle.titleBoxWidth).to.be.null;
            });

            it('setWidth triggers notify callback', () => {
                let notified = false;
                const tmWithCallback = createTitleManager(state, () => { notified = true; });
                tmWithCallback.setWidth(500);
                expect(notified).to.be.true;
            });

            // Phase 5: Position setters
            it('setPosition sets titleBoxX and titleBoxY', () => {
                tm.setPosition(100, 200);
                expect(state.titleStyle.titleBoxX).to.equal(100);
                expect(state.titleStyle.titleBoxY).to.equal(200);
            });

            it('setPosition accepts negative coordinates', () => {
                tm.setPosition(-50, -10);
                expect(state.titleStyle.titleBoxX).to.equal(-50);
                expect(state.titleStyle.titleBoxY).to.equal(-10);
            });

            it('setPosition accepts zero coordinates', () => {
                tm.setPosition(0, 0);
                expect(state.titleStyle.titleBoxX).to.equal(0);
                expect(state.titleStyle.titleBoxY).to.equal(0);
            });

            it('setPosition triggers notify callback', () => {
                let notified = false;
                const tmWithCallback = createTitleManager(state, () => { notified = true; });
                tmWithCallback.setPosition(50, 100);
                expect(notified).to.be.true;
            });

            it('resetPosition nulls titleBoxX, titleBoxY, and titleBoxWidth', () => {
                // Set some values first
                state.titleStyle.titleBoxX = 100;
                state.titleStyle.titleBoxY = 200;
                state.titleStyle.titleBoxWidth = 500;
                tm.resetPosition();
                expect(state.titleStyle.titleBoxX).to.be.null;
                expect(state.titleStyle.titleBoxY).to.be.null;
                expect(state.titleStyle.titleBoxWidth).to.be.null;
            });

            it('resetPosition is idempotent when already null', () => {
                state.titleStyle.titleBoxX = null;
                state.titleStyle.titleBoxY = null;
                state.titleStyle.titleBoxWidth = null;
                tm.resetPosition();
                expect(state.titleStyle.titleBoxX).to.be.null;
                expect(state.titleStyle.titleBoxY).to.be.null;
                expect(state.titleStyle.titleBoxWidth).to.be.null;
            });

            it('resetPosition skips notify when already at defaults', () => {
                let notified = false;
                const tmWithCallback = createTitleManager(state, () => { notified = true; });
                state.titleStyle.titleBoxX = null;
                state.titleStyle.titleBoxY = null;
                state.titleStyle.titleBoxWidth = null;
                tmWithCallback.resetPosition();
                expect(notified).to.be.false;
            });

            it('resetPosition triggers notify callback', () => {
                let notified = false;
                const tmWithCallback = createTitleManager(state, () => { notified = true; });
                tmWithCallback.resetPosition();
                expect(notified).to.be.true;
            });
        });

        // ============================================================
        // TitleRun model tests (used by TitleManager)
        // ============================================================
        describe('TitleRun model functions', () => {
            it('createTitleRun with defaults', () => {
                const run = createTitleRun('Hello');
                expect(run.text).to.equal('Hello');
                expect(run.bold).to.be.false;
                expect(run.italic).to.be.false;
                expect(run.underline).to.be.false;
            });

            it('createTitleRun with all formatting', () => {
                const run = createTitleRun('Hello', true, true, true);
                expect(run.bold).to.be.true;
                expect(run.italic).to.be.true;
                expect(run.underline).to.be.true;
            });

            it('cloneTitleRun produces independent copy', () => {
                const original = createTitleRun('Hello', true, false, false);
                const clone = cloneTitleRun(original);
                expect(clone.text).to.equal('Hello');
                expect(clone.bold).to.be.true;
                expect(clone).to.not.equal(original);
            });

            it('runsHaveSameFormatting ignores text content', () => {
                const a = createTitleRun('A', true, false, false);
                const b = createTitleRun('B', true, false, false);
                expect(runsHaveSameFormatting(a, b)).to.be.true;
            });

            it('runsHaveSameFormatting detects different formatting', () => {
                const a = createTitleRun('A', true, false, false);
                const b = createTitleRun('A', false, false, false);
                expect(runsHaveSameFormatting(a, b)).to.be.false;
            });
        });

        // ============================================================
        // TitleStyle Model — Phase 3: Opacity defaults
        // ============================================================
        describe('TitleStyle Model — Opacity (Phase 3)', () => {
            it('createTitleStyle defaults: fontOpacity is 1.0', () => {
                const style = createTitleStyle();
                expect(style.fontOpacity).to.equal(1.0);
            });

            it('createTitleStyle defaults: bgOpacity is 1.0', () => {
                const style = createTitleStyle();
                expect(style.bgOpacity).to.equal(1.0);
            });

            it('createTitleStyle accepts custom fontOpacity', () => {
                const style = createTitleStyle({ fontOpacity: 0.5 });
                expect(style.fontOpacity).to.equal(0.5);
                expect(style.bgOpacity).to.equal(1.0);
            });

            it('createTitleStyle accepts custom bgOpacity', () => {
                const style = createTitleStyle({ bgOpacity: 0.3 });
                expect(style.fontOpacity).to.equal(1.0);
                expect(style.bgOpacity).to.equal(0.3);
            });

            it('createTitleStyle accepts both opacity values', () => {
                const style = createTitleStyle({ fontOpacity: 0.5, bgOpacity: 0.3 });
                expect(style.fontOpacity).to.equal(0.5);
                expect(style.bgOpacity).to.equal(0.3);
            });
        });

        // ============================================================
        // TitleStyle Model — Phase 4: Width and Position fields
        // ============================================================
        describe('TitleStyle Model — Width and Position (Phase 4)', () => {
            it('createTitleStyle defaults: titleBoxWidth is null', () => {
                const style = createTitleStyle();
                expect(style.titleBoxWidth).to.be.null;
            });

            it('createTitleStyle defaults: titleBoxX is null', () => {
                const style = createTitleStyle();

            });

            it('createTitleStyle defaults: titleBoxY is null', () => {
                const style = createTitleStyle();
                expect(style.titleBoxY).to.be.null;
            });

            it('createTitleStyle accepts custom titleBoxWidth', () => {
                const style = createTitleStyle({ titleBoxWidth: 600 });
                expect(style.titleBoxWidth).to.equal(600);
            });

            it('createTitleStyle accepts custom position', () => {
                const style = createTitleStyle({ titleBoxX: 100, titleBoxY: 200 });
                expect(style.titleBoxX).to.equal(100);
                expect(style.titleBoxY).to.equal(200);
            });
        });
