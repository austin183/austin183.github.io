    <div id="mocha"></div>

    <script>mocha.setup('bdd');</script>

        import {
            computeTouchMidpoint,
            computeTouchDistance,
            computePinchScale,
            createMultiTouchHandler

        const { expect } = chai;

        // ============================================================
        // Helpers (mirrored from MultiTouchHandlerTest.html)
        // ============================================================
        function makeTouchList(touches) {
            const list = {
                length: touches.length,
                item: (i) => touches[i] || null
            };
            for (let i = 0; i < touches.length; i++) {
                list[i] = touches[i];
            }
            list[Symbol.iterator] = function* () {
                for (let i = 0; i < this.length; i++) {
                    yield this[i];
                }
            };
            return list;
        }

        function makeTouch(touchId, clientX, clientY) {
            return { identifier: touchId, clientX, clientY };
        }

        function createMockTouchEvent(type, { touches, targetTouches, changedTouches } = {}) {
            const evt = new Event(type, { bubbles: true, cancelable: true });
            const props = {};
            if (touches) props.touches = touches;
            if (targetTouches) props.targetTouches = targetTouches;
            if (changedTouches) props.changedTouches = changedTouches;
            for (const [key, value] of Object.entries(props)) {
                Object.defineProperty(evt, key, {
                    get: () => value,
                    configurable: true
                });
            }
            return evt;
        }

        // ============================================================
        // Pure Math Functions — regression: must NOT change
        // ============================================================
        describe('Pure math functions (regression)', () => {
            it('computeTouchMidpoint is unchanged', () => {
                const mid = computeTouchMidpoint(
                    { clientX: 100, clientY: 200 },
                    { clientX: 300, clientY: 400 }
                );
                expect(mid.x).to.equal(200);
                expect(mid.y).to.equal(300);
            });

            it('computeTouchDistance is unchanged', () => {
                const dist = computeTouchDistance(
                    { clientX: 0, clientY: 0 },
                    { clientX: 300, clientY: 400 }
                );
                expect(dist).to.equal(500);
            });

            it('computePinchScale is unchanged — equal distances return 1.0', () => {
                expect(computePinchScale(100, 100)).to.equal(1.0);
            });

            it('computePinchScale is unchanged — guards against zero initial', () => {
                expect(computePinchScale(0, 100)).to.equal(1.0);
            });
        });

        // ============================================================
        // 1.4.1 — TouchEvent pan delta negated (direct manipulation)
        // Dragging fingers RIGHT should produce NEGATIVE adjustCrop x
        // so that sourceRect.x decreases → image content moves RIGHT
        // ============================================================
        describe('TouchEvent pan delta negation (direct manipulation)', () => {
            it('1.4.1 — two-finger drag RIGHT produces negative adjustCrop x', async () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-dir-touch-x';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                canvas.style.position = 'absolute';
                canvas.style.left = '0px';
                canvas.style.top = '0px';
                document.body.appendChild(canvas);

                let adjustDelta = null;

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-dir-touch-x',
                    cropManager: {
                        adjustCrop: (_panelId, delta) => { adjustDelta = delta; },
                        zoomCrop: () => {},
                        getPanelImage: () => ({ width: 1920, height: 1080 })
                    },
                    state: { selectedPanelId: 'panel-0' },
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                // Start: midpoint at (150, 100)
                const touchesStart = makeTouchList([
                    makeTouch(1, 100, 100),
                    makeTouch(2, 200, 100)
                ]);
                canvas.dispatchEvent(createMockTouchEvent('touchstart', {
                    touches: touchesStart, targetTouches: touchesStart,
                    changedTouches: touchesStart
                }));

                // Move RIGHT by 50px: midpoint goes from (150,100) to (200,100)
                // dx = +50, dy = 0
                // After negation: adjustCrop x should be negative
                const touchesMove = makeTouchList([
                    makeTouch(1, 150, 100),
                    makeTouch(2, 250, 100)
                ]);
                canvas.dispatchEvent(createMockTouchEvent('touchmove', {
                    touches: touchesMove, targetTouches: touchesMove,
                    changedTouches: touchesMove
                }));

                await new Promise(r => setTimeout(r, 10));

                expect(adjustDelta).to.be.an('object');
                // Dragging RIGHT (positive dx) should produce NEGATIVE adjustCrop x
                // so that sourceRect.x decreases → image content moves RIGHT
                expect(adjustDelta.x).to.be.lessThan(0);
                // Y should be zero (no vertical movement)
                expect(adjustDelta.y).to.equal(0);

                handler.detach();
                document.body.removeChild(canvas);
            });

        // ============================================================

                // Wheel scrolling RIGHT should produce POSITIVE adjustCrop x

        // ============================================================

        describe('Pinch zoom unchanged (regression)', () => {
            it('1.4.4 — TouchEvent pinch open still zooms in (factor > 1)', async () => {

        // ============================================================

        describe('One-finger touch ignored (regression)', () => {
            it('1.4.5 — single-finger touchstart does not activate gesture', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-dir-single';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                document.body.appendChild(canvas);

                let prevented = false;
                const state = { selectedPanelId: 'panel-0', _multiTouchGestureActive: false };

                const handler = createMultiTouchHandler({
                    canvasId: 'mt-dir-single',
                    cropManager: { adjustCrop: () => {}, zoomCrop: () => {} },
                    state: state,
                    onCropPreviewRender: () => {},
                    onRenderScheduled: () => {}
                });
                handler.attach();

                const touches = makeTouchList([makeTouch(1, 100, 100)]);
                const evt = createMockTouchEvent('touchstart', {
                    touches: touches, targetTouches: touches,
                    changedTouches: touches
                });
                evt.preventDefault = () => { prevented = true; };
                canvas.dispatchEvent(evt);

                expect(prevented).to.be.false;
                expect(state._multiTouchGestureActive).to.be.false;

                handler.detach();
                document.body.removeChild(canvas);
            });
        });

                        zoomCrop: () => {},

                // Start: midpoint at (150, 100)
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 1, clientX: 100, clientY: 100, pointerType: 'mouse'
                }));
                canvas.dispatchEvent(new PointerEvent('pointerdown', {
                    pointerId: 2, clientX: 200, clientY: 100, pointerType: 'mouse'
                }));

                // Move RIGHT by 50px: midpoint goes from (150,100) to (200,100)
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    pointerId: 1, clientX: 150, clientY: 100, pointerType: 'mouse'
                }));
                canvas.dispatchEvent(new PointerEvent('pointermove', {
                    pointerId: 2, clientX: 250, clientY: 100, pointerType: 'mouse'
                }));

                await new Promise(r => setTimeout(r, 10));

                expect(adjustDelta).to.be.an('object');
                // Dragging RIGHT should produce NEGATIVE adjustCrop x (direct manipulation)
                expect(adjustDelta.x).to.be.lessThan(0);
                expect(adjustDelta.y).to.equal(0);

                handler.detach();
                document.body.removeChild(canvas);
            });
        });

        // ============================================================
        // CSS: touch-action on canvas
        // This test verifies the CSS property value via computed styles
        // ============================================================
        describe('Canvas touch-action CSS', () => {
            it('canvas element should have touch-action: pan-y (not none)', () => {
                const canvas = document.createElement('canvas');
                canvas.id = 'mt-css-test';
                canvas.style.width = '400px';
                canvas.style.height = '300px';
                // Apply the same class that the app uses
                canvas.style.touchAction = 'pan-y';
                document.body.appendChild(canvas);

                const style = window.getComputedStyle(canvas);
                expect(style.touchAction).to.equal('pan-y');

                document.body.removeChild(canvas);
            });
        });

        mocha.run();
    </script>
