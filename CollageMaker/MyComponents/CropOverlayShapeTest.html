<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropOverlayShape Tests</title>
    <link rel="stylesheet" href="https://unpkg.com/mocha@10.2.0/mocha.css">
    <style>
        body { margin: 20px; font-family: sans-serif; }
        #mocha { margin-top: 20px; }
        .test-plan-ref { color: #888; font-size: 0.85em; }
    </style>
</head>
<body>
    <h1>CollageMaker — Crop Overlay Shape Unit Tests</h1>
    <p class="test-plan-ref">Covers: Phase 3 — CR-04a Crop Overlay Shape Alignment</p>
    <div id="mocha"></div>

    <script src="https://unpkg.com/mocha@10.2.0/mocha.js"></script>
    <script src="https://unpkg.com/chai@4.3.10/chai.js"></script>
    <script>mocha.setup('bdd');</script>

    <script type="module">
        import { computeShapeOverlayPoints, drawShapeOverlay, beginPathFromPoints } from '../MyESModules/Layout/CropOverlayShape.js';
        import { createRectGeometry, createPathGeometry, isRectGeometry } from '../MyESModules/Models/PanelGeometry.js';

        const { expect } = chai;

        // ============================================================
        // CR-04a: Crop Overlay Shape Alignment
        // ============================================================
        describe('CropOverlayShape — computeShapeOverlayPoints', () => {
            it('returns null for rect geometry', () => {
                const rect = createRectGeometry({ x: 0, y: 0, width: 200, height: 150 });
                const cropScreen = { x: 10, y: 10, width: 180, height: 130 };
                const result = computeShapeOverlayPoints(rect, cropScreen);
                expect(result).to.be.null;
            });

            it('computes parallelogram overlay points for path geometry', () => {
                // Parallelogram panel
                const pts = [
                    [0, 0], [100, 0], [140, 200], [40, 200]
                ];
                const br = { x: 0, y: 0, width: 140, height: 200 };
                const geo = createPathGeometry(pts, br);
                const cropScreen = { x: 20, y: 20, width: 160, height: 120 };

                const result = computeShapeOverlayPoints(geo, cropScreen);
                expect(result).to.be.an('array');
                expect(result.length).to.equal(4);
                // Points should be within crop screen bounds
                for (const [x, y] of result) {
                    expect(x).to.be.at.least(cropScreen.x - 0.01);
                    expect(x).to.be.at.most(cropScreen.x + cropScreen.width + 0.01);
                    expect(y).to.be.at.least(cropScreen.y - 0.01);
                    expect(y).to.be.at.most(cropScreen.y + cropScreen.height + 0.01);
                }
            });

            it('computes hexagon overlay points', () => {
                // Regular hexagon
                const pts = [
                    [50, 0], [100, 29], [100, 85], [50, 115], [0, 85], [0, 29]
                ];
                const br = { x: 0, y: 0, width: 100, height: 115 };
                const geo = createPathGeometry(pts, br);
                const cropScreen = { x: 10, y: 10, width: 180, height: 130 };

                const result = computeShapeOverlayPoints(geo, cropScreen);
                expect(result).to.be.an('array');
                expect(result.length).to.equal(6);
            });

            it('maintains aspect ratio when scaling', () => {
                // Wide parallelogram
                const pts = [[0, 0], [200, 0], [240, 100], [40, 100]];
                const br = { x: 0, y: 0, width: 240, height: 100 };
                const geo = createPathGeometry(pts, br);
                const cropScreen = { x: 0, y: 0, width: 200, height: 200 };

                const result = computeShapeOverlayPoints(geo, cropScreen);
                expect(result).to.be.an('array');
                // Width should be constrained (shape is wider than tall)
                const xs = result.map(p => p[0]);
                const ys = result.map(p => p[1]);
                const resultW = Math.max(...xs) - Math.min(...xs);
                const resultH = Math.max(...ys) - Math.min(...ys);
                // Aspect ratio should match source (240/100 = 2.4)
                expect(resultW / resultH).to.be.closeTo(2.4, 0.01);
            });

            it('centers shape within crop region', () => {
                const pts = [[0, 0], [100, 0], [100, 100], [0, 100]];
                const br = { x: 0, y: 0, width: 100, height: 100 };
                const geo = createPathGeometry(pts, br);
                const cropScreen = { x: 50, y: 50, width: 200, height: 200 };

                const result = computeShapeOverlayPoints(geo, cropScreen);
                const xs = result.map(p => p[0]);
                const ys = result.map(p => p[1]);
                const centerX = (Math.max(...xs) + Math.min(...xs)) / 2;
                const centerY = (Math.max(...ys) + Math.min(...ys)) / 2;
                // Should be centered in crop region
                expect(centerX).to.be.closeTo(150, 0.01);
                expect(centerY).to.be.closeTo(150, 0.01);
            });

            it('handles zero-size crop screen gracefully', () => {
                const pts = [[0, 0], [100, 0], [100, 100], [0, 100]];
                const br = { x: 0, y: 0, width: 100, height: 100 };
                const geo = createPathGeometry(pts, br);
                const cropScreen = { x: 0, y: 0, width: 0, height: 0 };

                const result = computeShapeOverlayPoints(geo, cropScreen);
                expect(result).to.be.null;
            });
        });

        describe('CropOverlayShape — drawShapeOverlay', () => {
            it('does not crash with null points', () => {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 150;
                const ctx = canvas.getContext('2d');
                // Should not throw
                drawShapeOverlay(ctx, null);
                drawShapeOverlay(ctx, []);
                drawShapeOverlay(ctx, [[0, 0]]);
            });

            it('draws a stroked shape border (fill is transparent)', () => {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 150;
                const ctx = canvas.getContext('2d');

                const points = [[20, 20], [180, 20], [180, 130], [20, 130]];
                drawShapeOverlay(ctx, points);

                // Fill is transparent (alpha 0), so center pixel is untouched
                const centerData = ctx.getImageData(100, 75, 1, 1);
                expect(centerData.data[3]).to.equal(0);

                // Stroke border should be visible along the edge
                const edgeData = ctx.getImageData(20, 75, 1, 1);
                expect(edgeData.data[3]).to.be.greaterThan(0);
            });
        });

        // ============================================================
        // Phase 1.1: beginPathFromPoints helper
        // ============================================================
        describe('CropOverlayShape — beginPathFromPoints', () => {
            it('creates a valid path from an array of points', () => {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 150;
                const ctx = canvas.getContext('2d');

                const points = [[10, 10], [190, 10], [190, 140], [10, 140]];
                beginPathFromPoints(ctx, points);

                // Fill should produce visible pixels
                ctx.fillStyle = '#ff0000';
                ctx.fill();

                const imageData = ctx.getImageData(100, 75, 1, 1);
                expect(imageData.data[0]).to.equal(255); // Red
                expect(imageData.data[1]).to.equal(0);   // Green
                expect(imageData.data[2]).to.equal(0);   // Blue
                expect(imageData.data[3]).to.equal(255); // Alpha
            });

            it('handles triangle (3 points)', () => {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 150;
                const ctx = canvas.getContext('2d');

                const points = [[100, 10], [10, 140], [190, 140]];
                beginPathFromPoints(ctx, points);

                ctx.fillStyle = '#00ff00';
                ctx.fill();

                // Center of triangle should be green
                const imageData = ctx.getImageData(100, 100, 1, 1);
                expect(imageData.data[1]).to.equal(255); // Green
            });

            it('handles hexagon (6 points)', () => {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 200;
                const ctx = canvas.getContext('2d');

                const points = [
                    [100, 10], [170, 50], [170, 130],
                    [100, 170], [30, 130], [30, 50]
                ];
                beginPathFromPoints(ctx, points);

                ctx.fillStyle = '#0000ff';
                ctx.fill();

                // Center should be blue
                const imageData = ctx.getImageData(100, 90, 1, 1);
                expect(imageData.data[2]).to.equal(255); // Blue
            });

            it('does not crash with null or empty points', () => {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 150;
                const ctx = canvas.getContext('2d');

                // Should not throw
                beginPathFromPoints(ctx, null);
                beginPathFromPoints(ctx, undefined);
                beginPathFromPoints(ctx, []);
                beginPathFromPoints(ctx, [[1, 2]]);
                beginPathFromPoints(ctx, [[1, 2], [3, 4]]);
            });

            it('closes the path automatically', () => {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 150;
                const ctx = canvas.getContext('2d');

                // Open triangle (3 points, no explicit closePath by caller)
                const points = [[10, 10], [190, 10], [100, 140]];
                beginPathFromPoints(ctx, points);

                // Stroke should be a closed shape (all 3 edges)
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Check midpoints of all 3 edges are drawn
                const topMid = ctx.getImageData(100, 10, 1, 1);
                const leftMid = ctx.getImageData(55, 75, 1, 1);
                const rightMid = ctx.getImageData(145, 75, 1, 1);

                // All edges should have red stroke
                expect(topMid.data[0]).to.be.greaterThan(200);
                expect(leftMid.data[0]).to.be.greaterThan(200);
                expect(rightMid.data[0]).to.be.greaterThan(200);
            });
        });

        // ============================================================
        // Phase 1.2: Enhanced drawShapeOverlay styling
        // ============================================================
        describe('CropOverlayShape — drawShapeOverlay enhanced styling', () => {
            /**
             * Wrap ctx.fill() and ctx.stroke() to capture canvas state at call time.
             * drawShapeOverlay uses save()/restore() so state is not visible after return.
             */
            function createCaptureCtx() {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 150;
                const ctx = canvas.getContext('2d');

                const captured = { fillStyle: [], strokeStyle: [], lineWidth: [], lineDash: [] };

                const origFill = ctx.fill.bind(ctx);
                const origStroke = ctx.stroke.bind(ctx);

                ctx.fill = function () {
                    captured.fillStyle.push(ctx.fillStyle);
                    captured.lineWidth.push(ctx.lineWidth);
                    return origFill();
                };

                ctx.stroke = function () {
                    captured.strokeStyle.push(ctx.strokeStyle);
                    captured.lineWidth.push(ctx.lineWidth);
                    captured.lineDash.push(ctx.getLineDash().join(','));
                    return origStroke();
                };

                return { ctx, captured };
            }

            it('uses solid stroke (no dash)', () => {
                const { ctx, captured } = createCaptureCtx();

                const points = [[20, 20], [180, 20], [180, 130], [20, 130]];
                drawShapeOverlay(ctx, points);

                // stroke() should be called with empty lineDash (solid)
                expect(captured.lineDash).to.include('');
            });

            it('uses zero fill alpha so the image is fully visible inside the crop shape', () => {
                const { ctx, captured } = createCaptureCtx();

                const points = [[20, 20], [180, 20], [180, 130], [20, 130]];
                drawShapeOverlay(ctx, points);

                expect(captured.fillStyle).to.include('rgba(255, 255, 255, 0)');
            });

            it('uses subtle stroke alpha (0.55) for a thin visible border', () => {
                const { ctx, captured } = createCaptureCtx();

                const points = [[20, 20], [180, 20], [180, 130], [20, 130]];
                drawShapeOverlay(ctx, points);

                expect(captured.strokeStyle).to.include('rgba(255, 255, 255, 0.55)');
            });

            it('uses thin lineWidth of 1', () => {
                const { ctx, captured } = createCaptureCtx();

                const points = [[20, 20], [180, 20], [180, 130], [20, 130]];
                drawShapeOverlay(ctx, points);

                // lineWidth should be 1 at both fill and stroke time
                expect(captured.lineWidth).to.include(1);
            });

            it('fill does not alter underlying pixels (zero alpha)', () => {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 150;
                const ctx = canvas.getContext('2d');

                // Clear to black first
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, 200, 150);

                const points = [[20, 20], [180, 20], [180, 130], [20, 130]];
                drawShapeOverlay(ctx, points);

                // With fill alpha 0, the underlying black pixel should be unchanged
                const imageData = ctx.getImageData(100, 75, 1, 1);
                expect(imageData.data[0]).to.equal(0); // R
                expect(imageData.data[1]).to.equal(0); // G
                expect(imageData.data[2]).to.equal(0); // B
            });
        });

        // Run mocha after all tests are defined
        window.addEventListener('load', () => {
            mocha.run();
        });
    </script>
</body>
</html>
