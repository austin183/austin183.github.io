<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempo Detection Tests</title>
    <link rel="stylesheet" href="https://unpkg.com/mocha@10.2.0/mocha.css">
    <style>
        body { margin: 20px; font-family: sans-serif; }
        #mocha { margin-top: 20px; }
        .test-plan-ref { color: #888; font-size: 0.85em; }
    </style>
</head>
<body>
    <h1>Metronomad — Tempo Detection Unit Tests</h1>
    <p class="test-plan-ref">Covers: CR 001 Phase 2 TD-1.1…TD-1.15 — Analysis/tempoDetection.js (pure DSP, zero real AudioContext)</p>
    <div id="mocha"></div>

    <script src="https://unpkg.com/mocha@10.2.0/mocha.js"></script>
    <script src="https://unpkg.com/chai@4.3.10/chai.js"></script>
    <script>mocha.setup('bdd');</script>

    <script type="module">
        // Barrel import on purpose (risk R-11): a missing re-export fails
        // ES-module linking — this page dies before mocha.run() — so the
        // barrel is verified by this very import.
        import { detectTempo, TEMPO, CLICK } from '../MyESModules/index.js';

        const { expect } = chai;

        // ============================================================
        // Train synthesis — standalone in this page, plain Float32Array,
        // the clickBuffers.js recipe (CLICK constants, 60 ms, 5 ms linear
        // attack, exp decay to 1e-5). Zero real AudioContext.
        // ============================================================

        const FLOOR = 1e-5; // clickBuffers.js decay floor (recipe constant)

        function addClick(ch, start, freq, sampleRate) {
            const length = Math.round(CLICK.DURATION_SEC * sampleRate);
            const attackSamples = Math.max(1, Math.round(CLICK.ATTACK_SEC * sampleRate));
            const decaySamples = length - attackSamples;
            const logFloor = Math.log(FLOOR);
            for (let i = 0; i < length && start + i < ch.length; i++) {
                const amp = i < attackSamples
                    ? (i + 1) / (attackSamples + 1)
                    : Math.exp(logFloor * ((i - attackSamples) / decaySamples));
                ch[start + i] += Math.sin(2 * Math.PI * freq * (i / sampleRate)) * amp;
            }
        }

        /**
         * Click train: `count` clicks at `spacingSec` (first at `offsetSec`),
         * into a zeroed Float32Array of `durationSec`. `accentEvery > 0`
         * accents clicks i % accentEvery === 0 at the accent frequency.
         */
        function makeTrain({ sampleRate, durationSec, spacingSec, count, offsetSec = 0, accentEvery = 0 }) {
            const ch = new Float32Array(Math.round(durationSec * sampleRate));
            for (let i = 0; i < count; i++) {
                const start = Math.round((offsetSec + i * spacingSec) * sampleRate);
                const freq = (accentEvery > 0 && i % accentEvery === 0)
                    ? CLICK.ACCENT_FREQ : CLICK.REGULAR_FREQ;
                addClick(ch, start, freq, sampleRate);
            }
            return ch;
        }

        const train120 = (sampleRate, durationSec = 20) =>
            makeTrain({ sampleRate, durationSec, spacingSec: 0.5, count: durationSec * 2 });

        // ============================================================
        // TEMPO — pinned interface constants (context.md D-D)
        // ============================================================
        describe('tempoDetection.TEMPO (pinned constants)', () => {
            it('D-D — the nine pinned tuning/pipeline constants are verbatim', () => {
                expect(TEMPO.HOP).to.equal(512);
                expect(TEMPO.FRAME).to.equal(2048);
                expect(TEMPO.WINDOW_SEC).to.equal(60);
                expect(TEMPO.PRIOR_MIN).to.equal(70);
                expect(TEMPO.PRIOR_MAX).to.equal(180);
                expect(TEMPO.PRIOR_OUT_BAND_SCALE).to.equal(0.75);
                expect(TEMPO.NOISE_FLOOR_SCALE).to.equal(0.01);
                // 12, not the D-D initial candidate 8: tuned under the D-D
                // tuning contract during Phase 2 RED/GREEN — the 75 %-overlap
                // frame grid (FRAME 2048 / HOP 512) yields ≈2 onsets-above-
                // floor per click, so 12 preserves every pinned TD-1.*
                // outcome (6 clicks → 11 onsets → null, TD-1.11; smallest
                // pinned positive train → ≈39).
                expect(TEMPO.MIN_ONSET_FRAMES).to.equal(12);
                expect(TEMPO.CONFIDENCE_THRESHOLD).to.equal(0.6);
            });
        });

        // ============================================================
        // detectTempo() — TD-1.1…TD-1.15
        // ============================================================
        describe('tempoDetection.detectTempo()', () => {
            it('TD-1.1 — 120 BPM train @ 44 100 Hz → 120 ± 1, confidence ≥ 0.6', () => {
                const result = detectTempo([train120(44100)], 44100);
                expect(result, 'result should not be null').to.not.be.null;
                expect(result.bpm).to.be.within(119, 121);
                expect(result.confidence).to.be.at.least(0.6);
            });

            it('TD-1.2 — same train re-synthesized @ 48 000 Hz → 120 ± 1 (W-8: per-sampleRate math)', () => {
                const result = detectTempo([train120(48000)], 48000);
                expect(result, 'result should not be null').to.not.be.null;
                expect(result.bpm).to.be.within(119, 121);
            });

            it('TD-1.3 — 60 BPM train (20 clicks, 1 s spacing) → null, never a confident 60 (plan-bug note)', () => {
                // PLAN BUG (surfaced in the session summary): this row pins
                // BYTE-IDENTICAL input to TD-1.7 (20 clicks at t = 0…19 s)
                // but expects "60 ± 1 — the in-band aliases have ≈0
                // correlation, so it still wins". The phase file's pinned
                // mechanism (P0, W-12/W-13) says the opposite for exactly
                // this shape: "a genuine half-time train has its true period
                // out-of-band with a *weak* in-band alias — the conservative
                // reading is null, never the out-of-band tempo reported
                // confidently" — "out-of-band winners require the in-band
                // alias to be non-weak, else null". A pure function cannot
                // return 60 for TD-1.3 and null for TD-1.7. The P0 pin
                // (TD-1.7) governs; this input → null. The row needs plan
                // correction (likely intent: an out-of-band tempo whose
                // in-band alias IS non-weak, which would report the alias).
                const ch = makeTrain({ sampleRate: 44100, durationSec: 20, spacingSec: 1.0, count: 20 });
                const result = detectTempo([ch], 44100);
                expect(result).to.be.null;
            });

            it('TD-1.4 — 90 BPM train (20 clicks, 0.667 s) → 90 ± 1', () => {
                const ch = makeTrain({ sampleRate: 44100, durationSec: 20, spacingSec: 2 / 3, count: 20 });
                const result = detectTempo([ch], 44100);
                expect(result, 'result should not be null').to.not.be.null;
                expect(result.bpm).to.be.within(89, 91);
            });

            it('TD-1.5 — 180 BPM train (40 clicks, 0.333 s) → 180 ± 1 (90 half-period alias loses)', () => {
                const ch = makeTrain({ sampleRate: 44100, durationSec: 20, spacingSec: 1 / 3, count: 40 });
                const result = detectTempo([ch], 44100);
                expect(result, 'result should not be null').to.not.be.null;
                expect(result.bpm).to.be.within(179, 181);
            });

            it('TD-1.6 — 240 BPM train (40 clicks, 0.25 s) → bpm ∈ {120, 240} (KB-15 alias family)', () => {
                const ch = makeTrain({ sampleRate: 44100, durationSec: 20, spacingSec: 0.25, count: 40 });
                const result = detectTempo([ch], 44100);
                expect(result, 'result should not be null').to.not.be.null;
                expect([120, 240]).to.include(result.bpm);
            });

            it('TD-1.7 — half-time 120 (20 clicks, onsets every 2 beats) → 120 or null, NEVER 60 (W-12/W-13)', () => {
                const ch = makeTrain({ sampleRate: 44100, durationSec: 20, spacingSec: 1.0, count: 20 });
                const result = detectTempo([ch], 44100);
                expect(result === null || result.bpm === 120)
                    .to.equal(true, `expected 120 or null, got ${result ? result.bpm : 'null'}`);
            });

            it('TD-1.8 — 75/150 half-time pair (both in-band): each ∈ {75, 150, null}, never a wrong family', () => {
                const slow = makeTrain({ sampleRate: 44100, durationSec: 20, spacingSec: 0.8, count: 25 });
                const fast = makeTrain({ sampleRate: 44100, durationSec: 20, spacingSec: 0.4, count: 50 });
                for (const ch of [slow, fast]) {
                    const result = detectTempo([ch], 44100);
                    expect(result === null || [75, 150].includes(result.bpm))
                        .to.equal(true, `expected 75, 150, or null, got ${result ? result.bpm : 'null'}`);
                }
            });

            it('TD-1.9 — 10 s digital silence → null (no onsets above the noise floor)', () => {
                expect(detectTempo([new Float32Array(10 * 44100)], 44100)).to.be.null;
            });

            it('TD-1.10 — 10 s steady 440 Hz tone (onset-free) → null (flat onset envelope)', () => {
                const ch = new Float32Array(10 * 44100);
                for (let i = 0; i < ch.length; i++) ch[i] = 0.5 * Math.sin(2 * Math.PI * 440 * (i / 44100));
                expect(detectTempo([ch], 44100)).to.be.null;
            });

            it('TD-1.11 — short file: 3 s of a 120 BPM train (6 clicks < MIN_ONSET_FRAMES) → null', () => {
                const ch = makeTrain({ sampleRate: 44100, durationSec: 3, spacingSec: 0.5, count: 6 });
                expect(detectTempo([ch], 44100)).to.be.null;
            });

            it('TD-1.12 — 5 s silence + 15 s of a 120 BPM train (30 clicks) → 120 ± 1 (leading-silence trim, W-12)', () => {
                const ch = makeTrain({ sampleRate: 44100, durationSec: 20, spacingSec: 0.5, count: 30, offsetSec: 5 });
                const result = detectTempo([ch], 44100);
                expect(result, 'result should not be null').to.not.be.null;
                expect(result.bpm).to.be.within(119, 121);
            });

            it('TD-1.13 — NaN channel / NaN or 0 sampleRate → null; never throws', () => {
                const nan = new Float32Array(44100);
                nan[1000] = NaN;
                const inf = new Float32Array(44100);
                inf[1000] = Infinity;
                const train = train120(44100);
                expect(detectTempo([nan], 44100)).to.be.null;
                expect(detectTempo([inf], 44100)).to.be.null;
                expect(detectTempo([train], NaN)).to.be.null;
                expect(detectTempo([train], 0)).to.be.null;
                expect(detectTempo([], 44100)).to.be.null;
            });

            it('TD-1.14 — 20 s of a 120 BPM train, maxWindowSec = 10 → 120 ± 1 (window clamps to first 10 s)', () => {
                const result = detectTempo([train120(44100)], 44100, 10);
                expect(result, 'result should not be null').to.not.be.null;
                expect(result.bpm).to.be.within(119, 121);
            });

            it('TD-1.15 — 120 BPM train with 1568 Hz accent every 4th click (clicks20.wav shape) → 120 ± 1', () => {
                const ch = makeTrain({ sampleRate: 44100, durationSec: 20, spacingSec: 0.5, count: 40, accentEvery: 4 });
                const result = detectTempo([ch], 44100);
                expect(result, 'result should not be null').to.not.be.null;
                expect(result.bpm).to.be.within(119, 121);
            });
        });

        // Run mocha after all tests are defined
        window.addEventListener('load', () => {
            mocha.run();
        });
    </script>
</body>
</html>
