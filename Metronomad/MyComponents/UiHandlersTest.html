<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Handler Tests</title>
    <link rel="stylesheet" href="https://unpkg.com/mocha@10.2.0/mocha.css">
    <style>
        body { margin: 20px; font-family: sans-serif; }
        #mocha { margin-top: 20px; }
        .test-plan-ref { color: #888; font-size: 0.85em; }
    </style>
</head>
<body>
    <h1>Metronomad — UI Handlers Unit Tests</h1>
    <p class="test-plan-ref">Covers: Plan §3.2 V-01…V-07 (App/createMetronomadMethods.js, createMetronomadApp.js computed) — mock-VM pattern: factory methods spread first, then spies/overrides</p>
    <div id="mocha"></div>

    <script src="https://unpkg.com/mocha@10.2.0/mocha.js"></script>
    <script src="https://unpkg.com/chai@4.3.10/chai.js"></script>
    <script>mocha.setup('bdd');</script>

    <script type="module">
        import { createMetronomadData } from '../MyESModules/App/createMetronomadData.js';
        import { createMetronomadMethods } from '../MyESModules/App/createMetronomadMethods.js';
        import { createMetronomadApp } from '../MyESModules/App/createMetronomadApp.js';

        const { expect } = chai;

        // ============================================================
        // Mock-VM construction (skill convention): spread the factory
        // methods FIRST, then override with spies. Computeds from the app
        // factory are attached as live getters so `this.isReady` etc.
        // always reflect current state, like Vue.
        // ============================================================

        let appOptions = null;
        createMetronomadApp({
            createApp: (options) => { appOptions = options; return { mount() {} }; },
            dataConfig: createMetronomadData(),
            methodsConfig: createMetronomadMethods(),
            lifecycleConfig: {}
        });

        function makeFakeButton() {
            return {
                focused: false,
                disabled: false,
                focus() { this.focused = true; }
            };
        }

        function buildVm(overrides = {}) {
            // Data first, then factory methods, then test overrides (spies win).
            const vm = {
                ...createMetronomadData()(),
                ...createMetronomadMethods(),
                ...overrides
            };
            for (const [name, fn] of Object.entries(appOptions.computed)) {
                Object.defineProperty(vm, name, {
                    get: () => fn.call(vm),
                    configurable: true
                });
            }
            vm.$nextTick = (fn) => fn(); // synchronous flush in tests
            vm.$refs = { playStopBtn: makeFakeButton() };
            return vm;
        }

        function makeFakeEngine() {
            const engine = {
                calls: [],
                startSequence(params) { this.calls.push(['startSequence', params]); return { ok: true }; },
                stop() { this.calls.push(['stop']); },
                restart(params) { this.calls.push(['restart', params]); return { ok: true }; },
                preview(params) { this.calls.push(['preview', params]); return { ok: true }; }
            };
            return engine;
        }

        const fakeBuffer = { duration: 3.0 };

        // ============================================================
        // V-01 — onPlayToggle (single Play↔Stop toggle, spec §14.5)
        // ============================================================
        describe('V-01 onPlayToggle', () => {
            it('ready: starts the sequence with the current controls', () => {
                const vm = buildVm();
                vm.appState = 'ready';
                vm._buffer = fakeBuffer;
                vm.bpm = 140;
                vm.countInBeats = 6;
                vm.offset = 1.5;
                vm._engine = makeFakeEngine();

                vm.onPlayToggle();

                expect(vm._engine.calls).to.deep.equal([
                    ['startSequence', { buffer: fakeBuffer, bpm: 140, countInBeats: 6, offset: 1.5 }]
                ]);
            });

            it('countingIn / playing / preview: the toggle stops the running audio', () => {
                for (const setup of [
                    (target) => { target.appState = 'countingIn'; },
                    (target) => { target.appState = 'playing'; },
                    (target) => { target.isPreviewing = true; } // appState stays 'ready' during preview
                ]) {
                    const vm = buildVm();
                    setup(vm);
                    vm._engine = makeFakeEngine();

                    vm.onPlayToggle();

                    expect(vm._engine.calls).to.deep.equal([['stop']]);
                }
            });

            it('stop: focus returns to the Play/Stop button (U-04)', () => {
                const vm = buildVm();
                vm.appState = 'playing';
                vm._engine = makeFakeEngine();

                vm.onPlayToggle();

                expect(vm.$refs.playStopBtn.focused).to.equal(true);
            });

            it('noFile and decoding: no engine call at all', () => {
                for (const state of ['noFile', 'ready']) {
                    const vm = buildVm();
                    vm.appState = state;
                    if (state === 'ready') vm.decoding = { active: true, fileName: 'x.mp3' };
                    vm._engine = makeFakeEngine();

                    vm.onPlayToggle();

                    expect(vm._engine.calls).to.deep.equal([]);
                }
            });

            it('startSequence { ok: false }: friendly error, no state change', () => {
                const vm = buildVm();
                vm.appState = 'ready';
                vm._buffer = fakeBuffer;
                vm._engine = {
                    calls: [],
                    startSequence(params) { this.calls.push(['startSequence', params]); return { ok: false }; },
                    stop() { this.calls.push(['stop']); }
                };

                vm.onPlayToggle();

                expect(vm._engine.calls).to.have.length(1);
                expect(vm.errorMessage).to.not.equal('');
                expect(vm.appState).to.equal('ready');
            });
        });

        // ============================================================
        // V-05 — onFileDropped (decoding false on ALL paths; D8 non-blocking)
        // ============================================================
        describe('V-05 onFileDropped', () => {
            it('success: ready + _buffer stored + live-region announcement + decoding off', async () => {
                const vm = buildVm();
                vm._fileLoader = {
                    loadFile: async (file) => ({ ok: true, fileName: file.name, duration: 3.0, buffer: fakeBuffer })
                };

                await vm.onFileDropped({ name: 'song.mp3' });

                expect(vm.appState).to.equal('ready');
                expect(vm.fileName).to.equal('song.mp3');
                expect(vm._buffer).to.equal(fakeBuffer);
                expect(vm.announcement).to.equal('song.mp3 loaded');
                expect(vm.decoding.active).to.equal(false);
            });

            it('failure: errorMessage set, appState unchanged, decoding off (U-15/U-16)', async () => {
                const vm = buildVm();
                vm.appState = 'ready';
                vm._fileLoader = {
                    loadFile: async () => ({ ok: false, code: 'decode', message: "Couldn't decode broken.mp3 — the file may be corrupted" })
                };

                await vm.onFileDropped({ name: 'broken.mp3' });

                expect(vm.appState).to.equal('ready'); // last valid state kept
                expect(vm.errorMessage).to.contain('broken.mp3');
                expect(vm.decoding.active).to.equal(false);
            });

            it('loader throw: caught, friendly message, decoding off', async () => {
                const vm = buildVm();
                vm._fileLoader = { loadFile: async () => { throw new Error('boom'); } };

                await vm.onFileDropped({ name: 'x.mp3' });

                expect(vm.errorMessage).to.not.equal('');
                expect(vm.decoding.active).to.equal(false);
            });
        });

        // ============================================================
        // V-02 — onRestart (count-in/song sequence only; KB-5)
        // ============================================================
        describe('V-02 onRestart', () => {
            it('playing: restarts with the current controls and refocuses the toggle', () => {
                const vm = buildVm();
                vm.appState = 'playing';
                vm._buffer = fakeBuffer;
                vm.bpm = 100;
                vm.countInBeats = 2;
                vm.offset = 0.5;
                vm._engine = makeFakeEngine();

                vm.onRestart();

                expect(vm._engine.calls).to.deep.equal([
                    ['restart', { buffer: fakeBuffer, bpm: 100, countInBeats: 2, offset: 0.5 }]
                ]);
                expect(vm.$refs.playStopBtn.focused).to.equal(true);
            });

            it('countingIn: restarts (re-counts from the press)', () => {
                const vm = buildVm();
                vm.appState = 'countingIn';
                vm._buffer = fakeBuffer;
                vm._engine = makeFakeEngine();

                vm.onRestart();

                expect(vm._engine.calls).to.have.length(1);
                expect(vm._engine.calls[0][0]).to.equal('restart');
            });

            it('ready / noFile / preview: no-op (Restart is for the sequence — KB-5)', () => {
                for (const setup of [
                    (target) => { target.appState = 'ready'; },
                    (target) => { target.appState = 'noFile'; },
                    (target) => { target.isPreviewing = true; }
                ]) {
                    const vm = buildVm();
                    setup(vm);
                    vm._buffer = fakeBuffer;
                    vm._engine = makeFakeEngine();

                    vm.onRestart();

                    expect(vm._engine.calls).to.deep.equal([]);
                    expect(vm.$refs.playStopBtn.focused).to.equal(false);
                }
            });

            it('restart { ok: false }: friendly error, no crash', () => {
                const vm = buildVm();
                vm.appState = 'playing';
                vm._engine = { calls: [], restart: () => ({ ok: false }), stop() {} };

                vm.onRestart();

                expect(vm.errorMessage).to.not.equal('');
            });
        });

        // ============================================================
        // V-03 — BPM / count-in inputs (U-11) + steppers
        // ============================================================
        describe('V-03 BPM and count-in inputs', () => {
            it('onBpmInput clamps to 30–250 with the clamp hint (U-11)', () => {
                const vm = buildVm();
                vm.onBpmInput('251');
                expect(vm.bpm).to.equal(250);
                expect(vm.bpmClamped).to.equal(true);

                vm.onBpmInput('10');
                expect(vm.bpm).to.equal(30);
                expect(vm.bpmClamped).to.equal(true);

                vm.onBpmInput('180');
                expect(vm.bpm).to.equal(180);
                expect(vm.bpmClamped).to.equal(false);
            });

            it('onBpmInput: empty / non-numeric restores the previous valid value', () => {
                const vm = buildVm();
                vm.onBpmInput('180');
                vm.onBpmInput('');
                expect(vm.bpm).to.equal(180);
                expect(vm.bpmClamped).to.equal(false);

                vm.onBpmInput('abc');
                expect(vm.bpm).to.equal(180);
            });

            it('onBpmInput: first input empty (no previous value) → default 120', () => {
                const vm = buildVm();
                vm.onBpmInput('');
                expect(vm.bpm).to.equal(120);
            });

            it('onBpmStep: ±1 with clamp at the boundaries (U-11)', () => {
                const vm = buildVm();
                vm.bpm = 120;
                vm.onBpmStep(1);
                expect(vm.bpm).to.equal(121);
                expect(vm.bpmClamped).to.equal(false);

                vm.bpm = 250;
                vm.onBpmStep(1); // press + at the boundary
                expect(vm.bpm).to.equal(250);
                expect(vm.bpmClamped).to.equal(true);

                vm.bpm = 30;
                vm.onBpmStep(-1);
                expect(vm.bpm).to.equal(30);
                expect(vm.bpmClamped).to.equal(true);
            });

            it('onCountInInput clamps to 1–16', () => {
                const vm = buildVm();
                vm.onCountInInput('0');
                expect(vm.countInBeats).to.equal(1);

                vm.onCountInInput('99');
                expect(vm.countInBeats).to.equal(16);

                vm.onCountInInput('7');
                expect(vm.countInBeats).to.equal(7);

                vm.onCountInInput('abc');
                expect(vm.countInBeats).to.equal(7); // last valid restored (same pattern as BPM)
            });

            it('onCountInInput: non-numeric with no previous value → default 4 (T-30)', () => {
                const vm = buildVm();
                vm.onCountInInput('abc');
                expect(vm.countInBeats).to.equal(4);
            });
        });

        // ============================================================
        // V-04 — offset direct entry + scrubber (U-10)
        // ============================================================
        describe('V-04 offset entry and scrubber', () => {
            it('commitOffsetEntry: value beyond duration clamps to the end with the limit hint', () => {
                const vm = buildVm();
                vm.duration = 3.0;

                vm.commitOffsetEntry('1:05.2');

                expect(vm.offset).to.equal(3.0);
                expect(vm.offsetText).to.equal('0:03.0');
                expect(vm.offsetClamped).to.equal(true);
                expect(vm.offsetHint).to.equal('Offset limited to song length');
            });

            it('commitOffsetEntry: negative/unparseable input keeps the offset, shows the format hint', () => {
                const vm = buildVm();
                vm.duration = 3.0;
                vm.offset = 1.2;
                vm.offsetText = '0:01.2';

                vm.commitOffsetEntry('abc');

                expect(vm.offset).to.equal(1.2);
                expect(vm.offsetText).to.equal('0:01.2'); // reverted to the last valid value
                expect(vm.offsetClamped).to.equal(true);
                expect(vm.offsetHint).to.equal('Enter the time as mm:ss.t');

                vm.commitOffsetEntry('-1');
                expect(vm.offset).to.equal(1.2);
                expect(vm.offsetHint).to.equal('Enter the time as mm:ss.t');
            });

            it('commitOffsetEntry: in-range value commits cleanly and clears the hint', () => {
                const vm = buildVm();
                vm.duration = 3.0;

                vm.commitOffsetEntry('1:05.2'); // leave the hint on
                expect(vm.offsetClamped).to.equal(true);

                vm.commitOffsetEntry('0:01.2');

                expect(vm.offset).to.equal(1.2);
                expect(vm.offsetText).to.equal('0:01.2');
                expect(vm.offsetClamped).to.equal(false);
                expect(vm.offsetHint).to.equal('');
            });

            it('onOffsetScrub: scrubber value syncs offset + offsetText (U-10)', () => {
                const vm = buildVm();
                vm.duration = 3.0;

                vm.onOffsetScrub('1.5');

                expect(vm.offset).to.equal(1.5);
                expect(vm.offsetText).to.equal('0:01.5');
                expect(vm.offsetClamped).to.equal(false);

                vm.onOffsetScrub('not-a-number'); // defensive: ignore garbage
                expect(vm.offset).to.equal(1.5);
            });
        });

        // ============================================================
        // U-08 — onPreview (3 s preview clamped to the song end, D2)
        // ============================================================
        describe('U-08 onPreview', () => {
            it('ready: previews from the current offset', () => {
                const vm = buildVm();
                vm.appState = 'ready';
                vm._buffer = fakeBuffer;
                vm.offset = 1.0;
                vm._engine = makeFakeEngine();

                vm.onPreview();

                expect(vm._engine.calls).to.deep.equal([
                    ['preview', { buffer: fakeBuffer, offset: 1.0 }]
                ]);
            });

            it('not ready (noFile / decoding / sequence running / preview): no-op', () => {
                for (const setup of [
                    (target) => { target.appState = 'noFile'; },
                    (target) => { target.appState = 'ready'; target.decoding.active = true; },
                    (target) => { target.appState = 'countingIn'; },
                    (target) => { target.isPreviewing = true; }
                ]) {
                    const vm = buildVm();
                    setup(vm);
                    vm._buffer = fakeBuffer;
                    vm._engine = makeFakeEngine();

                    vm.onPreview();

                    expect(vm._engine.calls).to.deep.equal([]);
                }
            });

            it('preview { ok: false }: friendly error (e.g. offset at the song end)', () => {
                const vm = buildVm();
                vm.appState = 'ready';
                vm._buffer = fakeBuffer;
                vm._engine = { calls: [], preview: () => ({ ok: false }), stop() {} };

                vm.onPreview();

                expect(vm.errorMessage).to.not.equal('');
            });
        });

        // ============================================================
        // V-07 — engine state → appState + live-region announcements
        // (event names are the engine's onStateChange contract, Phase 4)
        // ============================================================
        describe('V-07 engine state mapping', () => {
            it("'countingIn' → appState countingIn + 'Count-in started'", () => {
                const vm = buildVm();
                vm.onEngineStateChange('countingIn');
                expect(vm.appState).to.equal('countingIn');
                expect(vm.announcement).to.equal('Count-in started');
            });

            it("'playing' → appState playing + 'Song started'", () => {
                const vm = buildVm();
                vm.appState = 'countingIn';
                vm.onEngineStateChange('playing');
                expect(vm.appState).to.equal('playing');
                expect(vm.announcement).to.equal('Song started');
            });

            it("'preview' → isPreviewing true (appState stays ready) + 'Preview started'", () => {
                const vm = buildVm();
                vm.appState = 'ready';
                vm.onEngineStateChange('preview');
                expect(vm.appState).to.equal('ready');
                expect(vm.isPreviewing).to.equal(true);
                expect(vm.announcement).to.equal('Preview started');
            });

            it("'stopped' → ready + 'Stopped' + position reset to the offset (U-04)", () => {
                const vm = buildVm();
                vm.appState = 'countingIn';
                vm.fileName = 'song.mp3';
                vm.offset = 1.0;
                vm.songPosition = 1.7;
                vm.onEngineStateChange('stopped');
                expect(vm.appState).to.equal('ready');
                expect(vm.isPreviewing).to.equal(false);
                expect(vm.songPosition).to.equal(1.0);
                expect(vm.announcement).to.equal('Stopped');
            });

            it("'ended' → ready + 'Song ended' + position reset to the offset (KB-4)", () => {
                const vm = buildVm();
                vm.appState = 'playing';
                vm.fileName = 'song.mp3';
                vm.offset = 0.0;
                vm.songPosition = 2.9;
                vm.onEngineStateChange('ended');
                expect(vm.appState).to.equal('ready');
                expect(vm.songPosition).to.equal(0.0);
                expect(vm.announcement).to.equal('Song ended');
            });

            it("'previewEnded' → isPreviewing false + 'Preview stopped' + position reset (U-09)", () => {
                const vm = buildVm();
                vm.appState = 'ready';
                vm.isPreviewing = true;
                vm.offset = 1.0;
                vm.songPosition = 2.5;
                vm.onEngineStateChange('previewEnded');
                expect(vm.isPreviewing).to.equal(false);
                expect(vm.songPosition).to.equal(1.0);
                expect(vm.announcement).to.equal('Preview stopped');
            });

            it('onAudioInterrupted → the interruption announcement (U-18/D10)', () => {
                const vm = buildVm();
                vm.onAudioInterrupted();
                expect(vm.announcement).to.equal('Audio was interrupted — press Play to try again');
            });
        });

        // ============================================================
        // Phase 6 wiring — the engine state machine drives the beat-dot
        // visual clock, and visibilitychange delegates to _beatDots.
        // ============================================================
        describe('beat dots wiring (Phase 6)', () => {
            it('countingIn starts the visual clock exactly once; the playing flip does not restart it', () => {
                const calls = [];
                const vm = buildVm();
                vm._engine = makeFakeEngine();
                vm._beatDots = {
                    startVisualClock: () => calls.push('start'),
                    stopVisualClock: () => calls.push('stop')
                };

                vm.onEngineStateChange('countingIn');
                vm.onEngineStateChange('playing'); // same sequence — loop continues

                expect(calls).to.deep.equal(['start']);
            });

            it('stopped / ended / previewEnded stop the visual clock', () => {
                for (const terminal of ['stopped', 'ended', 'previewEnded']) {
                    const calls = [];
                    const vm = buildVm();
                    vm.fileName = 'song.mp3';
                    vm.appState = 'playing';
                    vm.offset = 1.0;
                    vm._engine = makeFakeEngine();
                    vm._beatDots = {
                        startVisualClock: () => calls.push('start'),
                        stopVisualClock: () => calls.push('stop')
                    };

                    vm.onEngineStateChange(terminal);

                    expect(calls).to.deep.equal(['stop']);
                }
            });

            it('without _beatDots (audio init failed) the state handler is safe', () => {
                const vm = buildVm();
                vm._engine = makeFakeEngine();
                vm.onEngineStateChange('countingIn'); // no throw
                expect(vm.appState).to.equal('countingIn');
            });

            it('onVisibilityChange delegates to _beatDots.onVisibilityChange(vm)', () => {
                const calls = [];
                const vm = buildVm();
                vm._beatDots = {
                    startVisualClock: () => calls.push('start'),
                    stopVisualClock: () => calls.push('stop'),
                    onVisibilityChange: (v) => calls.push(['visibility', v === vm])
                };

                vm.onVisibilityChange();

                expect(calls).to.deep.equal([['visibility', true]]);
            });
        });

        // ============================================================
        // V-06 — computed: isParamLocked / isSequenceRunning / isReady
        // ============================================================
        describe('V-06 computed', () => {
            it('isParamLocked: true in countingIn / playing / preview, false in ready (U-12)', () => {
                const cases = [
                    ['countingIn', false, true],
                    ['playing', false, true],
                    ['ready', true, true],   // preview: appState stays 'ready'
                    ['ready', false, false]
                ];
                for (const [state, previewing, expected] of cases) {
                    const vm = buildVm();
                    vm.appState = state;
                    vm.isPreviewing = previewing;
                    expect(vm.isParamLocked).to.equal(expected), `state=${state} previewing=${previewing}`;
                }
            });

            it('isSequenceRunning: countingIn/playing only — preview excluded (KB-5)', () => {
                const cases = [
                    ['countingIn', true],
                    ['playing', true],
                    ['ready', false],
                    ['noFile', false]
                ];
                for (const [state, expected] of cases) {
                    const vm = buildVm();
                    vm.appState = state;
                    expect(vm.isSequenceRunning).to.equal(expected), `state=${state}`;
                }
            });

            it('isReady: ready without an in-flight decode; false while decoding', () => {
                const vm = buildVm();
                vm.appState = 'ready';
                expect(vm.isReady).to.equal(true);

                vm.decoding = { active: true, fileName: 'x.mp3' };
                expect(vm.isReady).to.equal(false);
            });
        });

        // ============================================================
        // U-19 — suspended/blocked AudioContext on Play (D10)
        // ============================================================
        describe('U-19 context resume on Play', () => {
            it('running context: no resume call, sequence starts (V-01 path)', () => {
                const vm = buildVm();
                vm.appState = 'ready';
                vm._buffer = fakeBuffer;
                vm._clock = { state: 'running', resumeCalls: 0, resume() { this.resumeCalls++; return Promise.resolve(); } };
                vm._engine = makeFakeEngine();

                vm.onPlayToggle();

                expect(vm._clock.resumeCalls).to.equal(0);
                expect(vm._engine.calls).to.have.length(1);
            });

            it('suspended context that resumes: sequence starts after resume', async () => {
                const vm = buildVm();
                vm.appState = 'ready';
                vm._buffer = fakeBuffer;
                vm._clock = { state: 'suspended', resumeCalls: 0, resume() { this.resumeCalls++; return Promise.resolve(); } };
                vm._engine = makeFakeEngine();

                await vm.onPlayToggle();

                expect(vm._clock.resumeCalls).to.equal(1);
                expect(vm._engine.calls).to.have.length(1);
                expect(vm.errorMessage).to.equal('');
            });

            it('resume rejected: friendly error, no sequence (U-19)', async () => {
                const vm = buildVm();
                vm.appState = 'ready';
                vm._buffer = fakeBuffer;
                vm._clock = { state: 'suspended', resume() { return Promise.reject(new Error('NotAllowedError')); } };
                vm._engine = makeFakeEngine();

                await vm.onPlayToggle();

                expect(vm.errorMessage).to.equal('Audio is blocked by the browser — tap again to enable sound');
                expect(vm._engine.calls).to.deep.equal([]);
                expect(vm.appState).to.equal('ready'); // button is not dead
            });

            it('resume that never settles: ~750 ms timeout → friendly error (SCHEDULER.RESUME_TIMEOUT_MS)', async () => {
                const vm = buildVm();
                vm.appState = 'ready';
                vm._buffer = fakeBuffer;
                vm._clock = { state: 'suspended', resume() { return new Promise(() => {}); } };
                vm._engine = makeFakeEngine();

                const t0 = Date.now();
                await vm.onPlayToggle();

                expect(Date.now() - t0).to.be.greaterThan(700);
                expect(vm.errorMessage).to.equal('Audio is blocked by the browser — tap again to enable sound');
                expect(vm._engine.calls).to.deep.equal([]);
            });
        });

        // Run mocha after all tests are defined
        window.addEventListener('load', () => {
            mocha.run();
        });
    </script>
</body>
</html>
